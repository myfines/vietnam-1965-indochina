l_simp_chinese:
 v65chapter_reports:0 "战报生意"
 v65chapter_reports_desc:0 "战果、军需和媒体可以互相换取资源，也让虚报与真实伤亡同时留在账本里。"
 v65chapter_relations:0 "跨军区私人关系"
 v65chapter_relations_desc:0 "朴世诚在中央军官、南越代理与岛上势力之间分配职位、合同和指挥权。"
 v65chapter_island:0 "私人生活与海岛"
 v65chapter_island_desc:0 "私人舒适、日海收益与富国岛基地争用同一笔资金和关系网。"
 v65chapter.100.t:0 "市府缴获的钱怎么分"
 v65chapter.100.d:0 "城里缴获的一笔巨款摆在桌上：军需官要补给，地方军官要分成，日海的人则已经带来一只‘代管’账箱。朴可以把账留在自己人手里，也可以先喂饱地方武装，省得他们另找收入。"
 v65chapter.100.a:0 "交日海代管，底账留在司令部"
 v65chapter.100.b:0 "给地方军官分成，免得他们自筹"
 v65chapter.101.t:0 "谁拿走空缺的战功"
 v65chapter.101.d:0 "阵亡、缴获和宣传稿各有一本账。把战功挂在中央军官名下，能换来下一季任命；让南越协同部队分走名额，则有人替朴守住地方征募和军需通道。"
 v65chapter.101.a:0 "给蔡系军官留足晋升名额"
 v65chapter.101.b:0 "把署名与军需份额给盟军"
 v65chapter.102.t:0 "把宋康茂拍成英雄"
 v65chapter.102.d:0 "日海映像想把未经核实的战报拍成连续电影。观众会记住英雄，也可能记住片尾滚过的捐款与阵亡名单。"
 v65chapter.102.a:0 "拍摄英雄系列片"
 v65chapter.102.b:0 "改拍部队纪实片"
 v65chapter.110.t:0 "任命谁来守住关系网"
 v65chapter.110.d:0 "空输、情报和后勤军官都要求独立权限。亲信职位有限，选择会决定朴系将来更依靠中央军官还是地方代理。"
 v65chapter.110.a:0 "把名额留给中央参谋"
 v65chapter.110.b:0 "让地方联络官带队"
 v65chapter.111.t:0 "与谁共享机密渠道"
 v65chapter.111.d:0 "CIA愿以庇护和工业投资换取情报与战果；富国岛军政长官则要求更多补给。两条关系都能用，资源却有限。"
 v65chapter.111.a:0 "优先经营美方渠道"
 v65chapter.111.b:0 "把权限交给岛上代理"
 v65chapter.112.t:0 "接受南越军官的条件"
 v65chapter.112.d:0 "南越军官愿意交出兵员与地方头衔，但要求优先获得武器和家属保护。答应之后，归仁之外的武装也会有自己的主张。"
 v65chapter.112.a:0 "给地方军官武器份额"
 v65chapter.112.b:0 "保留军火与任命权"
 v65chapter.113.t:0 "团练要不要自己选头领"
 v65chapter.113.d:0 "地主愿意出钱组织地方武装，条件是头衔与指挥权按家产和贡献分配。中央可以接受这套秩序，也可以坚持统一任命。"
 v65chapter.113.a:0 "承认地主推举的团练头领"
 v65chapter.113.b:0 "团练归南越军区统一编组"
 v65chapter.120.t:0 "三十分钟的每日简报"
 v65chapter.120.d:0 "第108章里朴把日常事务交给副官，每天只花半小时到一小时看概要，剩下时间留给自己；他抽着烟看窗外，还觉得特战司令官的日子过得太舒服。"
 v65chapter.120.a:0 "继续把杂务交给副官"
 v65chapter.120.b:0 "把简报时间还给前线轮值"
 v65chapter.121.t:0 "归仁码头的遮阳伞"
 v65chapter.121.d:0 "第41章里朴在归仁码头钓鱼，遮阳伞下有越南女仆和警卫；他照着一份夸大的战绩簿，把这趟闲钓也过成司令官的待遇。"
 v65chapter.121.a:0 "让警卫继续守着钓点"
 v65chapter.121.b:0 "借出行检查港口值勤"
 v65chapter.122.t:0 "穿便服的庆功会"
 v65chapter.122.d:0 "第115章，延坪岛炮击回应乏力，朴世诚却和金勇培换上便服办起‘庆功会’。自掏腰包继续庆祝，或者让日海替这场胜利布置场面、收走宣传收益。"
 v65chapter.122.a:0 "照旧庆祝，战报别提效果"
 v65chapter.122.b:0 "让日海把庆功会拍成胜利宣传"
 v65chapter.123.t:0 "富国岛的钱投向哪里"
 v65chapter.123.d:0 "岛上的基地、码头和官邸都在扩建。把资源投向私人安稳，或把钱留给轮训和港口周转，都会改变这座岛的用途。"
 v65chapter.123.a:0 "用私房钱修官邸"
 v65chapter.123.b:0 "扩建仓库与轮训码头"
