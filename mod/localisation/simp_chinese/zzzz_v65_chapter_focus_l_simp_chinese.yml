 v65chapter_pks_island_music_room:0 "留一间安静的休息室"
 v65chapter_pks_island_music_room_desc:0 "带韩冥国驻越韩国军，首都机械化师团，第一机械化步兵旅团（白虎团）旅团长，猛虎地区特攻（韩国叫特种部队，一般称之为特攻部队，不过国内有时仍会翻译成特种部队）大队大队长（注1），朴世诚准将，正悠闲的躺在一把太阳伞下的椅子上，哼着只有自己熟知的小曲。"
 v65chapter_svn_island_music_room:0 "留一间安静的休息室"
 v65chapter_svn_island_music_room_desc:0 "带韩冥国驻越韩国军，首都机械化师团，第一机械化步兵旅团（白虎团）旅团长，猛虎地区特攻（韩国叫特种部队，一般称之为特攻部队，不过国内有时仍会翻译成特种部队）大队大队长（注1），朴世诚准将，正悠闲的躺在一把太阳伞下的椅子上，哼着只有自己熟知的小曲。"
 v65chapter_pks_island_private_dining:0 "只请熟人赴宴"
 v65chapter_pks_island_private_dining_desc:0 "今晚是延坪冲突后，金容培私人的‘庆功会’，虽然韩国的炮火反制只是帮朝鲜的农民松了松土地，但这并不妨碍，韩国方面大肆宣传己方的胜利。 嗯，这就是所谓的如胜。 金容培这次把朴世诚叫来的最主要原因，则是因为朴正熙认为己方的炮火反制取得的效果不佳，有一种再次派遣特攻队发起反制行动的想法，所以便把朴世诚叫来提"
 v65chapter_svn_island_private_dining:0 "只请熟人赴宴"
