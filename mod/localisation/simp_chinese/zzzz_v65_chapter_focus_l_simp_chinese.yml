 v65chapter_reports:0 "战报生意"
 v65chapter_reports_desc:0 "战果、军需和媒体可以互相换取资源，也让虚报与真实伤亡同时留在账本里。"
 v65chapter_relations:0 "跨军区私人关系"
 v65chapter_relations_desc:0 "朴世诚在中央军官、南越代理与岛上势力之间分配职位、合同和指挥权。"
 v65chapter_island:0 "私人生活与海岛"
 v65chapter_island_desc:0 "私人舒适、日海收益与富国岛基地争用同一笔资金和关系网。"
 v65chapter.100.t:0 "市府缴获的钱怎么分"
 v65chapter.100.d:0 "正当卢泰愚在纠结要不要把自己那份给吐出来的时候，突然又朴世诚继续说道，“都送到日海公司去，这笔钱肯定是归仁市政府的公共资金，我先暂时帮南越政府保管一下，毕竟这兵荒马乱的，万一遗失了，那可就不好了。” “耶、耶。”卢泰愚这才如梦初醒的赶忙回应道。"
 v65chapter.100.a:0 "交日海代管，底账留在司令部"
 v65chapter.100.b:0 "给地方军官分成，免得他们自筹"
 v65chapter.101.t:0 "谁拿走空缺的战功"
 v65chapter.101.d:0 "乔治继续说道，“这人到底是什么身份呢，对于我们来说其实并不重要，不过我个人认为，一个越共方面的高级将军，就这么轻松的被你们和南越方面抓获.........” 听到这朴世诚立马就明白了，他们大概率是知道了，自己指鹿为马的操作，但看起来好像并不打算拆穿自己，而是也要想要分润一些功劳呀。"
 v65chapter.101.a:0 "给蔡系军官留足晋升名额"
 v65chapter.101.b:0 "把署名与军需份额给盟军"
 v65chapter.102.t:0 "把宋康茂拍成英雄"
 v65chapter.102.d:0 "随着特战司的反制行动成功之后，朴世诚为了继续提升特战司的知名度，并进一步坐实反制行动的成功。 便直接以当初的那个剧本为题材，以宋康茂少领作为主角，准备来拍一些电影出来。 按照朴世诚的草案，电影要形成系列，也就是说有好几部，现在拍摄的第一部，剧情很简单，甚至是有点傻瓜。"
 v65chapter.102.a:0 "拍摄英雄系列片"
 v65chapter.102.b:0 "改拍部队纪实片"
 v65chapter.110.t:0 "任命谁来守住关系网"
 v65chapter.110.d:0 "自从那场激烈的会议室‘战争’之后，第一旅团内部可谓是进行了一场风云突变般的换血，首先是朴世诚，直接以大领的军衔，代理了旅团长的职务，然后崔顺勇也跟着升任了旅团副参谋长，朴世诚的陆士同期同学，徐泉则调任了驻越韩国军司令部反谍科科长的位子，就是卢泰愚之前的岗位，他的军衔也相应地从尉官变成了校官，现在已经"
 v65chapter.110.a:0 "把名额留给中央参谋"
 v65chapter.110.b:0 "让地方联络官带队"
 v65chapter.111.t:0 "与谁共享机密渠道"
 v65chapter.111.d:0 "乔治继续说道，“这人到底是什么身份呢，对于我们来说其实并不重要，不过我个人认为，一个越共方面的高级将军，就这么轻松的被你们和南越方面抓获.........” 听到这朴世诚立马就明白了，他们大概率是知道了，自己指鹿为马的操作，但看起来好像并不打算拆穿自己，而是也要想要分润一些功劳呀。"
 v65chapter.111.a:0 "优先经营美方渠道"
 v65chapter.111.b:0 "把权限交给岛上代理"
 v65chapter.112.t:0 "接受南越军官的条件"
 v65chapter.112.d:0 "已经成为南越国军归仁市守备司令官的阮文武少将，这时突然带着有些阴沉的语气，说道，“司令官、先生们，我也有个建议，为了以防出现，有人投降的情况发生，还应该让那些人把家眷，都送到富国岛去，只要他们这些留在南越地区的抵抗的人，有谁胆敢向越共投降，那就杀他们全家。"
 v65chapter.112.a:0 "给地方军官武器份额"
 v65chapter.112.b:0 "保留军火与任命权"
 v65chapter.113.t:0 "团练要不要自己选头领"
 v65chapter.113.d:0 "朴世诚在就任驻越韩国军机动部队司令官后，并没有在立即就出动部队，去开展扫荡行动，而是一方面集结部队之余，给整个平定省那帮土豪、大地主们发了一个意见征求，并且还说明，只要谁能把这份意见征求稿写的好，写得深合朴世诚司令官的心意的话，那就会被南越政府授予官位。"
 v65chapter.113.a:0 "承认地主推举的团练头领"
 v65chapter.113.b:0 "团练归南越军区统一编组"
 v65chapter.120.t:0 "三十分钟的每日简报"
 v65chapter.120.d:0 "如果没有紧急的事情，朴世诚最多每天就花个半小时到一小时的时间，对部队情况有个大致的了解，这就行了。 在加上特战司的组织模式，跟公司很像，大家都是各司其职，做好自己的那一块，做出成绩就够了，其他因素根本就用不着考虑，因此特战司办事的效率还特别的高。"
 v65chapter.120.a:0 "继续把杂务交给副官"
 v65chapter.120.b:0 "把简报时间还给前线轮值"
 v65chapter.121.t:0 "归仁码头的遮阳伞"
 v65chapter.121.d:0 "带韩冥国驻越韩国军，首都机械化师团，第一机械化步兵旅团（白虎团）旅团长，猛虎地区特攻（韩国叫特种部队，一般称之为特攻部队，不过国内有时仍会翻译成特种部队）大队大队长（注1），朴世诚准将，正悠闲的躺在一把太阳伞下的椅子上，哼着只有自己熟知的小曲。"
 v65chapter.121.a:0 "让警卫继续守着钓点"
 v65chapter.121.b:0 "借出行检查港口值勤"
 v65chapter.122.t:0 "穿便服的庆功会"
 v65chapter.122.d:0 "今晚是延坪冲突后，金容培私人的‘庆功会’，虽然韩国的炮火反制只是帮朝鲜的农民松了松土地，但这并不妨碍，韩国方面大肆宣传己方的胜利。 嗯，这就是所谓的如胜。 金容培这次把朴世诚叫来的最主要原因，则是因为朴正熙认为己方的炮火反制取得的效果不佳，有一种再次派遣特攻队发起反制行动的想法，所以便把朴世诚叫来提"
 v65chapter.122.a:0 "照旧庆祝，战报别提效果"
 v65chapter.122.b:0 "让日海把庆功会拍成胜利宣传"
 v65chapter.123.t:0 "富国岛的钱投向哪里"
 v65chapter.123.d:0 "李明翰微微点了点头，然后赶紧说道，“司令官，目前富国岛上一共有三方部队，分别是美空军的一个联合作战联队，南越国军的富国岛守备司令部，以及我军的空输三旅团。” “目前富国岛的防御较为完备，面向柬埔寨大陆一侧的岸防工事已经构筑完毕，岛屿西南一侧有两个机场也已经投入使用，码头也早已建设完毕，目前南越国军"
 v65chapter.123.a:0 "用私房钱修官邸"
 v65chapter.123.b:0 "扩建仓库与轮训码头"
