 v65chapter_pks_relations_special_command:0 "建立直属指挥渠道"
 v65chapter_pks_relations_special_command_desc:0 "过了半晌，朴正熙随手把文件丢在了身前的茶几上，很是淡然的对着金钟泌发问道，“就三个旅团的规模会不会太少了点？还有为什么特战司仍旧要隶属于陆军？” 金钟泌赶忙点了点头回答道，“卡咔，一开始组建特战司，就把部队扩充太多的话，很有可能会使得美方反对，规模小一点话，不至于过分刺激美方，后期等特战司组建完毕后"
 v65chapter_svn_relations_special_command:0 "建立直属指挥渠道"
