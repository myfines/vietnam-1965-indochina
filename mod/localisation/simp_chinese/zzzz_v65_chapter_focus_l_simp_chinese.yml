 v65chapter_pks_root_desc:0 "从战报、军官关系或富国岛生意中选择一条路线。"
 v65chapter_svn_root_desc:0 "接管后延续既有路线；已领取的剧情奖励不会重复发放。"
 v65chapter_pks_reports_first_report:0 "归仁的第一份捷报"
 v65chapter_pks_reports_first_report_desc:0 "崔顺勇这下子立马就明白了，脸上的笑容也是止不住了，赶紧发问道，“大队长，那咱们报敌人有300多的伤亡？” 实际的伤亡肯定没有这么多，把所有的越共游击队和民兵算上连200人都没有，更何况还有不少人逃掉了，就算是把村里逃的比较慢的村民加上，也不会超过300人。"
