 v65chapter_pks_island_quiet_harbor_desc:0 "如果搞不定的人或者事，那就找徐泉，他会找我的，我来负责解决。”朴世诚抖了抖手中的烟灰，淡淡的说道。 “还有.......” --------------------------- 1968年2月26日，上午十时许。"
