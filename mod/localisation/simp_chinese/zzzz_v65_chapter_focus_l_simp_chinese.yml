 v65chapter_pks_reports_casualty_ledger:0 "另立伤亡账"
 v65chapter_pks_reports_casualty_ledger_desc:0 "崔顺勇干嘛拿起自己手中的文件说道，“今早在西冶村西部的战斗中，歼灭的越共游击队员达到了53人，俘虏了11人，在战斗中我军伤亡110人，其中阵亡35人，受伤75人。” 这算个毛啊。 朴世诚一听到这满脸不在乎的摆手说道，“我还以为多大点事呢，不就伤亡比有些难看嘛，没事。"
