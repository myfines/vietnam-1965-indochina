 v65chapter_pks_island_household:0 "安排官邸日常"
 v65chapter_pks_island_household_desc:0 "朴世诚翘着二郎腿，正悠闲的看着手中的报纸，在他身后朴世诚的第二任越南女仆，正用双手温柔的给他捏着肩膀。 朴世诚早晨的时候还在西冶村，这还没到中午就出现在了永盛乡，这可是朴世诚有怎么瞬移之类的超能力，而是朴世诚在今早，布置完战术后，就直接就乘坐着直升机回来了。"
