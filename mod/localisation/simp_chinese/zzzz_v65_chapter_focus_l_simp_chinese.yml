 v65chapter_pks_relations_militia_terms:0 "以土地和头衔招揽团练"
 v65chapter_pks_relations_militia_terms_desc:0 "朴世诚在就任驻越韩国军机动部队司令官后，并没有在立即就出动部队，去开展扫荡行动，而是一方面集结部队之余，给整个平定省那帮土豪、大地主们发了一个意见征求，并且还说明，只要谁能把这份意见征求稿写的好，写得深合朴世诚司令官的心意的话，那就会被南越政府授予官位。"
 v65chapter_svn_relations_militia_terms:0 "以土地和头衔招揽团练"
 v65chapter_svn_relations_militia_terms_desc:0 "朴世诚在就任驻越韩国军机动部队司令官后，并没有在立即就出动部队，去开展扫荡行动，而是一方面集结部队之余，给整个平定省那帮土豪、大地主们发了一个意见征求，并且还说明，只要谁能把这份意见征求稿写的好，写得深合朴世诚司令官的心意的话，那就会被南越政府授予官位。"
 v65chapter_pks_relations_network_compact:0 "把关系写成长期承诺"
 v65chapter_pks_relations_network_compact_desc:0 "今天把大家召集在这里，主要是说两件事，一个就是刚刚阮上校问的，大家都不用担心我走了之后的收益，只要驻越韩国军还在越南一天，那每月都会有一笔钱，从日海公司划到诸位的账户之中。” 朴世诚这算是给在场的所有人都吃了一颗定心丸。"
 v65chapter_svn_relations_network_compact:0 "把关系写成长期承诺"
 v65chapter_svn_relations_network_compact_desc:0 "今天把大家召集在这里，主要是说两件事，一个就是刚刚阮上校问的，大家都不用担心我走了之后的收益，只要驻越韩国军还在越南一天，那每月都会有一笔钱，从日海公司划到诸位的账户之中。” 朴世诚这算是给在场的所有人都吃了一颗定心丸。"
 v65chapter_pks_island_comfort_budget:0 "把军营过成官邸"
 v65chapter_pks_island_comfort_budget_desc:0 "如果没有紧急的事情，朴世诚最多每天就花个半小时到一小时的时间，对部队情况有个大致的了解，这就行了。 在加上特战司的组织模式，跟公司很像，大家都是各司其职，做好自己的那一块，做出成绩就够了，其他因素根本就用不着考虑，因此特战司办事的效率还特别的高。"
 v65chapter_svn_island_comfort_budget:0 "把军营过成官邸"
