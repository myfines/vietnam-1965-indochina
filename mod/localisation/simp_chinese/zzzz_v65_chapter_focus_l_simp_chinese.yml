 v65chapter_pks_island_island_estate:0 "给日海留一块码头"
 v65chapter_pks_island_island_estate_desc:0 "李明翰微微点了点头，然后赶紧说道，“司令官，目前富国岛上一共有三方部队，分别是美空军的一个联合作战联队，南越国军的富国岛守备司令部，以及我军的空输三旅团。” “目前富国岛的防御较为完备，面向柬埔寨大陆一侧的岸防工事已经构筑完毕，岛屿西南一侧有两个机场也已经投入使用，码头也早已建设完毕，目前南越国军"
