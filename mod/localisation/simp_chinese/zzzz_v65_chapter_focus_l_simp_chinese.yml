 v65chapter_pks_island_phu_quoc_plan:0 "把富国岛留作后方"
 v65chapter_pks_island_phu_quoc_plan_desc:0 "李威炎听到富国岛的时候，眉头一下子就皱了起来，想了半晌才想起来，富国岛不就是越南最南边靠近柬埔寨的那个岛么，而且军政长官这个职位，在南越共和国里可没有啊，朴世诚这是让自己出大血，去主动创造一个职位。"
