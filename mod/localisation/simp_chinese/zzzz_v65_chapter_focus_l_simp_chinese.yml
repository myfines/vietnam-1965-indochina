 v65chapter_pks_relations_south_partners:0 "让南越军官入账"
 v65chapter_pks_relations_south_partners_desc:0 "这个城市管理大队成立后，在整个归仁市那可是横着走的存在，除了韩军和美军他们不敢去惹，以及南越政府官员和国军不去主动招惹以外，其他人都只有被他们欺负的份，平民们看到他们了，简直就跟遇到了瘟神一样，跑都来不及跑。"
