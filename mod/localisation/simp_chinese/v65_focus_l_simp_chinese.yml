l_simp_chinese:
 v65_SVN_briefing:0 "两场战争，一个西贡"
 v65_SVN_briefing_desc:0 "北部的阵地与南方的乡村同时需要兵力。中央还要面对军区、远征军和首都驻军各自的利益。"
 v65_SVN_command:0 "西贡的战争"
 v65_SVN_command_desc:0 "前线的战报与乡村的传闻指向两个不同的战场。总统府必须先弄清自己还能指挥哪些部队。"
 v65_SVN_roster:0 "清点军区名册"
 v65_SVN_roster_desc:0 "编制表上的番号并不等于听令的兵力。把军饷和实际驻地对照，才能重建中央的命令链。"
 v65_SVN_reports:0 "让真实战报抵达西贡"
 v65_SVN_reports_desc:0 "层层修饰的捷报正在掩盖伤亡。允许前线越级报告，会触怒军官，却能减少下一次误判。"
 v65_SVN_liaison:0 "驻军联络官"
 v65_SVN_liaison_desc:0 "省长、军区与警察使用不同的消息网络。派出联络官，将他们的承诺变成可以核查的调动。"
 v65_SVN_reserve:0 "中央机动预备队"
 v65_SVN_reserve_desc:0 "每次危机都向别的军区借兵，中央就欠下一笔政治债。西贡需要一支能立即出动的预备队。"
 v65_SVN_unity:0 "重新签署军区协议"
 v65_SVN_unity_desc:0 "岘港和归仁的司令官不会交出全部权力。以军费换取共同作战，可以先保住脆弱的联盟。"
 v65_SVN_front:0 "守住十七度线"
 v65_SVN_front_desc:0 "北部阵地承受着最直接的压力。这里的任务是守住屏障，避免把整场战争押在一次北进上。"
 v65_SVN_dmz:0 "广治防御工事"
 v65_SVN_dmz_desc:0 "工兵把道路、村庄与火力点编入同一张图。防线的价值在于赢得时间，而非制造漂亮的进攻箭头。"
 v65_SVN_hue:0 "顺化补给仓"
 v65_SVN_hue_desc:0 "广治阵地一旦缺粮，顺化就会成为下一道战线。先让后方仓库储满弹药，再谈反击。"
 v65_SVN_rotation:0 "轮换疲惫的营"
 v65_SVN_rotation_desc:0 "连续驻防正在耗尽基层骨干。把部队轮出阵地整训，才能让下一批增援不再只是填补伤亡。"
 v65_SVN_corridor:0 "一号公路护送队"
 v65_SVN_corridor_desc:0 "沿海交通线将北部驻军与港口连在一起。运输护送应成为常设任务，而不是临时拼凑。"
 v65_SVN_hold_line:0 "有限战争指令"
 v65_SVN_hold_line_desc:0 "总参谋部正式放弃冒进的时间表。将防御纵深与机动预备队结合，使战线能够承受一次挫折。"
 v65_SVN_villages:0 "乡村不是空白地带"
 v65_SVN_villages_desc:0 "离开公路，政府的印章往往失去效力。争取村庄的合作，比在地图上涂满颜色更难。"
 v65_SVN_register:0 "重新核查乡村户籍"
 v65_SVN_register_desc:0 "虚假的名册既方便侵吞援助，也方便地下组织隐蔽。核查工作需要地方协助，不能只靠军警。"
 v65_SVN_patrols:0 "分区巡逻制度"
 v65_SVN_patrols_desc:0 "守住县城而放弃夜间道路，等于把主动权让给游击队。让小部队熟悉自己的责任区。"
 v65_SVN_amnesty:0 "有条件的归顺"
 v65_SVN_amnesty_desc:0 "并非每个帮助游击队的家庭都愿意继续战争。给愿意交出武器的人一条可以兑现的出路。"
 v65_SVN_countertrail:0 "切断秘密联络站"
 v65_SVN_countertrail_desc:0 "与其盲目扫荡整片森林，不如追踪运输和接头网络。情报的价值应体现在减少下一次突袭。"
 v65_SVN_rural_pact:0 "乡村重建契约"
 v65_SVN_rural_pact_desc:0 "保护、税收和征兵必须有清楚的边界。只有兑现承诺，地方合作才不会在部队离开后立即瓦解。"
 v65_SVN_economy:0 "援助如何变成战力"
 v65_SVN_economy_desc:0 "港口里的物资不会自行抵达部队。围绕仓库、工坊和公路展开建设，才能缩短这段距离。"
 v65_SVN_roads:0 "修复交通干线"
 v65_SVN_roads_desc:0 "被破坏的桥梁让每次增援都变成冒险。先恢复中央掌握地区的运输能力。"
 v65_SVN_workshops:0 "扩充军械工坊"
 v65_SVN_workshops_desc:0 "损坏的步枪和车辆堆满营地。建立修械能力，比等待下一批进口装备更可靠。"
 v65_SVN_supplies:0 "统一军需账目"
 v65_SVN_supplies_desc:0 "同一批物资可能在三本账里重复出现。把仓储和部队收据对上，减少补给线上的失踪。"
 v65_SVN_industry:0 "战时民用生产"
 v65_SVN_industry_desc:0 "军队的需求正在挤压城市生活。扩大基础生产，让战争之外的日常生活还能维持。"
 v65_SVN_port:0 "西贡港周转计划"
 v65_SVN_port_desc:0 "船期、铁路和卡车应当按同一套时刻表运行。缩短物资在码头停留的时间。"
 v65_SVN_politics:0 "军政权力的裂缝"
 v65_SVN_politics_desc:0 "胜利时可以搁置的矛盾，会在败报到来后同时爆发。西贡的统治不能只依靠军官之间的口头保证。"
 v65_SVN_civil:0 "给地方行政留出空间"
 v65_SVN_civil_desc:0 "行政官员不该只在征粮时才出现。让地方政府恢复办事能力，为危机留下协商渠道。"
 v65_SVN_crisis:0 "败报后的追责会议"
 v65_SVN_crisis_desc:0 "北部阵地失守，或南方腹地遭到严重突破，都会让责任之争进入总统府。军方开始讨论谁应该下台。"
 v65_SVN_radio:0 "控制西贡广播台"
 v65_SVN_radio_desc:0 "在军营知道命令真假之前，广播先定义了局势。谁掌握电台，谁就能让观望者听见自己的版本。"
 v65_SVN_bargain:0 "首都驻军的承诺"
 v65_SVN_bargain_desc:0 "西宁、边和、头顿与美萩的指挥官各有价码。军费与职位必须换来明确的行动承诺。"
 v65_SVN_martial_focus:0 "全国戒严令"
 v65_SVN_martial_focus_desc:0 "政府选择以军令维持秩序，非军事区仍被列为例外。没有忠诚的执行者，命令也可能成为另一派的武器。"
 v65_SVN_civilian:0 "由文官监督军方"
 v65_SVN_civilian_desc:0 "前线失利并不意味着军令应当接管所有生活。让文官主持危机调查，以公开程序换取驻军和地方的合作。"
 v65_PKS_briefing:0 "朴世诚：从归仁开始"
 v65_PKS_briefing_desc:0 "这是一条小说人物的架空路线。朴世诚从归仁出发，在战功、企业与私人部队之间积累力量。"
 v65_PKS_command:0 "归仁的年轻指挥官"
 v65_PKS_command_desc:0 "朴世诚抵达越南时，掌握的只是一个大队。战争却提供了把番号、声望与私人关系连接起来的机会。"
 v65_PKS_battalion:0 "整顿第一三三大队"
 v65_PKS_battalion_desc:0 "先让基层军官了解指挥官的作战方式。可靠的骨干，比纸面上的机械化番号更重要。"
 v65_PKS_quynhon:0 "归仁预备队营地"
 v65_PKS_quynhon_desc:0 "营地既要接收补给，也要联络附近村庄。归仁将成为这支部队真正的权力起点。"
 v65_PKS_tiger:0 "猛虎师协同演练"
 v65_PKS_tiger_desc:0 "与师部保持协同，可以借到炮兵和运输力量。每次配合也都是争取上级信任的机会。"
 v65_PKS_fieldstaff:0 "建立直属参谋班子"
 v65_PKS_fieldstaff_desc:0 "战场情报不能完全依赖友军转交。培养一批只对本部负责的参谋和通信人员。"
 v65_PKS_elite:0 "机械化突击骨干"
 v65_PKS_elite_desc:0 "把经验最丰富的营编成机动核心。在关键时刻集中使用，才能放大有限装备的作用。"
 v65_PKS_reputation:0 "战报与晋升"
 v65_PKS_reputation_desc:0 "战场上的小胜需要被远方的上级看见。宣传能换来资源，也会制造必须兑现的期待。"
 v65_PKS_war_reports:0 "第一份归仁战报"
 v65_PKS_war_reports_desc:0 "把作战结果整理成可以送往师部的报告。文字背后的伤亡，不应从参谋的账簿里消失。"
 v65_PKS_press:0 "记者抵达营地"
 v65_PKS_press_desc:0 "镜头选择了整齐的队列和收缴的武器。指挥官开始学习如何安排公众看到的战争。"
 v65_PKS_patron:0 "争取蔡命新支持"
 v65_PKS_patron_desc:0 "远征军上级需要可以向国内交代的成绩。表现出可靠，比过早展示野心更有利。"
 v65_PKS_palace:0 "通往青瓦台的信件"
 v65_PKS_palace_desc:0 "归仁的名字终于出现在更高层的案头。政治庇护能够保护部队，也会要求回报。"
 v65_PKS_promotion:0 "以战功换指挥权"
 v65_PKS_promotion_desc:0 "新的任命带来更多部队和更重的责任。声望必须转化为能执行命令的组织。"
 v65_PKS_villages:0 "良民证的代价"
 v65_PKS_villages_desc:0 "证件、地方警察和驻军共同决定村庄的日常生活。短期收入与长期敌意之间没有免费的选择。"
 v65_PKS_fees:0 "清点办证收入"
 v65_PKS_fees_desc:0 "收入进入正规账目，才能避免被每一层经手者截留。军营的收益也由此与村庄捆在一起。"
 v65_PKS_police:0 "地方警察联络网"
 v65_PKS_police_desc:0 "军队离开以后，村庄仍由地方势力掌握。建立联络可以减少误报，也会让部队卷入旧日恩怨。"
 v65_PKS_village_bargain:0 "以保护换取合作"
 v65_PKS_village_bargain_desc:0 "把合作条件摆到台面上，减少随意索取。少一点眼前收益，可以换来更可靠的情报。"
 v65_PKS_inspection:0 "清查办证灰色收入"
 v65_PKS_inspection_desc:0 "对收入的追查触动了军官和地方官员。若不限制这条利益链，任何治安成果都可能被抵消。"
 v65_PKS_trusted_villages:0 "可信的后方村庄"
 v65_PKS_trusted_villages_desc:0 "合作不再只依靠一张纸。稳定的采购和保护关系，使营地附近逐渐形成真正的后方。"
 v65_PKS_business:0 "日海的军需合同"
 v65_PKS_business_desc:0 "运输和修械合同给部队带来另一种力量。企业网络可以维持独立性，也可能让战争变成生意。"
 v65_PKS_trucks:0 "承包运输车队"
 v65_PKS_trucks_desc:0 "让货物沿既定路线运转，并留下可核查的单据。运输能力成为本部与友军讨价还价的筹码。"
 v65_PKS_repair:0 "营地修械工场"
 v65_PKS_repair_desc:0 "战损车辆不必全部送往远方。训练技工，建立自己的备件和维修体系。"
 v65_PKS_company:0 "日海集团的第一间工厂"
 v65_PKS_company_desc:0 "合同利润回流到生产设施。公司开始拥有军营之外的雇员、账目和利益。"
 v65_PKS_contracts:0 "扩大军需采购权"
 v65_PKS_contracts_desc:0 "以稳定交付换取更多采购合同。资源集中到手中时，监管和政治依赖也随之加深。"
 v65_PKS_independent:0 "维持独立补给"
 v65_PKS_independent_desc:0 "无论西贡还是远征军司令部发生变化，本部都需要继续领饷。建立一份能撑过危机的储备。"
 v65_PKS_power:0 "把声望变成权力"
 v65_PKS_power_desc:0 "私人追随者正在形成自己的升迁网络。朴世诚必须决定，这支部队最终为哪一种秩序服务。"
 v65_PKS_guards:0 "直属警卫与通信网"
 v65_PKS_guards_desc:0 "警卫保护的不只是营地。把通信、档案和军官任命掌握在可信的人手中。"
 v65_PKS_intelligence:0 "特战司的雏形"
 v65_PKS_intelligence_desc:0 "精选人员承担侦察和联络任务。一个独立的情报中枢开始超出普通大队的职权范围。"
 v65_PKS_capital_links:0 "在西贡寻找盟友"
 v65_PKS_capital_links_desc:0 "年轻军官、商人和驻军都在观察首都局势。建立联系，才可能在危机时得到回应。"
 v65_PKS_remain:0 "在越南扎根"
 v65_PKS_remain_desc:0 "将经营重点留在归仁与沿海。选择长期建设，就意味着暂时放弃干预西贡最高权力的机会。"
 v65_PKS_yushin:0 "以秩序之名进军西贡"
 v65_PKS_yushin_desc:0 "只有前线败局已经动摇政府，公开夺权才有借口。朴世诚选择让自己的部队回答首都的危机。"
 v65_PKS_union:0 "让总统留在台前"
 v65_PKS_union_desc:0 "军队、合同与官员的联系可以取代一次公开夺权。保留西贡政府的名义，争夺真正的决定权。"
 v65_PKS_officer_exchange:0 "交换军区联络官"
 v65_PKS_officer_exchange_desc:0 "把归仁参谋安插到联络岗位。名义上协调作战，实际建立跨越军区的任命网络。"
 v65_PKS_joint_accounts:0 "共同军需结算处"
 v65_PKS_joint_accounts_desc:0 "先统一军饷与运输账目。谁能保证部队每月领饷，谁就有资格参与政府的下一次人事安排。"
 v65_PKS_cabinet_guarantees:0 "给文官一份保证"
 v65_PKS_cabinet_guarantees_desc:0 "承诺保留总统、内阁与地方行政职位。让西贡的官员相信，合作比再来一次军政府清洗更安全。"
 v65_PKS_hidden_council:0 "幕后的军政协调会"
 v65_PKS_hidden_council_desc:0 "朴世诚不必坐进总统府，便可以控制军官提名与军需合同。由各方签署的协议为这种安排提供外衣。"
 v65_PKS_union_offer:0 "西贡联合政府议定书"
 v65_PKS_union_offer_desc:0 "向西贡提出合并军政体系。对方可以拒绝；接受后，合并政府保留文官元首，朴世诚通过太上皇国家精神维持影响。此结局为模组架空路线。"
 v65_NVN_briefing:0 "持久战争的两条战线"
 v65_NVN_briefing_desc:0 "北方需要守住阵地，南方需要能够生存的据点。把两者联系起来，才能让战争摆脱单一的正面推进。"
 v65_NVN_command:0 "河内的持久战争"
 v65_NVN_command_desc:0 "正面战线只是战争的一部分。河内需要同时维持北方、运输线与南方组织的运转。"
 v65_NVN_staff:0 "统一前线指挥"
 v65_NVN_staff_desc:0 "把分散的计划汇入总参谋部，避免各部队争用同一批运输和补给。"
 v65_NVN_reserve:0 "北方战略预备队"
 v65_NVN_reserve_desc:0 "准备能够轮换和增援的骨干部队，而不是将全部兵力压到边界。"
 v65_NVN_supply:0 "洞海的隐蔽仓库"
 v65_NVN_supply_desc:0 "分散储存弹药与粮食，降低一次破坏造成的损失。"
 v65_NVN_fort:0 "十七度线阵地群"
 v65_NVN_fort_desc:0 "掩体和交通壕能够节约守军兵力，让更多人力支援南方。"
 v65_NVN_hold:0 "避免消耗性的北线冒进"
 v65_NVN_hold_desc:0 "边界上的胜负不应吞噬整场战争的资源。将防线作为长期斗争的支点。"
 v65_NVN_trail:0 "穿越森林的道路"
 v65_NVN_trail_desc:0 "山地运输线连接着两个相隔遥远的战场。每一座仓库都需要当地向导和持续维护。"
 v65_NVN_trail_depots:0 "分散式转运仓"
 v65_NVN_trail_depots_desc:0 "小型仓库降低暴露风险，并允许运输队分段行动。"
 v65_NVN_guides:0 "山地向导网络"
 v65_NVN_guides_desc:0 "只有熟悉山路和水源的人，才能把地图上的细线变成真正的通道。"
 v65_NVN_repair:0 "雨季道路养护"
 v65_NVN_repair_desc:0 "季风会摧毁一条刚刚打通的便道。持续维修比一次性动员更重要。"
 v65_NVN_signals:0 "跨区通信联络"
 v65_NVN_signals_desc:0 "以固定联络周期减少误会，让南方据点知道下一批物资何时到达。"
 v65_NVN_rear_offensive:0 "将增援送往南方"
 v65_NVN_rear_offensive_desc:0 "通道的目的不是在北部堆积更多部队，而是维持敌后据点的作战能力。"
 v65_NVN_south:0 "与南方解放阵线协同"
 v65_NVN_south_desc:0 "南方的组织有自己的经验和利益。援助必须通过可以持续合作的联络体系交付。"
 v65_NVN_liaison:0 "派遣南方联络员"
 v65_NVN_liaison_desc:0 "建立固定接头规则，避免各单位在秘密运输线上互相误认。"
 v65_NVN_cadres:0 "补充基层骨干"
 v65_NVN_cadres_desc:0 "向南方提供经过训练的组织者，使当地据点能够承受损失。"
 v65_NVN_arms:0 "缴获武器再分配"
 v65_NVN_arms_desc:0 "把可使用的武器优先交给缺乏装备的南方部队。"
 v65_NVN_coordination:0 "南北联合行动窗口"
 v65_NVN_coordination_desc:0 "选择配合时机，令正面牵制与敌后行动相互支援。"
 v65_NVN_political_front:0 "保留统一战线的空间"
 v65_NVN_political_front_desc:0 "南方联盟不仅由军人组成。保护民事联系，才能使据点获得补给和情报。"
 v65_NVN_economy:0 "支撑长期动员"
 v65_NVN_economy_desc:0 "北方的工厂、农田和运输系统必须承担超出日常生活的需求。"
 v65_NVN_workshops:0 "地方修械作坊"
 v65_NVN_workshops_desc:0 "让更多县份具备修理基本武器的能力，减少对集中工厂的依赖。"
 v65_NVN_rails:0 "修复运输节点"
 v65_NVN_rails_desc:0 "工人和铁路兵优先处理瓶颈，让北方仓库与前线保持联系。"
 v65_NVN_industry:0 "扩大后方生产"
 v65_NVN_industry_desc:0 "将有限资源用于能持续交付的基础工业，而不是宏大的纸面计划。"
 v65_NVN_civil:0 "保障生产人员生活"
 v65_NVN_civil_desc:0 "稳定的口粮与医疗有助于减少工人流失。"
 v65_NVN_reserves:0 "为下一轮战争储备"
 v65_NVN_reserves_desc:0 "将新生产的装备留出一部分储存，避免每次作战都耗尽库存。"
 v65_FNL_briefing:0 "南方的星火"
 v65_FNL_briefing_desc:0 "在金瓯、山地和首都外围之间，联络人员维持着松散的地下网络。让这些据点有能力独立行动。"
 v65_FNL_command:0 "南方的地下战争"
 v65_FNL_command_desc:0 "白天属于驻军的道路，夜晚可能通往另一个政府。解放阵线从地方据点开始组织自己的战争。"
 v65_FNL_cells:0 "重建乡村支部"
 v65_FNL_cells_desc:0 "将联络人员分成彼此有限知情的小组，减少一人被捕造成的损失。"
 v65_FNL_cadres:0 "地方干部训练班"
 v65_FNL_cadres_desc:0 "基层干部既要分配粮食，也要维持队伍纪律。训练应从日常组织能力开始。"
 v65_FNL_villages:0 "村庄的隐蔽粮仓"
 v65_FNL_villages_desc:0 "把补给分散在多个地点，避免部队因一个仓库暴露而挨饿。"
 v65_FNL_political:0 "统一战线代表会议"
 v65_FNL_political_desc:0 "地方组织需要一个能够表达诉求的渠道，而不只是接收军事命令。"
 v65_FNL_network:0 "地下行政联络网"
 v65_FNL_network_desc:0 "在相隔的据点之间建立稳定的民事联系，维持长时间的隐蔽活动。"
 v65_FNL_guerrilla:0 "公路之外的机动"
 v65_FNL_guerrilla_desc:0 "游击战不要求守住每一块土地。让对手不断分兵，才是小部队存在的意义。"
 v65_FNL_caches:0 "隐藏武器窖"
 v65_FNL_caches_desc:0 "武器和人员分开转移，减少白天行动暴露的风险。"
 v65_FNL_night:0 "夜间集结"
 v65_FNL_night_desc:0 "通过熟悉地形的向导，将分散的小队在短时间内组织起来。"
 v65_FNL_ambush:0 "伏击运输车队"
 v65_FNL_ambush_desc:0 "打击补给比占领一处无力防守的城镇更有价值。"
 v65_FNL_disperse:0 "打散再集结"
 v65_FNL_disperse_desc:0 "结束作战后重新融入据点，避免与优势部队进行持久阵地对抗。"
 v65_FNL_rear:0 "在南方腹地建立新据点"
 v65_FNL_rear_desc:0 "当敌军集中到北部时，南方组织可以用一次局部行动迫使他们回头。"
 v65_FNL_trail:0 "接上胡志明小道"
 v65_FNL_trail_desc:0 "敌后组织不能永远依靠缴获。与北方保持联系，才有持续作战的物资基础。"
 v65_FNL_runners:0 "接头员的路线图"
 v65_FNL_runners_desc:0 "把联络点与备用路线分开记录，减少消息在途中失踪。"
 v65_FNL_border:0 "边境秘密转运点"
 v65_FNL_border_desc:0 "运输在边境分段交接，避免一支队伍掌握全部路线。"
 v65_FNL_medics:0 "丛林救护站"
 v65_FNL_medics_desc:0 "让伤员有机会返回部队，比不断招募新人更能保住经验。"
 v65_FNL_liaison:0 "与北方协调增援"
 v65_FNL_liaison_desc:0 "明确所需装备和接收地点，使援助能够抵达真正缺乏物资的地区。"
 v65_FNL_depots:0 "南方仓库网络"
 v65_FNL_depots_desc:0 "分散的粮食、药品和弹药储备，让各据点能够等待下一次机会。"
 v65_FNL_future:0 "为南方争取政治地位"
 v65_FNL_future_desc:0 "军事合作并不自动解决未来政府的组成。解放阵线也需要维护自己的政治发言权。"
 v65_FNL_assembly:0 "地方代表会议"
 v65_FNL_assembly_desc:0 "让各据点带来自己的诉求和损失清单，避免远方命令脱离当地情况。"
 v65_FNL_land:0 "乡村土地争议委员会"
 v65_FNL_land_desc:0 "对土地的承诺必须转化为能够执行的办法，否则会制造新的地方冲突。"
 v65_FNL_recruit:0 "扩大地方武装"
 v65_FNL_recruit_desc:0 "以熟悉当地的人员补充队伍，同时保留农业生产需要的劳动力。"
 v65_FNL_negotiation:0 "保留谈判渠道"
 v65_FNL_negotiation_desc:0 "战争之外的联系能够保护组织，也为未来的政治变化留下空间。"
 v65_FNL_administration:0 "南方联合行政"
 v65_FNL_administration_desc:0 "将军事据点的合作变成能够长期运作的民事机构。"
 v65_DNM_briefing:0 "岘港军区的抉择"
 v65_DNM_briefing_desc:0 "岘港拥有自己的驻军与港口。军区既是北部防线的后方，也在等待首都权力斗争的结果。"
 v65_DNM_command:0 "岘港军区的账本"
 v65_DNM_command_desc:0 "军区需要西贡的拨款，西贡需要军区的兵。沿海司令部在这场交换中保留着自己的筹码。"
 v65_DNM_officers:0 "重新确认军官效忠"
 v65_DNM_officers_desc:0 "分清职务关系与私人追随，才能判断哪一支营能在危机时调动。"
 v65_DNM_reserve:0 "军区直属预备队"
 v65_DNM_reserve_desc:0 "保留一支不必向地方借调的机动力量，减少紧急命令遭到拖延的风险。"
 v65_DNM_hue:0 "与顺化驻军建立协同"
 v65_DNM_hue_desc:0 "岘港不能独自维持北方门户。联络官需要把两地的预备方案接起来。"
 v65_DNM_reports:0 "军区战情汇报"
 v65_DNM_reports_desc:0 "让基层的粮弹与伤亡进入司令部的日常判断。"
 v65_DNM_agreement:0 "重订中央军费协议"
 v65_DNM_agreement_desc:0 "军区将明确出兵义务，中央也必须明确支付军费的责任。"
 v65_DNM_defence:0 "中部沿海防线"
 v65_DNM_defence_desc:0 "港口、公路与山口共同组成军区的生命线。只盯住北面的敌人，会忽略侧后的危险。"
 v65_DNM_fort:0 "岘港环形工事"
 v65_DNM_fort_desc:0 "围绕交通节点设置工事，使守军能够互相支援。"
 v65_DNM_patrol:0 "山口巡逻部队"
 v65_DNM_patrol_desc:0 "把熟悉山路的小部队放到交通要道，减少后方突然出现敌军的机会。"
 v65_DNM_supply:0 "军区弹药储备"
 v65_DNM_supply_desc:0 "补给计划要能承受一段时间的交通中断。"
 v65_DNM_road:0 "沿海交通修复"
 v65_DNM_road_desc:0 "道路施工优先服务伤员后送和紧急增援。"
 v65_DNM_elastic:0 "保留机动纵深"
 v65_DNM_elastic_desc:0 "不在孤立据点消耗全部兵力，让预备队能够应对真正的突破。"
 v65_DNM_port:0 "港口城市的战争"
 v65_DNM_port_desc:0 "远征军、商人和地方行政都在使用同一座码头。有效的协调比更多临时命令更有用。"
 v65_DNM_dock:0 "岘港码头调度"
 v65_DNM_dock_desc:0 "将军需船期和道路运输接起来，减少仓库拥堵。"
 v65_DNM_repair:0 "港区修械厂"
 v65_DNM_repair_desc:0 "让港口能够处理车辆和轻武器维修，缩短送返后方的时间。"
 v65_DNM_industry:0 "维持城市生产"
 v65_DNM_industry_desc:0 "军区的长期存在需要城市维持就业和粮食供应。"
 v65_DNM_police:0 "城市警务协调"
 v65_DNM_police_desc:0 "地方警察与守军交换线索，避免各自维护一份互不相通的名单。"
 v65_DNM_civic:0 "城市重建基金"
 v65_DNM_civic_desc:0 "将部分资源交给民事设施，减少战争对港口生活的破坏。"
 v65_DNM_politics:0 "西贡来电"
 v65_DNM_politics_desc:0 "来自首都的命令并不总是一致。军区司令部必须决定，在中央危机中如何保护自己的部队。"
 v65_DNM_neutral:0 "军区不卷入私人争斗"
 v65_DNM_neutral_desc:0 "将军官的私人立场与部队命令分开，先保证防区继续运转。"
 v65_DNM_liaison:0 "首都联络代表"
 v65_DNM_liaison_desc:0 "让军区在各派之间保留消息来源，不把未来押在单一联系人身上。"
 v65_DNM_loyal:0 "公开确认共同战线"
 v65_DNM_loyal_desc:0 "表明军区将继续抵抗外敌，避免中央动荡直接演变成前线真空。"
 v65_DNM_autonomy:0 "军区行政自主"
 v65_DNM_autonomy_desc:0 "以承担本地行政责任为代价，争取更多资源支配空间。"
 v65_DNM_refuge:0 "接收溃散部队"
 v65_DNM_refuge_desc:0 "为撤下前线的士兵重新登记和补装，防止他们流入首都的派系争斗。"
 v65_KHM_briefing:0 "战火边缘的王国"
 v65_KHM_briefing_desc:0 "柬埔寨希望维持中立，但邻国战争正通过边境与港口进入国内。金边必须同时处理建设和安全。"
 v65_KHM_command:0 "金边的两本账"
 v65_KHM_command_desc:0 "公开外交文件重申中立，边境的货单却写着另一套政策。金边希望战争停在国境之外，同时保留谈判筹码。"
 v65_KHM_border:0 "边境哨所的沉默"
 v65_KHM_border_desc:0 "向东北哨所下达克制指令。不是每一支穿过森林的队伍都要被写进公开战报。"
 v65_KHM_patrol:0 "巡逻线外的营地"
 v65_KHM_patrol_desc:0 "边防部队维持公路与城镇秩序，把偏远丛林留给没有旗号的运输队。"
 v65_KHM_reports:0 "密报只送王宫"
 v65_KHM_reports_desc:0 "越境记录进入密封档案。公开的中立政策与私下的边境默契，从此由不同渠道管理。"
 v65_KHM_neutrality:0 "中立声明与秘密默契"
 v65_KHM_neutrality_desc:0 "对外继续保持中立，对内默许北方在腊塔纳基里和桔井建立转运点。补给线不会因此变成公开盟约。"
 v65_KHM_mediation:0 "用通道换取安全保证"
 v65_KHM_mediation_desc:0 "将临时默契变成秘密联络制度。只要金边仍中立并保有边境，北方就能得到额外的运输与组织支援。"
 v65_KHM_economy:0 "西哈努克港的夜间货单"
 v65_KHM_economy_desc:0 "港口与粮商连接着丛林基地。公开的商业贸易可以掩护战争物资，但也为南方留下外交施压的证据。"
 v65_KHM_roads:0 "通往桔井的道路"
 v65_KHM_roads_desc:0 "先让车辆到达湄公河转运点，雨季的运输才能摆脱完全依赖人力的困境。"
 v65_KHM_industry:0 "粮袋上的商号"
 v65_KHM_industry_desc:0 "建立稳定的采购与加工渠道。部队口粮与普通贸易使用同一批仓库。"
 v65_KHM_repair:0 "边境修械工场"
 v65_KHM_repair_desc:0 "受损武器经过修理再送回山地。北方人员可以轮换，设施仍挂着当地经营者的招牌。"
 v65_KHM_port:0 "西哈努克港的夜间卸货"
 v65_KHM_port_desc:0 "在正常贸易之外留出不公开的窗口。只有已开放的秘密后方，才能将货物变成南方战场上的动员能力。"
 v65_KHM_reserve:0 "分散在村庄的储备"
 v65_KHM_reserve_desc:0 "避免把全部物资集中在一座仓库。中立受到压力时，秘密线路仍能维持一段时间。"
 v65_KHM_security:0 "防止战争越过边界"
 v65_KHM_security_desc:0 "军方对边境局势有自己的判断。政府需要既能执行命令，也能受到约束的安全机构。"
 v65_KHM_staff:0 "整编军队参谋机构"
 v65_KHM_staff_desc:0 "让调动、补给和军费不再依靠临时口头协调。"
 v65_KHM_training:0 "训练边境预备队"
 v65_KHM_training_desc:0 "以可持续的规模维持预备兵力，避免动员掏空农业劳动力。"
 v65_KHM_fort:0 "保护关键渡口"
 v65_KHM_fort_desc:0 "渡口和道路节点比漫长边界上的每一处丛林更值得优先防护。"
 v65_KHM_police:0 "行政与警务联合报告"
 v65_KHM_police_desc:0 "使地方政府能够及时报告军警争执和人口流动。"
 v65_KHM_control:0 "确立军队调动程序"
 v65_KHM_control_desc:0 "把部队调动纳入明确程序，减少政治危机中出现彼此矛盾的命令。"
 v65_KHM_society:0 "让金边之外的地方运转"
 v65_KHM_society_desc:0 "地方社会不能只在边境危机时被记起。稳定的行政和生产，是中立政策真正的后方。"
 v65_KHM_rice:0 "恢复农产品流通"
 v65_KHM_rice_desc:0 "减少地方关卡对市场的阻隔，让农户愿意把粮食运出村庄。"
 v65_KHM_schools:0 "培训基层行政人员"
 v65_KHM_schools_desc:0 "让地方具备处理账目、登记和民事争议的基本能力。"
 v65_KHM_health:0 "省级救护体系"
 v65_KHM_health_desc:0 "边境难民与伤员需要持续照顾，不能完全交给临时征用。"
 v65_KHM_budget:0 "公开地方建设预算"
 v65_KHM_budget_desc:0 "把项目与拨款对照，使中央能够判断资源是否抵达目的地。"
 v65_KHM_settlement:0 "中立国家的长期安排"
 v65_KHM_settlement_desc:0 "把边境管理、财政与地方建设编入同一份计划，避免每次危机都从头开始。"
