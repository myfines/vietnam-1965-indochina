l_simp_chinese:
 v65_allied_missions:0 "太极旗与驻越国军"
 v65_allied_missions_desc:0 "韩军由朴系人脉、军需信用及参谋本部渠道调动；台湾国军以顾问、通信与驻越分遣队介入。两者独立于美军撤军。台湾、韩国本土不加入战区地图。"
 v65_rok_liaison:0 "太极旗：驻越韩军联络处"
 v65_rok_liaison_desc:0 "朴系保留韩军联络与增援渠道。现有韩军付费增援仍消耗军需信用，并受参谋本部派系争夺影响。"
 v65_roc_mission:0 "台湾国军驻越顾问团"
 v65_roc_mission_desc:0 "通信、训练和小规模分遣队共同支援南越。计划速度+10%、训练时间-5%。任务部队使用国军专属编制，美军撤离不会将其删除。"
 v65_request_roc:0 "向台湾申请国军分遣队"
 v65_request_roc_desc:0 "80政治点，每180天一次，最多3次。需要完整控制首都及顾问团渠道；在首都增派一支国军分遣队。"
 v65allies.1.t:0 "另一张军援清单"
 v65allies.1.d:0 "韩国联络处和台湾顾问团各送来一份名单。人员、通信和训练有现成安排；军饷与补给分开结算。美方的撤军表不负责替他们签字。"
 v65allies.1.a:0 "分别建账。"
