 v65_PHQ_act_1971:0 "一张地图，几套命令"
 v65_PHQ_act_1971_desc:0 "机动军、岛上后方与地方军区都希望获得更多资源。共同的敌人仍在，但谁来签发任命、谁来支付军饷，已经决定了命令能够走多远。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
