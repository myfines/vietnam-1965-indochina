 v65_BHD_act_1974:0 "撤退也得有个说法"
 v65_BHD_act_1974_desc:0 "地图上的箭头又往南挪了一截。船位、黄金、装备和军官家属都在排队；战报还没定稿，几位司令已经替自己的撤退选好了名字。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
