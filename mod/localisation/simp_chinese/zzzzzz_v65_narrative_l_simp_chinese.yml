 v65_NVN_act_1977_civilian_desc:0 "新番号，老熟人之后，地方社会要求恢复生产与可兑现的保护。增加民用产能、后勤和情报能力，降低疲劳；较慢的动员也意味着放弃部分进攻效率。"
 v65_NVN_act_1979:0 "十四年的老客户"
 v65_NVN_act_1979_desc:0 "新来的参谋想把旧账清掉，秘书搬来了十四年的合同。每一摞都有人签过字，每一个签字的人都说自己的那笔特殊。今天的电话比昨天还多。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
 v65_NVN_act_1979_security:0 "1979：把战区放在首位"
 v65_NVN_act_1979_security_desc:0 "十四年的老客户之后，司令部要求优先补充军队。强化指挥、训练和战区政策，会提高部队表现，也扩大派系依赖并消耗民心。"
 v65_NVN_act_1979_civilian:0 "1979：与地方重新立约"
