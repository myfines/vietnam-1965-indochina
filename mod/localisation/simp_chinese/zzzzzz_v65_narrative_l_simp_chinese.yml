 v65_SVN_act_1979:0 "十四年的老客户"
 v65_SVN_act_1979_desc:0 "新来的参谋想把旧账清掉，秘书搬来了十四年的合同。每一摞都有人签过字，每一个签字的人都说自己的那笔特殊。今天的电话比昨天还多。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
