 v65_PHQ_act_1968:0 "军援离开之后"
 v65_PHQ_act_1968_desc:0 "撤军表使部队开始清点自己真正掌握的东西：仓库、军饷、村庄和能继续工作的维修队。对外援的依赖正在变成对军区和合同的依赖。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
