 v65_SVN_act_1968:0 "撤军以后谁签字"
 v65_SVN_act_1968_desc:0 "美国人的撤军表送到了。有人先算缺了多少火力，有人先问空下来的仓库归谁。军费照领，运输照办；只是每张单子多了几个必须打招呼的名字。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
 v65_SVN_act_1968_security:0 "1968：把战区放在首位"
 v65_SVN_act_1968_security_desc:0 "撤军以后谁签字之后，司令部要求优先补充军队。强化指挥、训练和战区政策，会提高部队表现，也扩大派系依赖并消耗民心。"
 v65_SVN_act_1968_civilian:0 "1968：与地方重新立约"
 v65_SVN_act_1968_civilian_desc:0 "撤军以后谁签字之后，地方社会要求恢复生产与可兑现的保护。增加民用产能、后勤和情报能力，降低疲劳；较慢的动员也意味着放弃部分进攻效率。"
 v65_SVN_act_1971:0 "一纸军令，几家生意"
 v65_SVN_act_1971_desc:0 "西贡要调兵，军区要欠饷，岛上要船。电话绕了一圈又回到原处。副官把几份条件抄到同一页：先说谁付钱，再谈谁听谁的。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
 v65_SVN_act_1971_security:0 "1971：把战区放在首位"
 v65_SVN_act_1971_security_desc:0 "一纸军令，几家生意之后，司令部要求优先补充军队。强化指挥、训练和战区政策，会提高部队表现，也扩大派系依赖并消耗民心。"
 v65_SVN_act_1971_civilian:0 "1971：与地方重新立约"
 v65_SVN_act_1971_civilian_desc:0 "一纸军令，几家生意之后，地方社会要求恢复生产与可兑现的保护。增加民用产能、后勤和情报能力，降低疲劳；较慢的动员也意味着放弃部分进攻效率。"
 v65_SVN_act_1974:0 "撤退也得有个说法"
 v65_SVN_act_1974_desc:0 "地图上的箭头又往南挪了一截。船位、黄金、装备和军官家属都在排队；战报还没定稿，几位司令已经替自己的撤退选好了名字。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
