l_simp_chinese:
 v65story.101.t:0 "证件上的印章"
 v65story.101.d:0 "归仁推行良民证，军警与地方官分账。收入可以养部队，也能转入私人关系网。"
 v65story.101.a:0 "照旧分账，先让地方机构运转。"
 v65story.101.b:0 "公开收费标准，接受乡村代表申诉。"
 v65story.1101.t:0 "后来的一封信：证件上的印章"
 v65story.1101.a:0 "账面收入超过了预期，地方警察也很快交来了新的名册。"
 v65story.1101.b:0 "村长带来了几条过去不肯说的路。"
 v65story.1101.next:0 "把它收进这一年的档案。"
 v65story.102.t:0 "镜头之外的人"
 v65story.102.d:0 "参谋准备上报战果，军医另有一份伤亡册。战报影响追加军援和实际补充名额。"
 v65story.102.a:0 "让报纸刊登那份胜利。"
 v65story.102.b:0 "把伤亡附在战报后面。"
 v65story.1102.t:0 "后来的一封信：镜头之外的人"
 v65story.1102.a:0 "晋升与追加军需一同到来。"
 v65story.1102.b:0 "报纸没有采用那张照片，上级的回信也很冷淡。"
 v65story.1102.next:0 "把它收进这一年的档案。"
 v65story.103.t:0 "日海的第一份长约"
 v65story.103.d:0 "日海争取运输长约。合同能提供稳定收入，也会把采购和军官关系绑在一起。"
 v65story.103.a:0 "接受独家合同，建立自己的军需网络。"
 v65story.103.b:0 "拆分采购，保留核查与退出条款。"
 v65story.1103.t:0 "后来的一封信：日海的第一份长约"
 v65story.1103.a:0 "卡车准时抵达，临时拨款不再是每天的争吵。"
 v65story.1103.b:0 "采购速度慢了一些，几家商号退出了报价。"
 v65story.1103.next:0 "把它收进这一年的档案。"
 v65story.201.t:0 "撤军表上的空格"
 v65story.201.d:0 "美韩撤军留下库存与运输合同。朴可以经营这些渠道，或争取继续保留援助。"
 v65story.201.a:0 "用军需合同接管库存。"
 v65story.201.b:0 "把设备与维修队一同交给地方军区。"
 v65story.1201.t:0 "后来的一封信：撤军表上的空格"
 v65story.1201.a:0 "车队扩大了，维修账也扩大了。"
 v65story.1201.b:0 "地方军区送来了一份简短的收据。"
 v65story.1201.next:0 "把它收进这一年的档案。"
 v65story.202.t:0 "岛上的第二套公章"
 v65story.202.d:0 "富国岛有自己的驻军、港口和生意。西贡要求统一调度，岛方要求保留任命与收入。"
 v65story.202.a:0 "允许特别区自主管理港口与安置。"
 v65story.202.b:0 "保持中央任命，拨款改善港口。"
 v65story.1202.t:0 "后来的一封信：岛上的第二套公章"
 v65story.1202.a:0 "船期稳定下来，家属也有了住处。"
 v65story.1202.b:0 "新拨款终于让码头工程开工。"
 v65story.1202.next:0 "把它收进这一年的档案。"
 v65story.203.t:0 "第五支机动部队"
 v65story.203.d:0 "中央需要机动部队，岛上需要留下守军。兵从哪里出、补给由谁发，决定部队以后听谁的。"
 v65story.203.a:0 "由协调会直接掌握任命。"
 v65story.203.b:0 "分散骨干，训练各区自己的预备队。"
 v65story.1203.t:0 "后来的一封信：第五支机动部队"
 v65story.1203.a:0 "命令变快了。"
 v65story.1203.b:0 "几支地方预备队陆续完成整训。"
 v65story.1203.next:0 "把它收进这一年的档案。"
 v65story.301.t:0 "广治以南的路"
 v65story.301.d:0 "广治前线承压。投入精锐可能守住公路，也可能丢掉最后的机动预备队。"
 v65story.301.a:0 "让精锐进入预备阵地。"
 v65story.301.b:0 "扩大纵深，准备有秩序地收缩。"
 v65story.1301.t:0 "后来的一封信：广治以南的路"
 v65story.1301.a:0 "增援提高了守军的信心，后方巡逻却变得稀疏。"
 v65story.1301.b:0 "仓库开始向后转移。"
 v65story.1301.next:0 "把它收进这一年的档案。"
 v65story.302.t:0 "每个司令自己的战争"
 v65story.302.d:0 "各军区自留部队，中央的调令开始失效。总统府可以收回指挥权，也可以承认地方自治。"
 v65story.302.a:0 "建立跨区参谋机构，维持中央指挥。"
 v65story.302.b:0 "承认军区自治，各自处理内部叛乱。"
 v65story.1302.t:0 "后来的一封信：每个司令自己的战争"
 v65story.1302.a:0 "联络人员增加了，争执并没有减少。"
 v65story.1302.b:0 "新的军区旗帜出现在作战图上。"
 v65story.1302.next:0 "把它收进这一年的档案。"
 v65story.303.t:0 "公报与病床"
 v65story.303.d:0 "战果公报已经发出，损耗仍待补齐。继续报捷有利于援助，核实编制则有利于下次调兵。"
 v65story.303.a:0 "先发布胜利，争取更多援助。"
 v65story.303.b:0 "按真实缺额组织轮换。"
 v65story.1303.t:0 "后来的一封信：公报与病床"
 v65story.1303.a:0 "援助承诺比实际物资来得更快。"
 v65story.1303.b:0 "漂亮的总结被压在抽屉里。"
 v65story.1303.next:0 "把它收进这一年的档案。"
 v65story.401.t:0 "西原撤退预案"
 v65story.401.d:0 "西原交通线受到威胁。守城、撤向海岸和分区固守，需要不同的部队与补给安排。"
 v65story.401.a:0 "优先保全部队与军需。"
 v65story.401.b:0 "公开安置顺序，给平民留出运力。"
 v65story.1401.t:0 "后来的一封信：西原撤退预案"
 v65story.1401.a:0 "军需储备增加了，乡村却开始自行寻找出路。"
 v65story.1401.b:0 "车队的速度没有变快，争抢却少了一些。"
 v65story.1401.next:0 "把它收进这一年的档案。"
 v65story.402.t:0 "总统府的两封回电"
 v65story.402.d:0 "总统府与前线的命令发生冲突。继任与撤退安排将决定军官继续服从中央，还是各自保全部队。"
 v65story.402.a:0 "保留总统名义，由军政协调会决定调动。"
 v65story.402.b:0 "要求各军区公开自己的保存兵力计划。"
 v65story.1402.t:0 "后来的一封信：总统府的两封回电"
 v65story.1402.a:0 "调动顺序终于统一了。"
 v65story.1402.b:0 "有的军区如实交表，有的只交来一个大概数字。"
 v65story.1402.next:0 "把它收进这一年的档案。"
 v65story.403.t:0 "留给岛上的保证"
 v65story.403.d:0 "大陆局势恶化，富国岛需要决定接收谁、留下多少驻军，以及是否继续承担大陆作战。"
 v65story.403.a:0 "继续援助大陆，但限制新的承诺。"
 v65story.403.b:0 "把岛作为下一次反攻的基地。"
 v65story.1403.t:0 "后来的一封信：留给岛上的保证"
 v65story.1403.a:0 "船上的货单被重新核定。"
 v65story.1403.b:0 "军营里重新挂起了训练计划。"
 v65story.1403.next:0 "把它收进这一年的档案。"
 v65story.501.t:0 "谁在替谁维持秩序"
 v65story.501.d:0 "地方部队各自筹款、清剿和招人。中央要恢复调度，必须先解决军饷和任命。"
 v65story.501.a:0 "以援助换取联合作战承诺。"
 v65story.501.b:0 "承认本地优先，安排共同联络。"
 v65story.1501.t:0 "后来的一封信：谁在替谁维持秩序"
 v65story.1501.a:0 "部队终于调动了，军区也得到了新的军需清单。"
 v65story.1501.b:0 "军区留下了主力，派来几名熟悉乡村的联络官。"
 v65story.1501.next:0 "把它收进这一年的档案。"
 v65story.502.t:0 "国境线上的旧仓库"
 v65story.502.d:0 "柬埔寨内战与越南战线共用部分运输网络。仓库和通道可以换取军援，也会招来干预。"
 v65story.502.a:0 "继续以通道换取军需和外交筹码。"
 v65story.502.b:0 "缩减秘密运输，先处理本国村庄。"
 v65story.1502.t:0 "后来的一封信：国境线上的旧仓库"
 v65story.1502.a:0 "军需抵达了，联络人员也更频繁地出入。"
 v65story.1502.b:0 "几辆车空着返回边境。"
 v65story.1502.next:0 "把它收进这一年的档案。"
 v65story.503.t:0 "孩子记得的是哪一年"
 v65story.503.d:0 "长期驻军带来安置、学校与军属开支。现有预算不足以同时维持全部动员和地方建设。"
 v65story.503.a:0 "继续优先保障军队与动员。"
 v65story.503.b:0 "把安置、学校与轮休写进正式预算。"
 v65story.1503.t:0 "后来的一封信：孩子记得的是哪一年"
 v65story.1503.a:0 "动员计划照常执行。"
 v65story.1503.b:0 "预算争论持续了很久。"
 v65story.1503.next:0 "把它收进这一年的档案。"
 v65story.601.t:0 "粮袋与姓名"
 v65story.601.d:0 "北方征粮与补充兵员依赖村庄组织。扩大征集能增加兵力，也会影响下一轮运输。"
 v65story.601.a:0 "按前线需要扩大征集。"
 v65story.601.b:0 "给村庄留出粮食与轮换名额。"
 v65story.1601.t:0 "后来的一封信：粮袋与姓名"
 v65story.1601.a:0 "物资抵达了。"
 v65story.1601.b:0 "第一批货物少了一些。"
 v65story.1601.next:0 "把它收进这一年的档案。"
 v65story.602.t:0 "白天的合作对象"
 v65story.602.d:0 "南方基层组织同时接触地方官、村长和游击队。合作对象需要核实，不能只看白天的登记册。"
 v65story.602.a:0 "接受有条件的地方合作。"
 v65story.602.b:0 "拒绝私人交换，维持组织纪律。"
 v65story.1602.t:0 "后来的一封信：白天的合作对象"
 v65story.1602.a:0 "仓库用上了，新的保护关系也随之建立。"
 v65story.1602.b:0 "队伍改走更远的山路。"
 v65story.1602.next:0 "把它收进这一年的档案。"
 v65story.603.t:0 "停火之后的另一份命令"
 v65story.603.d:0 "停火没有解除地方武装。继续扩张还是保存组织，将改变下一阶段的准备。"
 v65story.603.a:0 "保持动员，为下一轮进攻储备。"
 v65story.603.b:0 "恢复基层生产与有限轮休。"
 v65story.1603.t:0 "后来的一封信：停火之后的另一份命令"
 v65story.1603.a:0 "储备增加了，轮休仍然推迟。"
 v65story.1603.b:0 "一部分人回到了田间和修械所。"
 v65story.1603.next:0 "把它收进这一年的档案。"
 v65story.604.t:0 "夺取之后，怎样留下"
 v65story.604.d:0 "控制县城后仍需接管村庄、粮运与干部任命。部队必须决定优先投入哪个环节。"
 v65story.604.a:0 "先以军令统一地方。"
 v65story.604.b:0 "保留可用的行政与民生网络。"
 v65story.1604.t:0 "后来的一封信：夺取之后，怎样留下"
 v65story.1604.a:0 "命令很快传到各处。"
 v65story.1604.b:0 "整编比计划中慢。"
 v65story.1604.next:0 "把它收进这一年的档案。"
 v65story.605.t:0 "王宫与参谋部"
 v65story.605.d:0 "王宫与军方争夺预算和任命。对外中立需要国内力量支持。"
 v65story.605.a:0 "给参谋部更大的征调权。"
 v65story.605.b:0 "坚持地方预算与军费核查。"
 v65story.1605.t:0 "后来的一封信：王宫与参谋部"
 v65story.1605.a:0 "部队补充得更快，地方征粮也更加频繁。"
 v65story.1605.b:0 "一些军费申请被退回重填。"
 v65story.1605.next:0 "把它收进这一年的档案。"
 v65story.606.t:0 "谁来代表柬埔寨"
 v65story.606.d:0 "金边的权力安排面临改组。维持王国或由朗诺建立共和国，将改变政府领导人与对外路线。"
 v65story.606.a:0 "建立高棉共和国，由军方承担责任。"
 v65story.606.b:0 "保留王国名义，重新谈判军政权限。"
 v65story.1606.t:0 "后来的一封信：谁来代表柬埔寨"
 v65story.1606.a:0 "公文换了抬头，军方获得更多任命权。"
 v65story.1606.b:0 "王室名义被保留下来，各方签署了一份新的权限清单。"
 v65story.1606.next:0 "把它收进这一年的档案。"
 v65story.607.t:0 "根据地里的登记册"
 v65story.607.d:0 "根据地需要粮食、人员和运输渠道。扩充动员与争取村庄合作需要不同安排。"
 v65story.607.a:0 "以军事纪律执行统一征集。"
 v65story.607.b:0 "允许基层说明差异，维持村庄生产。"
 v65story.1607.t:0 "后来的一封信：根据地里的登记册"
 v65story.1607.a:0 "登记册按时上交。"
 v65story.1607.b:0 "登记慢了下来，一些问题终于不再被改成好看的数字。"
 v65story.1607.next:0 "把它收进这一年的档案。"
 v65story.608.t:0 "越境来的联络人"
 v65story.608.d:0 "越境联络带来物资，也带来对运输路线和指挥权的要求。根据地需要决定接受多少外部安排。"
 v65story.608.a:0 "扩大共同通道与军需合作。"
 v65story.608.b:0 "限制外部条件，优先根据地自身补给。"
 v65story.1608.t:0 "后来的一封信：越境来的联络人"
 v65story.1608.a:0 "仓库里多了武器，会议上也多了需要考虑的外部意见。"
 v65story.1608.b:0 "部分援助没有抵达。"
 v65story.1608.next:0 "把它收进这一年的档案。"
 v65story.5101.t:0 "错放在陈庭清名下的方略"
 v65story.5101.d:0 "朴世诚把错页推回去：“陈家人多，先让他带头。”陈庭清想解释方略不是自己写的，瞥见桌边摆着自家田产与家丁名册，只好改口说愿意守符吉。朴随即把武器、税额和家属安置列成担保，任命也按家产落定。陈庭清站在主位旁，最后还是点头接令。"
 v65story.5101.a:0 "顺势授予陈家总司令名义。"
 v65story.5101.b:0 "重新审核各家方略与兵额。"
 v65story.6101.t:0 "后来的一封信：错放在陈庭清名下的方略"
 v65story.6101.a:0 "陈家答应出人出粮，任命也开始围着土地转。"
 v65story.6101.b:0 "审核耽误编组，大地主仍要求保留自家队伍。"
 v65story.6101.next:0 "把它收进这一年的档案。"
 v65story.5102.t:0 "按家产排出的团练名册"
 v65story.5102.d:0 "朴世诚让平定豪强参加开卷评定，暗中按家产和族人数量分军阶、分武器；反G救国的口号替土地利益披上公义外衣。会上没人讨论山海据点是否守得住，大家只等配枪名单；朴则把地方税收、军火买卖和家族担保纳入同一安排。报名者把考试当成分家产的另一道手续。"
 v65story.5102.a:0 "让大族各守一片乡镇。"
 v65story.5102.b:0 "把兵额分给较小的乡镇队。"
 v65story.6102.t:0 "后来的一封信：按家产排出的团练名册"
 v65story.6102.a:0 "大族交来名单与税款，枪支也按承诺送到。"
 v65story.6102.b:0 "小队愿守路口，大族却私下扣留枪械。"
 v65story.6102.next:0 "把它收进这一年的档案。"
 v65story.5103.t:0 "卢泰愚的随身小瓶"
 v65story.5103.d:0 "卢泰愚在符吉监督陈庭清，口头保证朴的机动部队会来救援，胸前却藏着让陈“风光战死”的毒药。陈以为自己只是代理，总顾问却把情况直接报往归仁。朴要的不是统一军队，而是每家都离不开韩军枪械和保护。药瓶由卢保管，撤退时也不得离身。"
 v65story.5103.a:0 "交卢泰愚全权维持指挥。"
 v65story.5103.b:0 "派参谋组核验团练战况。"
 v65story.6103.t:0 "后来的一封信：卢泰愚的随身小瓶"
 v65story.6103.a:0 "卢把名单和求援电报一并送到归仁。"
 v65story.6103.b:0 "参谋组发现外围据点的报告彼此矛盾。"
 v65story.6103.next:0 "把它收进这一年的档案。"
 v65story.5104.t:0 "两位女伴与一通急电"
 v65story.5104.d:0 "电话响起时，朴世诚正陪两位越南女伴消遣。副官报告符吉遭到围攻，他先问：“打到归仁没有？”听说目标只是县城，朴放下话筒，吩咐707空运增援、只守不追，随后让侍从收拾桌面，继续享用午餐。副官站在门边等候新的口令。"
 v65story.5104.a:0 "保留私宅班底，命707守城。"
 v65story.5104.b:0 "结束消遣，亲自核定增援次序。"
 v65story.6104.t:0 "后来的一封信：两位女伴与一通急电"
 v65story.6104.a:0 "侍从收拾房间，707稳住城内；外围据点仍告失守。"
 v65story.6104.b:0 "参谋送来据点名单，追击部队仍被留在城内。"
 v65story.6104.next:0 "把它收进这一年的档案。"
 v65story.5105.t:0 "撤出符吉的胜利公报"
 v65story.5105.d:0 "地道爆破声传来，707在符吉巷战中伤亡近百。朴世诚让卢泰愚先撤主力，陈庭清则被灌下毒酒、补枪收场。记者等在指挥部外，朴把战报推给崔顺勇：“写成诱敌进城，数字先照这份报。”崔顺勇接过稿子，按朴的数字重誊一遍。"
 v65story.5105.a:0 "先撤韩军骨干，再发布捷报。"
 v65story.5105.b:0 "把损失和撤退一并报上去。"
 v65story.6105.t:0 "后来的一封信：撤出符吉的胜利公报"
 v65story.6105.a:0 "公报先抵达汉城，伤亡名册晚了几天才送到。"
 v65story.6105.b:0 "上级要求补交说明，部队暂时没有得到嘉奖。"
 v65story.6105.next:0 "把它收进这一年的档案。"
 v65story.5106.t:0 "竹林寺招待席上的两位艺人"
 v65story.5106.d:0 "金大勇一行抵达富国岛，朴世诚摆出酒席，又叫来两位女艺人。巡视员问起特需账目，朴笑着指向竹林寺：“先在那里歇两天，船票我来安排。”等客人离席，卫队已封住寺院周边；当晚的行动记录随后被改成登船离岛。崔顺勇在门外等候，手里攥着离岛名册。"
 v65story.5106.a:0 "加开私宴，买两夜处置时间。"
 v65story.5106.b:0 "停止宴请，让巡视组核账。"
 v65story.6106.t:0 "后来的一封信：竹林寺招待席上的两位艺人"
 v65story.6106.a:0 "艺人和侍从先离开，巡视组的登船记录随后被改写。"
 v65story.6106.b:0 "几笔军需转卖被记下，日海要求尽快结案。"
 v65story.6106.next:0 "把它收进这一年的档案。"
 v65story.5107.t:0 "把机器和家眷送上船"
 v65story.5107.d:0 "巡视组失踪后，朴加快把平定豪强家眷、作坊和制造工具运往富国岛。港口、机场和训练区一同扩张，陆上工厂却一间间停工；朴把人口安置、设备搬迁和私人代理贸易捆成生意，岛上仓库也因此优先接收军需。岛上商号开始向日海申请运输合同。"
 v65story.5107.a:0 "优先转移可交易资产与军需设备。"
 v65story.5107.b:0 "先运家属与维修队，保留工厂开工。"
 v65story.6107.t:0 "后来的一封信：把机器和家眷送上船"
 v65story.6107.a:0 "岛上仓库扩容，平定商户开始抱怨失去生计。"
 v65story.6107.b:0 "迁移速度慢了，岛上维修能力却更完整。"
 v65story.6107.next:0 "把它收进这一年的档案。"
 v65story.5108.t:0 "第七水输的艇队"
 v65story.5108.d:0 "朴俊炳把舟艇伪装成登陆船，带第七水输赴富国岛训练；417和706教官补上水上渗透课程，特攻潜艇也进入试验。艇队保留自有装备账，朴则承诺优先燃料和实战机会，要求把岛上港口当作长期前进基地。旅团还把试航报告交给朴亲自过目。"
 v65story.5108.a:0 "把艇队交给卫队统一调遣。"
 v65story.5108.b:0 "保留旅团自有舟艇与教官。"
 v65story.6108.t:0 "后来的一封信：第七水输的艇队"
 v65story.6108.a:0 "试训艇队获得优先燃料，海岸巡逻归入同一班子。"
 v65story.6108.b:0 "旅团训练更稳定，但行动要另行协调。"
 v65story.6108.next:0 "把它收进这一年的档案。"
 v65story.5109.t:0 "保证金、三清与强劳"
 v65story.5109.d:0 "富国岛对越南族入岛另收保证金，不缴者送审查并强制劳动；数千人被循环拘押。朴拒绝把岛上守军调去西贡，因为港口和资产转移需要武装保护。商人可用保证金换资格，其他人则在审查站和工地间轮转。西贡若要调兵，必须先与韩方协商。"
 v65story.5109.a:0 "以审查与劳役补港口人手。"
 v65story.5109.b:0 "缴保证金即可入岛，限制羁押期限。"
 v65story.6109.t:0 "后来的一封信：保证金、三清与强劳"
 v65story.6109.a:0 "港口工程按期推进，逃亡者带走审查站的消息。"
 v65story.6109.b:0 "新劳工少了些，商船和家属更愿意留下。"
 v65story.6109.next:0 "把它收进这一年的档案。"
 v65story.5110.t:0 "密码本换来的假内鬼"
 v65story.5110.d:0 "赵民基缴获越共电台密码本，以真实军火运输作诱饵，再投放假内鬼情报；阮晋勇肃叛后查出第三纵队贪污，部队反而更严整。地主盘剥又把村民推向游击队，朴的离间让对手清出旧账，也给他们换上更可靠的干部。清出的空缺很快由更听命的干部补上。"
 v65story.5110.a:0 "继续投放假情报牵制阮晋勇。"
 v65story.5110.b:0 "利用密码本监视真实运输。"
 v65story.6110.t:0 "后来的一封信：密码本换来的假内鬼"
 v65story.6110.a:0 "审查令让游击队短暂停顿，正规部队却接管空缺。"
 v65story.6110.b:0 "监听更费时间，新调来的越共指挥官却没那么容易受骗。"
 v65story.6110.next:0 "把它收进这一年的档案。"
 v65story.5111.t:0 "昭胜船上的口供与名单"
 v65story.5111.d:0 "707突袭昭胜船，救出四十多名被贩女性；梁西辟却把有背景的警海关人员包装成卧底，挑无背景者顶罪。朴的部下控制了口供和名单，拿它们牵制金咏三、交换释放人情。案卷里没有写明受害者后来去了哪里。释放名单随后被拿去交换政治人情。"
 v65story.5111.a:0 "将人证和名单纳入自己的关系网。"
 v65story.5111.b:0 "把获救者交给公开救助机构。"
 v65story.6111.t:0 "后来的一封信：昭胜船上的口供与名单"
 v65story.6111.a:0 "几名有势力的嫌疑人获释，案卷留在梁西辟手中。"
 v65story.6111.b:0 "救助记录留档，梁西辟抱怨办案失去了筹码。"
 v65story.6111.next:0 "把它收进这一年的档案。"
 v65story.5112.t:0 "赴日船上的最后一份命令"
 v65story.5112.d:0 "金咏三在赴日船上遇害，实际动手者文成旭是706特工。朴向总统称他逃跑，让金大中的反对党与自己的情报网继续互相制衡；案子转交中央情报部后，朴仍把执行链和命令记录握在手里。朴把失踪说法留给总统，现场人员不得对外发言。"
 v65story.5112.a:0 "压下真相，保留双方把柄。"
 v65story.5112.b:0 "把执行链交由内部审查。"
 v65story.6112.t:0 "后来的一封信：赴日船上的最后一份命令"
 v65story.6112.a:0 "案子归入失踪，706保存了牵制党内高层的材料。"
 v65story.6112.b:0 "审查拖慢行动，几名特工要求调离政治案件。"
 v65story.6112.next:0 "把它收进这一年的档案。"
 v65story.5113.t:0 "第五机动军的两套命令"
 v65story.5113.d:0 "南越组建第五机动军，名义上由武原顺指挥，实际101特战团只听李威炎和许家洛。岛方借新军团进入西贡防区，成贺负责大陆情报；朴正熙戒严又让他们担心援助中断，岛上因此要求保留任命和守军控制权。岛方继续保留守备司令、港口和人事安排。"
 v65story.5113.a:0 "承认岛方实控，换取部队留驻。"
 v65story.5113.b:0 "派韩方联络官统一军令。"
 v65story.6113.t:0 "后来的一封信：第五机动军的两套命令"
 v65story.6113.a:0 "101团守住岛与西贡联络线，名义军团暂时完整。"
 v65story.6113.b:0 "作战命令更清楚，许家洛要求重谈任命权。"
 v65story.6113.next:0 "把它收进这一年的档案。"
 v65story.5114.t:0 "维新革命卫队草案"
 v65story.5114.d:0 "维新戒严后，朴世诚推动卫队脱离常规军系、直接效忠总统，并拆分特战、海军与飞弹司令部。海外利益、日海订单和军官任命被绑在一起，首都机械化师团因旧部关系优先拿到考试名额。卫队军官因此能够绕过常规军团获得升迁。"
 v65story.5114.a:0 "批准独立编制与专属采购。"
 v65story.5114.b:0 "让国军参谋本部保留调度权。"
 v65story.6114.t:0 "后来的一封信：维新革命卫队草案"
 v65story.6114.a:0 "卫队扩编加快，几家日海关联企业拿到长期订单。"
 v65story.6114.b:0 "草案多了监督条款，部队任命谈判延长。"
 v65story.6114.next:0 "把它收进这一年的档案。"
 v65story.5115.t:0 "济州伏击与虚空核项目"
 v65story.5115.d:0 "韩军以假电台引来朝鲜接应船，在济州全歼十余人；朴随后借核电名义推动819计划。专家估计造核还要十到二十年，他仍用项目向两边申请资源，CIA监督人员则被安置在基地查看进度。基地账目同时列着核电设备与秘密研究开支。"
 v65story.5115.a:0 "把伏击与核计划都做成政绩。"
 v65story.5115.b:0 "先核实战果并压低核项目承诺。"
 v65story.6115.t:0 "后来的一封信：济州伏击与虚空核项目"
 v65story.6115.a:0 "报纸刊出“死士首胜”，核基地预算也获续拨。"
 v65story.6115.b:0 "战果少了几行，CIA监督人员却增加了。"
 v65story.6115.next:0 "把它收进这一年的档案。"
 v65story.5116.t:0 "281高地的轮番反攻"
 v65story.5116.d:0 "复活节攻势压到顺化，朴用逃兵与囚犯团反攻281高地，刻意不投入精锐；101团又以缴获军服伪造歼敌战果。雨晴转换和空袭决定推进节奏，军医的伤亡表却比公报诚实得多。朴只追问战果有没有按规定先报给司令部，吴光长则仍要求继续攻城。"
 v65story.5116.a:0 "继续用轮换炮灰拖住806团。"
 v65story.5116.b:0 "把精锐留在预备队，改守公路。"
 v65story.6116.t:0 "后来的一封信：281高地的轮番反攻"
 v65story.6116.a:0 "高地暂稳，军医报告的伤亡比公报高出许多。"
 v65story.6116.b:0 "部队不再冲山头，公路两侧仍需增援。"
 v65story.6116.next:0 "把它收进这一年的档案。"
 v65story.5117.t:0 "难民营里的补充兵"
 v65story.5117.d:0 "广治守军从俘虏、罪犯和百万规模难民营征补；101看守战俘，强迫投诚者杀害拒降者，营地也曾发生夺枪暴动。白天炮击推进，夜间越共游击队进城，军官仍把登记册当作可随时抽取的兵源。补进来的人员缺乏训练，轮换队伍也越发松散。"
 v65story.5117.a:0 "把营地人员编入攻城梯队。"
 v65story.5117.b:0 "只登记自愿投诚者并保留守营兵力。"
 v65story.6117.t:0 "后来的一封信：难民营里的补充兵"
 v65story.6117.a:0 "攻城队伍补满，值守战俘营的警卫也不得不增加。"
 v65story.6117.b:0 "补兵慢下来，暴动风险也低了一些。"
 v65story.6117.next:0 "把它收进这一年的档案。"
 v65story.5118.t:0 "101团的声望与防空导弹"
 v65story.5118.d:0 "越共806团把101团松懈误判为陷阱，突击后半小时便击溃其防线；赵朝伟逃往广治，防空导弹又击落朴的撤离直升机。美空军恢复轰炸后，朴仍不肯让东河部队撤退，命他们在高地等空投。护航机请求增加，前线调兵计划随之延后。"
 v65story.5118.a:0 "把空运资源转给东河守军。"
 v65story.5118.b:0 "集中防空侦察，暂缓直升机轮换。"
 v65story.6118.t:0 "后来的一封信：101团的声望与防空导弹"
 v65story.6118.a:0 "伤员后送减少，东河高地的补给仍能维持。"
 v65story.6118.b:0 "飞行员要求更多护航，广治指挥部只能就地固守。"
 v65story.6118.next:0 "把它收进这一年的档案。"
 v65story.5119.t:0 "提前宣布广治收复"
 v65story.5119.d:0 "朴退到顺化，把广治交给吴光长守中心高地，调第四师增援；战斗尚未结束，他先向阮文绍报称全城收复。赵朝伟撤回富国岛，朴随后用新102团补位，嘉奖令比控制线更早抵达。朴只责怪101团没有提前报送战果，中心高地仍需补兵。"
 v65story.5119.a:0 "按公报口径发奖并继续增援。"
 v65story.5119.b:0 "等控制线核实后再宣布。"
 v65story.6119.t:0 "后来的一封信：提前宣布广治收复"
 v65story.6119.a:0 "嘉奖令先发出，城内交火声尚未停下。"
 v65story.6119.b:0 "战报晚了几天，前线获得更准的兵力表。"
 v65story.6119.next:0 "把它收进这一年的档案。"
 v65story.5120.t:0 "猎鼠行动的伞降名册"
 v65story.5120.d:0 "富国岛训练102特战团，朴又把新世纪福音会成员送上“猎鼠行动”；三四百名缺乏伞训者在轰炸掩护下空降敌后，没有可靠撤出安排。宗教招募替代专业训练，行动照片却先被当作战果素材准备好。名单先列出突击人数，撤退船只一栏仍空着。"
 v65story.5120.a:0 "扩大特战招募，接受高损耗。"
 v65story.5120.b:0 "先让102团完成训练和撤离预案。"
 v65story.6120.t:0 "后来的一封信：猎鼠行动的伞降名册"
 v65story.6120.a:0 "敌后总部遭到突袭，名单上的损失也迅速变长。"
 v65story.6120.b:0 "行动延后，岛上的新团获得完整训练周期。"
 v65story.6120.next:0 "把它收进这一年的档案。"
 v65story.5121.t:0 "拉波钦海滩的鱼竿"
 v65story.5121.d:0 "海浪拍着拉波钦海滩，朴世诚守着几根鱼竿，旁边机枪手看海。他拉不动大鱼，便朝士兵一挥手：“开火！”鱼身被打成几段后，朴把鱼竿递给参谋，问起广治进展，又催吴光长尽快收复城市。崔顺勇拿起抄网，跟着朴一同收线。"
 v65story.5121.a:0 "维持私人随行班底与海滩宴席。"
 v65story.5121.b:0 "压缩宴席，把随行经费转给前线。"
 v65story.6121.t:0 "后来的一封信：拉波钦海滩的鱼竿"
 v65story.6121.a:0 "警卫照常轮班，通讯班替司令官接通前线电话。"
 v65story.6121.b:0 "前线收到一批燃油，司令官少了几名随行侍者。"
 v65story.6121.next:0 "把它收进这一年的档案。"
 v65story.5122.t:0 "鱼虾刺身与烧烤架"
 v65story.5122.d:0 "遮阳伞下摆着刺身、糕点和烧烤架，朴世诚举杯时，厨师与侍者仍在忙碌。通讯员报告广治尚未收复，朴放下酒杯说：“收复的日子不会远。”他吃完才听参谋谈增援，随行人员则把地图摊在餐桌旁。崔顺勇把电报放在餐桌边等候批示。"
 v65story.5122.a:0 "照常摆宴，让通讯班筛选来电。"
 v65story.5122.b:0 "撤掉宴席桌，改作临时指挥点。"
 v65story.6122.t:0 "后来的一封信：鱼虾刺身与烧烤架"
 v65story.6122.a:0 "吴光长的最新电报被送到餐桌旁。"
 v65story.6122.b:0 "参谋把地图摊在遮阳伞下，厨师收起烧烤架。"
 v65story.6122.next:0 "把它收进这一年的档案。"
 v65story.5123.t:0 "湄公河防线与富国岛账本"
 v65story.5123.d:0 "朴世诚提出四道防线，最后一道依托湄公河，由富国岛海空军和港口供给支撑；防线之间仍要扶植乡镇武装消耗越共。他拒绝因平民被迫北迁而改变战役节奏，并要求调研组优先测绘西南岸工事。测绘组回报后，阮文绍要求尽快看到完整方案。"
 v65story.5123.a:0 "集中军工与供给建设湄公河末线。"
 v65story.5123.b:0 "把运输能力分给迁民与地方守备。"
 v65story.6123.t:0 "后来的一封信：湄公河防线与富国岛账本"
 v65story.6123.a:0 "岛上仓库扩建，湄公河沿岸开始测绘工事。"
 v65story.6123.b:0 "安置船期拖慢工事，沿线守备得到更多熟悉地形的居民。"
 v65story.6123.next:0 "把它收进这一年的档案。"
 v65story.5124.t:0 "“我们是来救你们的”"
 v65story.5124.d:0 "三八线战斗后，朴世诚推动特别军事行动：卫队越境突击并带回北方居民，随后将行动包装成解救乡亲。卢泰愚把前线撤退写成有序反击，朴正熙又把战果改大；俘虏、交换谈判和宣传都成了下一轮行动筹码。北方俘虏的去留很快进入双方交换谈判。"
 v65story.5124.a:0 "扩大战果宣传，保留俘虏作为谈判筹码。"
 v65story.5124.b:0 "限定行动范围，优先安排人员交换。"
 v65story.6124.t:0 "后来的一封信：“我们是来救你们的”"
 v65story.6124.a:0 "电报送去总统府，交换名单和记者通稿一并起草。"
 v65story.6124.b:0 "交换谈判开始，前线联络人员也被要求增加。"
 v65story.6124.next:0 "把它收进这一年的档案。"
 v65story.801.t:0 "1968：撤军以后谁签字"
 v65story.801.d:0 "美国人的撤军表送到了。有人先算缺了多少火力，有人先问空下来的仓库归谁。军费照领，运输照办；只是每张单子多了几个必须打招呼的名字。\n\n案头的数字记录着此前的选择：民心、派系依赖、战争疲劳和军区关系都将带入这一幕。国策中的军事优先与社会契约互斥，新的阶段替换旧政策。"
 v65story.801.a:0 "继续写这一年的记录。"
 v65story.802.t:0 "1971：一纸军令，几家生意"
 v65story.802.d:0 "西贡要调兵，军区要欠饷，岛上要船。电话绕了一圈又回到原处。副官把几份条件抄到同一页：先说谁付钱，再谈谁听谁的。\n\n案头的数字记录着此前的选择：民心、派系依赖、战争疲劳和军区关系都将带入这一幕。国策中的军事优先与社会契约互斥，新的阶段替换旧政策。"
 v65story.802.a:0 "继续写这一年的记录。"
 v65story.803.t:0 "1974：撤退也得有个说法"
 v65story.803.d:0 "地图上的箭头又往南挪了一截。船位、黄金、装备和军官家属都在排队；战报还没定稿，几位司令已经替自己的撤退选好了名字。\n\n案头的数字记录着此前的选择：民心、派系依赖、战争疲劳和军区关系都将带入这一幕。国策中的军事优先与社会契约互斥，新的阶段替换旧政策。"
 v65story.803.a:0 "继续写这一年的记录。"
 v65story.804.t:0 "1977：新番号，老熟人"
 v65story.804.d:0 "县里的招牌换过几轮，收钱的人还是认得。新部队要编制，老军官要职位，商号说合同不能重签。司令部先把熟人的欠账列了出来。\n\n案头的数字记录着此前的选择：民心、派系依赖、战争疲劳和军区关系都将带入这一幕。国策中的军事优先与社会契约互斥，新的阶段替换旧政策。"
 v65story.804.a:0 "继续写这一年的记录。"
 v65story.805.t:0 "1979：十四年的老客户"
 v65story.805.d:0 "新来的参谋想把旧账清掉，秘书搬来了十四年的合同。每一摞都有人签过字，每一个签字的人都说自己的那笔特殊。今天的电话比昨天还多。\n\n案头的数字记录着此前的选择：民心、派系依赖、战争疲劳和军区关系都将带入这一幕。国策中的军事优先与社会契约互斥，新的阶段替换旧政策。"
 v65story.805.a:0 "继续写这一年的记录。"
 v65_story_archive:0 "战时档案与人物关系"
 v65_story_archive_desc:0 "朴与西贡的互信：[?SVN.v65_park_trust|0]　首都政治关系：[?SVN.v65_thieu_trust|0]　离岛信任：[?SVN.v65_island_trust|0]\n每年的关键场景按日期出现。选择会留下全局剧情标记，并在45天后的信件或报告中回响。正式合并会保留西贡作为后续剧情的锚点。"
 v65story.901.t:0 "第十四年的结算单"
 v65story.901.d:0 "秘书把最后一年的账放上桌，又把前十三年的欠条压在底下。新来的参谋想按番号清账，刚查到第二页，就发现债主和领饷的人是同一批。\n\n“最后一卷叫什么？”\n“先别封卷，下个月的船还没到。”\n\n十四年叙事在这里结算。可以维持现有秩序，条件允许时推动停火，也可以继续战争；已有的人脉、民心与轮换缺额仍然有效。"
 v65story.901.park:0 "总统的照片挂在门口，任命、合同和军区来电送到另一张桌子。朴不用为自己添一个头衔，秘书知道哪些文件要等他吃完饭再送。\n\n新参谋问这套手续是谁定的。老副官指了指柜里的合同：“先把这几笔续上，再问。”"
 v65story.901.island:0 "船又到了。军官家属、机器零件和几箱没有写进货单的东西一起卸下，仓库里有人逐项签收。\n\n大陆上的番号换了几轮，岛上的商号还用原来的印章。今天先修船、发饷，至于明天挂哪面旗，等电话来了再说。"
 v65story.901.a:0 "照旧开支，照旧签字。"
 v65story.901.b:0 "把停火条件谈好，先恢复船期。"
 v65story.901.c:0 "仗接着打，账也接着记。"
 v65_memory_of_war:0 "十四年的关系户"
 v65_memory_of_war_desc:0 "熟人知道该找谁签字。旧合同和旧番号仍能让几家军区坐下来谈。"
 v65_fragile_peace:0 "停火后的生意"
 v65_fragile_peace_desc:0 "船期可以重新排了，军队转向防御；各方继续商量欠饷、合同和驻地。"
