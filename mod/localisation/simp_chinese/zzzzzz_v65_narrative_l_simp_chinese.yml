 v65_KHM_act_1971:0 "一纸军令，几家生意"
 v65_KHM_act_1971_desc:0 "西贡要调兵，军区要欠饷，岛上要船。电话绕了一圈又回到原处。副官把几份条件抄到同一页：先说谁付钱，再谈谁听谁的。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
 v65_KHM_act_1971_security:0 "1971：把战区放在首位"
 v65_KHM_act_1971_security_desc:0 "一纸军令，几家生意之后，司令部要求优先补充军队。强化指挥、训练和战区政策，会提高部队表现，也扩大派系依赖并消耗民心。"
 v65_KHM_act_1971_civilian:0 "1971：与地方重新立约"
 v65_KHM_act_1971_civilian_desc:0 "一纸军令，几家生意之后，地方社会要求恢复生产与可兑现的保护。增加民用产能、后勤和情报能力，降低疲劳；较慢的动员也意味着放弃部分进攻效率。"
 v65_KHM_act_1974:0 "撤退也得有个说法"
 v65_KHM_act_1974_desc:0 "地图上的箭头又往南挪了一截。船位、黄金、装备和军官家属都在排队；战报还没定稿，几位司令已经替自己的撤退选好了名字。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
 v65_KHM_act_1974_security:0 "1974：把战区放在首位"
 v65_KHM_act_1974_security_desc:0 "撤退也得有个说法之后，司令部要求优先补充军队。强化指挥、训练和战区政策，会提高部队表现，也扩大派系依赖并消耗民心。"
 v65_KHM_act_1974_civilian:0 "1974：与地方重新立约"
 v65_KHM_act_1974_civilian_desc:0 "撤退也得有个说法之后，地方社会要求恢复生产与可兑现的保护。增加民用产能、后勤和情报能力，降低疲劳；较慢的动员也意味着放弃部分进攻效率。"
 v65_KHM_act_1977:0 "新番号，老熟人"
 v65_KHM_act_1977_desc:0 "县里的招牌换过几轮，收钱的人还是认得。新部队要编制，老军官要职位，商号说合同不能重签。司令部先把熟人的欠账列了出来。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
 v65_KHM_act_1977_security:0 "1977：把战区放在首位"
 v65_KHM_act_1977_security_desc:0 "新番号，老熟人之后，司令部要求优先补充军队。强化指挥、训练和战区政策，会提高部队表现，也扩大派系依赖并消耗民心。"
 v65_KHM_act_1977_civilian:0 "1977：与地方重新立约"
 v65_KHM_act_1977_civilian_desc:0 "新番号，老熟人之后，地方社会要求恢复生产与可兑现的保护。增加民用产能、后勤和情报能力，降低疲劳；较慢的动员也意味着放弃部分进攻效率。"
 v65_KHM_act_1979:0 "十四年的老客户"
 v65_KHM_act_1979_desc:0 "新来的参谋想把旧账清掉，秘书搬来了十四年的合同。每一摞都有人签过字，每一个签字的人都说自己的那笔特殊。今天的电话比昨天还多。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
