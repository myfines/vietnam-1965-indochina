 v65_SVN_act_1977:0 "新番号，老熟人"
 v65_SVN_act_1977_desc:0 "县里的招牌换过几轮，收钱的人还是认得。新部队要编制，老军官要职位，商号说合同不能重签。司令部先把熟人的欠账列了出来。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
