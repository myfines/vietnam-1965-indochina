 v65_BHD_act_1971:0 "一纸军令，几家生意"
 v65_BHD_act_1971_desc:0 "西贡要调兵，军区要欠饷，岛上要船。电话绕了一圈又回到原处。副官把几份条件抄到同一页：先说谁付钱，再谈谁听谁的。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
