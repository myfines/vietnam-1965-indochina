 v65_FNL_act_1968:0 "撤军以后谁签字"
 v65_FNL_act_1968_desc:0 "美国人的撤军表送到了。有人先算缺了多少火力，有人先问空下来的仓库归谁。军费照领，运输照办；只是每张单子多了几个必须打招呼的名字。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
 v65_FNL_act_1968_security:0 "1968：把战区放在首位"
 v65_FNL_act_1968_security_desc:0 "撤军以后谁签字之后，司令部要求优先补充军队。强化指挥、训练和战区政策，会提高部队表现，也扩大派系依赖并消耗民心。"
 v65_FNL_act_1968_civilian:0 "1968：与地方重新立约"
