l_simp_chinese:
 v65_personal_connections:0 "朴的私人通讯录"
 v65_personal_connections_desc:0 "私产：[?SVN.v65_private_wealth|0]/100　享受：[?SVN.v65_private_comfort|0]/100\n这里按人情办事，不按国界涂色。关系25可租借军需站，50可分红，70可介入军区任命。每个关系50以上、仍与朴和平的外部伙伴每月提供1点私产；关系每月消退1点，战时断交额外消退5点。\n朴移驻或接管南越不会重建这本账。"
 v65_personal_network_actor:0 "由朴系主持私人网络"
 v65_network_supply:0 "共用仓库与私人车队"
 v65_network_supply_desc:0 "租来的仓库和运输关系暂时降低补给损耗。地主和司令各收一份，路线仍能开通。"
 v65_private_staff:0 "有人替司令接电话"
 v65_private_staff_desc:0 "秘书、副官和招待处各有分工。司令休息时，送来的文件也有人签收。"
 v65_private_holiday_decision:0 "把周末留给自己"
 v65_private_holiday_decision_desc:0 "支出10私产，享受增加15，返还15政治点；每90天一次。招待处能挡住杂事，挡不住战线。"
 v65network.1.t:0 "今天的电话由副官接"
 v65network.1.d:0 "行李已经送到住处。副官捧着行程表追过来，还想把两场接见塞进下午。\n\n朴把接见划给了参谋。招待费不够就从自己的账上走，谁也别把这次休假写成视察。\n\n“急件怎么办？”\n“你先看看有多急。”"
 v65network.1.a:0 "行李放下，电话拿远一点。"
 v65network.2.t:0 "通讯录也要有人维护"
 v65network.2.d:0 "同一条公路，军区收通行费，地方团收保护费，仓库还要一份装卸费。私人账本每月结一次，没人打算等战争结束再算。"
 v65network.2.a:0 "把熟人的份额也算进去。"
 v65_contact_SVN:0 "托人递话：西贡总统府"
 v65_contact_SVN_desc:0 "西贡总统府关系：[?SVN.v65_network_SVN|0]/100。花35政治点递交合作提议；对方接受后关系增加20，对方得到20政治点。拒绝不会退还活动费。每90天一次。提议30天失效。"
 v65_depot_SVN:0 "在西贡总统府合用仓库"
 v65_depot_SVN_desc:0 "关系25、私产8以上：支出8私产及25政治点，双方获得90天补给消耗减免，伙伴的地方动荡降低1，关系增加3。不转移领土。"
 v65network.10.t:0 "有人替朴来递话"
 v65network.10.d:0 "来人带了一封私信，谈的是西贡总统府的仓库、运输和军官往来。信上没提改变隶属关系，也没要求把部队交出去。\n\n条件很简单：彼此留一条能办事的线，往后有利可图时互相照应。"
 v65network.10.a:0 "替我回信，先留一个联络处。"
 v65network.10.b:0 "让他找别人。"
 v65network.110.t:0 "西贡总统府回信了"
 v65network.110.d:0 "地址、姓名和联络时间都在纸上。接电话的人未必最有权，但至少知道谁能签字。余下的要靠来往把关系养起来。"
 v65network.110.a:0 "把号码抄进私人本子。"
