l_simp_chinese:
 v65_rear_networks:0 "州内后方与游击网络"
 v65_rear_networks_desc:0 "后方网络分三级，直接削弱当地补给与可用人力。清剿与村庄协议影响所选州；解放阵线可培植网络并发动起义。"
 v65_rear_pressure_1:0 "潜伏联络网"
 v65_rear_pressure_1_desc:0 "当地后方压力第1级：本地补给减少0.05，可用人力减少4%。军区清剿、村庄协定和外部渗透可改变等级。"
 v65_rear_pressure_2:0 "活动中的游击网络"
 v65_rear_pressure_2_desc:0 "当地后方压力第2级：本地补给减少0.10，可用人力减少8%。军区清剿、村庄协定和外部渗透可改变等级。"
 v65_rear_pressure_3:0 "武装起义准备"
 v65_rear_pressure_3_desc:0 "当地后方压力第3级：本地补给减少0.15，可用人力减少12%。军区清剿、村庄协定和外部渗透可改变等级。"
 v65_rear_patrol_14:0 "$V65_STATE_14$：清剿"
 v65_rear_patrol_14_desc:0 "当前网络等级：[?14.v65_rear_level|0]/3。降低1级，只影响本州。清剿消耗45政治点并降低2民心；村庄协议消耗70政治点并增加3民心。"
