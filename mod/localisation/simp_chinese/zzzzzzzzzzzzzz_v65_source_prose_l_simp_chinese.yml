l_simp_chinese:
 v65story.5104.d:0 "清晨时分，归仁市，朴世诚司令官双手提了提，自己刚穿好的裤子，转头看了一下床上的两个女人，随后仿佛是用感叹的语气，自言自语道，“一般。”走出房间后，在门外恭候多时的金大卫赶忙把武装带递给了朴世诚。朴世诚顺手接过武装带，系在自己的腰间，抽出自己的手枪，看了看，然后对着金大卫发问道，“部队出发没？”"
 v65story.5107.d:0 "他们先是把各个愿意投奔到富国岛的华人家族的资产甩卖掉，然后和南越国军勾结，用低价购买当地的企业，乃至是小作坊，把他们生产工具统统转移到富国岛去，最后则是通过南越国军，逼迫那些土豪和地主，让他们组建乡镇武装，再把朴世诚掏来的垃圾武器，卖给他们。"
 v65story.5113.d:0 "虽然南越政府要求富国岛守备司令部分一批部队过去组建什么机动部队，但并没有多要多少人啊，101特战团人数也不多，战斗力也比较强，用来干什么坏事那是再合适不过了，更重要的是101特战团的指挥官，是许家洛信得过的赵朝伟，相信这支部队到西贡后，肯定不会被其他人拉拢。"
 v65story.5114.d:0 "按照朴世诚在建议上所说，在维新宪法上，确立这么一支部队的存在，既：大韩民国维新革命卫队，职责和现在的特战司差不多，同样是反制北傀的急先锋，打击黑恶犯罪的无情铁手，但还要加上维护韩国海外利益的职责，以及作为维新体制的武力保障。"
 v65story.5116.d:0 "而南越方面在顺化及其周边的部队，则有南越的第一军、海军陆战队第一师、第一别动突击队（该部刚重组完毕），第三机动部队第十三旅，第五机动部队第101特战团（富国岛的部队），第二、三空降旅，还有朴世诚自己的第五空输旅团（只到位了一个大队的兵力）以及其他如第八十守备团、第1后勤支援大队等，韩越两军的独立单位。"
 v65story.5119.d:0 "东河，南越国军东河战术集群指挥部（刚成立不久，也被称之为阮文明兵团），才冒险乘坐直升机抵达东河前线，刚被朴世诚任命为东河集群指挥官的第三军军长阮文明中将，正低头看着自己面前的地图，在他身旁几个参谋正在给他讲解现在东河敌我双方的局势。"
 v65story.5121.d:0 "远在越南的朴世诚，此刻则正在顺化东北方，富旺县拉波钦海滩。虽然广治-东河的战役还在进行之中，虽然吴光长兵团还未完全收复广治，虽然阮文明兵团还在东河以南坚持，但朴世诚最高司令官在忙碌之余，还是在忙碌之余，抽出了难得的时间来度假钓鱼。"
 v65story.5124.d:0 "“耶，最高司令官同志。”郑言月躬身回答后，起身看着在场的所有人，然后出声说道，“就下属看来，南伪军的这份特别军事行动准则，可是给我军提供了一个惩戒南伪方面的办法，既然南伪军可以用这种所谓的特别军事行动，对我军发起进攻，那么同样的，我军也可以用发布这种特别军事行动准则的法子，对南伪军发起进攻，还不用过于担忧爆发第二次朝鲜战争......”"
 V65_PKS_DESC:0 "被驻越韩军司令部（注1）设为了韩军的战略预备队，平常就驻扎在平定省地区，并不会深入到越南的农村地区去，而朴世诚的第133机械化大队，则被编为了归仁市的卫戍部队，也可以看做是预备队的预备队。\n\n\n　　暂时不用出动深入越南山区，那自然也就不容易遭遇越南游击队咯，所以朴世诚自然也就宽心了下来，开始思索自己这在越南能干点啥。"
 v65chapter_pks_root_desc:0 "被驻越韩军司令部（注1）设为了韩军的战略预备队，平常就驻扎在平定省地区，并不会深入到越南的农村地区去，而朴世诚的第133机械化大队，则被编为了归仁市的卫戍部队，也可以看做是预备队的预备队。\n\n\n　　暂时不用出动深入越南山区，那自然也就不容易遭遇越南游击队咯，所以朴世诚自然也就宽心了下来，开始思索自己这在越南能干点啥。"
 v65chapter_pks_relations_special_command_desc:0 "而特战司和驻越韩国军也有不少的合作，就连特战司令官朴世诚本人，也在越韩国军内部任过职，而且在前段时间朴世诚，还担任了驻越韩国军的机动部队司令官，指挥了驻越韩国军部队和特战司的部队，与越共打了一场大会战，并取得了胜利。"
 v65chapter_svn_relations_special_command_desc:0 "而特战司和驻越韩国军也有不少的合作，就连特战司令官朴世诚本人，也在越韩国军内部任过职，而且在前段时间朴世诚，还担任了驻越韩国军的机动部队司令官，指挥了驻越韩国军部队和特战司的部队，与越共打了一场大会战，并取得了胜利。"
