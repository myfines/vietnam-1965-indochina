 v65_rotation_desc:0 "“司令官，我军已经大范围收缩部署态势，目前我军主要部队都维持在几条主要的交通干线，平定省我军目前仅在归仁市还留有兵力，其他城市的防御任务已经移交给越南国军，目前部队撤离仍有序进行中，第九师团的所有部队已经在本月完全撤回了国内，下个月开始将撤离野战医院等独立单位，首都机械化师团预计明年开始撤离。”"
 v65_park_shadow_ruler_desc:0 "按照朴世诚在建议上所说，在维新宪法上，确立这么一支部队的存在，既：大韩民国维新革命卫队，职责和现在的特战司差不多，同样是反制北傀的急先锋，打击黑恶犯罪的无情铁手，但还要加上维护韩国海外利益的职责，以及作为维新体制的武力保障。"
 v65_trail_network_desc:0 "“...............不要怕伤亡，南部各地的游击队都开始抽调精锐部队，从老挝和柬埔寨过来增援，我就在外围，援兵会源源不断的抵达，你部一定要坚持到底。”“是！将军同志，我保证人在城在，无论伪军投入多少力量，广治都会是伪军的坟墓，我部绝不主动放弃任何一寸土地。”“好！很有信心！一切就交给你了，有任何需要，立即联系我。”文进勇很是满意的拍了拍这个少将的肩膀。"
