 v65chapter_pks_island_phu_quoc_plan_desc:0 "作战会议室内，大韩民国国军陆军特战司令官，朴世诚小将和富国岛军政长官李威炎，两人正坐在一幅大大的沙盘旁的两张大沙发上，滋润的抽着多米尼加雪茄。在他们周围还有众多的韩越两军军官，正在安静的听着，富国岛守备司令部司令许家洛，就越南局势的讲解。"
 v65chapter_svn_island_phu_quoc_plan_desc:0 "作战会议室内，大韩民国国军陆军特战司令官，朴世诚小将和富国岛军政长官李威炎，两人正坐在一幅大大的沙盘旁的两张大沙发上，滋润的抽着多米尼加雪茄。在他们周围还有众多的韩越两军军官，正在安静的听着，富国岛守备司令部司令许家洛，就越南局势的讲解。"
 v65_DNM_hue_desc:0 "而南越方面在顺化及其周边的部队，则有南越的第一军、海军陆战队第一师、第一别动突击队（该部刚重组完毕），第三机动部队第十三旅，第五机动部队第101特战团（富国岛的部队），第二、三空降旅，还有朴世诚自己的第五空输旅团（只到位了一个大队的兵力）以及其他如第八十守备团、第1后勤支援大队等，韩越两军的独立单位。"
 v65_NVN_hold_desc:0 "文进勇自言自语道，“就这么收兵实在是有点难看，再怎么说，也得占到一些便宜，面子上才过得去才行呀。”文进勇的这话，仿佛突然之间打开了黎仲迅的思维，猛的一下转头看着文进勇说道，“老文，你刚刚说什么？”“就这么收兵有点难看。”文进勇有些诧异的说道。“不对，不是这句，是后面的。”黎仲迅赶忙说道。"
 v65_NVN_rear_offensive_desc:0 "黎·巴图鲁·仲迅，笑着说道，“那在东河的部队就继续死守东河，324师继续带领游击队袭击广治，尽可能黏住广治的伪军，给我们的迁移工作争取时间。”文进勇沉默了好一会，仿佛这的确是个不错的办法，用游击队拖延南越的进军，虽然会造成不少的伤亡，但成果却是，留给南越一片白地，己方获得了人口、粮食、设备、资源，怎么看都是己方赚了呀。"
 v65_personal_connections_desc:0 "私产：[?SVN.v65_private_wealth|0]/100　享受：[?SVN.v65_private_comfort|0]/100\n这里按人情办事，不按国界涂色。关系25可租借军需站，50可分红，70可介入军区任命。每个关系50以上、仍与朴和平的外部伙伴每月提供1点私产；关系每月消退1点，战时断交额外消退5点。\n朴移驻或接管南越不会重建这本账。\n\n虽然南越政府要求富国岛守备司令部分一批部队过去组建什么机动部队，但并没有多要多少人啊，101特战团人数也不多，战斗力也比较强，用来干什么坏事那是再合适不过了，更重要的是101特战团的指挥官，是许家洛信得过的赵朝伟，相信这支部队到西贡后，肯定不会被其他人拉拢。"
