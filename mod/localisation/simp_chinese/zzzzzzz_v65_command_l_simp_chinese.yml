 v65_command_politics:0 "中央、军区与私人势力"
 v65_command_politics_desc:0 "中央威望：[?SVN.v65_central_prestige|0]/100\n本军区忠诚：[?v65_regional_loyalty|0]/100\n朴系人脉：[?PKS.v65_personal_network|0]/10\n威望低于30且军区忠诚低于25时，军区可以抗命；抗命后可逼宫或起兵。"
 v65_fund_command:0 "补发军饷，确认指挥关系"
 v65_fund_command_desc:0 "消耗75政治点。中央威望增加8，各附属军区忠诚增加8。每90天一次。"
 v65_park_recruit_clients:0 "安插军需与军官联系人"
 v65_park_recruit_clients_desc:0 "消耗50政治点。朴系人脉增加1，影响力增加1。上限10，每60天一次。"
 v65_park_build_retinue:0 "通过关系扩充直属部队"
 v65_park_build_retinue_desc:0 "需要2点人脉与完整控制的驻地。消耗75政治点，在当前首都组建一个直属步兵团；每90天一次。"
 v65_park_request_command:0 "用部队与补给换取指挥权"
 v65_park_request_command_desc:0 "需要3点人脉。消耗75政治点，影响力增加2，南越中央威望降低5。每120天一次。"
 v65_park_takeover:0 "要求接管南越中央"
 v65_park_takeover_desc:0 "需要至少6点人脉、5点影响力，南越中央威望低于40且仍控制首都。南越可以接受，也可以拒绝；拒绝后朴可另走已有的军事干预路线。"
 v65_park_inside:0 "朴系掌握实际指挥权"
 v65_park_inside_desc:0 "南越名义政府保留，朴系控制跨军区指挥与补给任命。军区忠诚仍须维持。"
 v65_central_respected:0 "中央命令仍然有效"
 v65_central_respected_desc:0 "中央威望不低于65。每日政治点增加0.10，计划速度增加5%。"
 v65_central_discredited:0 "各军区自行其是"
 v65_central_discredited_desc:0 "中央威望低于30。每日政治点减少0.15，计划速度降低10%；低忠诚军区可以抗命。"
 v65command.1.t:0 "军区要求改组中央"
 v65command.1.d:0 "军区拒绝调兵，要求总统府交出部分军饷与任命权。接受会保住现有指挥关系；拒绝后，军区可以退让或起兵。"
 v65command.1.a:0 "承认既成事实，拨款续约。"
 v65command.1.b:0 "拒绝，维持原命令。"
 v65command.2.t:0 "中央拒绝让步"
 v65command.2.d:0 "总统府要求立即恢复调度。司令部需要决定是否继续服从。"
 v65command.2.a:0 "解除隶属，起兵反对中央。"
 v65command.2.b:0 "暂时服从。"
 v65command.3.t:0 "朴要求接管指挥系统"
 v65command.3.d:0 "朴系已在军官、军需和地方部队中建立关系网。朴提出接管跨区调度，保留南越政府名义。"
 v65command.3.a:0 "接受，合并远征集团。"
