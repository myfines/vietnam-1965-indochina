l_simp_chinese:
 V65_SOUTHERN_COALITION:0 "南方防务协调会"
 V65_LIBERATION_FRONT:0 "民族解放联合阵线"
 v65_prepared_defence:0 "纵深防御准备"
 v65_intelligence_network:0 "常设情报联络网"
 v65_guerrilla_network:0 "南方游击网络"
 v65_regional_network:0 "归仁军政网络"
 v65_dmz_standoff:0 "十七度线对峙"
 v65_defeat_shock:0 "前线溃败的政治冲击"
 v65_requires_front_defeat:0 "前线败局已经动摇政府：广治或顺化失守，或南方芽庄与大叻同时被解放阵线控制。"
 v65campaign.1.t:0 "败报传到归仁"
 v65campaign.1.d:0 "西贡正在追究前线失利的责任。驻军开始寻找可靠的盟友，而朴世诚收到的联络也不再只是运输和补给。要维持联盟，还是把危机变成自己的机会？"
 v65campaign.1.a:0 "先确认哪些部队还听从命令。"
 v65campaign.2.t:0 "西贡的命令彼此矛盾"
 v65campaign.2.d:0 "前线失利后，不同派系向岘港发来了不同的命令。军区必须先保证防区不出现真空，再决定如何回应首都。"
 v65campaign.2.a:0 "先稳住前线与港口。"
 v65campaign.2.b:0 "要求中央重新确认军费与权限。"
 v65campaign.3.t:0 "归仁部队宣布进军"
 v65campaign.3.d:0 "朴世诚以恢复秩序为由，宣布不再接受西贡现有指挥体系。沿海联盟的裂缝已经变成新的战线；首都驻军的态度将决定政府还能否继续运转。"
 v65campaign.3.a:0 "保住首都的通信与驻军。"
 v65politics.1.t:0 "败报之后：谁来负责？"
 v65politics.1.d:0 "前线防线失守，责任之争涌入总统府。军官开始互相指责，广播台、总参谋部和周边驻军的服从也不再理所当然。花费政治点争取首都周边驻军；支持不足而强行摊牌，将引发内战。"
 v65politics.6.d:0 "南方地下组织利用秘密运输线建立了新的武装据点。这是一支真实出现于后方的解放阵线部队；北线调兵无法自动解决乡村与交通线的威胁。"
 v65_trail_desc:0 "北方通道等级：[?NVN.v65_trail_level|0]。南方可动员次数：[?FNL.v65_infiltration|0]。每月恢复通道和组织能力；解放阵线可在南方腹地建立据点，北越玩家也可代为组织。"
 v65_infiltrate_desc:0 "消耗南方组织能力与北方通道储备，在仍由西贡控制的目标省份建立一支真实的解放阵线部队。目标从邦美蜀、大叻、西宁、边和与美萩的后方地块中选择。"
 v65_coup_desc:0 "必须先发生前线溃败。争取西宁、边和、头顿、美萩驻军后再行动：三处支持足够则和平夺权，一至两处可能引发内战，没有支持则政变失败。"
