l_simp_chinese:
 v65_highland_disruption:0 "西原交通线断裂"
 v65_highland_disruption_desc:0 "西原重镇失守后的90天内，撤退与补给中断降低部队组织度，并增加补给消耗。"
 v65_southern_holdouts:0 "三角洲与离岛的继续抵抗"
 v65_southern_holdouts_desc:0 "首都失守不等于所有地方部队都已放下武器。三角洲或富国岛仍可维持政府机构，提供额外投降抵抗与防御。"
 v65stages.1.t:0 "西原的道路正在断裂"
 v65stages.1.d:0 "波来古或邦美蜀失守，内陆道路上的撤退队伍挤成长龙。北部战术区、沿海军区和西贡接到的命令互相矛盾。总统府必须决定，是付出政治代价重组指挥，还是接受收缩防区的现实。西原的败局也已经打开首都的政治危机。"
 v65stages.1.a:0 "重组指挥，准备继续作战。"
 v65stages.1.b:0 "收缩防区，保存主力。"
 v65stages.2.t:0 "来自西原的求援电话"
 v65stages.2.d:0 "西原军官请求归仁提供武器和协调指挥。他们愿意接受顾问，却不愿交出自己的部队。援助能够扩大朴世诚的影响，也会使他背上下一场败仗的责任。"
 v65stages.2.a:0 "提供六百支步枪，派联络官。"
 v65stages.2.b:0 "保住归仁，不接手别人的败局。"
 v65stages.3.t:0 "西贡失守，战争尚未结束"
 v65stages.3.d:0 "总统府的通信已经中断，幸存机关正向仍在控制中的三角洲或富国岛转移。大陆军区与离岛驻军有着不同的打算；只要后方还有土地和部队，政府便继续抵抗。控制首都的人尚未控制整个南方。"
 v65stages.3.a:0 "以现存军区继续抵抗。"
 v65stages.3.b:0 "拨款建设富国岛后方。"
