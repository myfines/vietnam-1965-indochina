l_simp_chinese:
 v65_north_plans:0 "北方战局与南方牵制"
 v65_north_reassess:0 "重议十七度线战局"
 v65_north_reassess_desc:0 "北越与西贡交战、$V65_STATE_9$失守时开放；本局一次。选择整理正面防御或补充小道运输，随后由南方决定是否配合牵制。"
 v65_south_delay:0 "提出南方牵制方案"
 v65_south_delay_desc:0 "$V65_STATE_9$失守、解放阵线仍与西贡交战时，可独立提出牵制方案；与北方来函共用一次机会。"
 v65north.1.t:0 "就这么收兵有点难看"
 v65north.1.d:0 "文进勇自言自语道，“就这么收兵实在是有点难看，再怎么说，也得占到一些便宜，面子上才过得去才行呀。”文进勇的这话，仿佛突然之间打开了黎仲迅的思维，猛的一下转头看着文进勇说道，“老文，你刚刚说什么？”“就这么收兵有点难看。”文进勇有些诧异的说道。“不对，不是这句，是后面的。”黎仲迅赶忙说道。"
 v65north.1.a:0 "先整理正面防御。"
 v65north.1.b:0 "给南方牵制争取运输。"
 v65north.2.t:0 "用游击队拖延南越的进军"
 v65north.2.d:0 "黎·巴图鲁·仲迅，笑着说道，“那在东河的部队就继续死守东河，324师继续带领游击队袭击广治，尽可能黏住广治的伪军，给我们的迁移工作争取时间。”文进勇沉默了好一会，仿佛这的确是个不错的办法，用游击队拖延南越的进军，虽然会造成不少的伤亡，但成果却是，留给南越一片白地，己方获得了人口、粮食、设备、资源，怎么看都是己方赚了呀。"
 v65north.2.a:0 "让游击队黏住南越部队。"
 v65north.2.b:0 "先整顿现有部队。"
