 v65_HLC_briefing:0 "西原军区的第一本账"
 v65_HLC_briefing_desc:0 "西原军区得到军政自主权，也接过地方叛乱、采购与安置责任。中央援助可以改善关系，不能替代司令部自己的决定。"
 v65_HLC_local_0_0:0 "山地道路"
 v65_HLC_local_0_0_desc:0 "西原军区：山地道路。地方政府需要把保护承诺、军费与实际执行对上，中央的支援只能解决其中一部分。"
 v65_HLC_local_0_1:0 "熟悉村庄的向导"
