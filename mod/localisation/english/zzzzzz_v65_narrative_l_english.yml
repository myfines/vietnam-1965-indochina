l_english:
 v65story.101.t:0 "证件上的印章"
 v65story.101.d:0 "地方官把一叠空白证件推到桌边。“钱按老规矩分，村子就肯配合。”\n\n朴世诚没有立刻接笔。窗外的翻译正在问一个老人：没有证件，是不是就不能把米送进城？\n\n这不是一份单纯的治安账。军警、地方官和村民，都在等他决定谁来承担这场战争的成本。"
 v65story.101.a:0 "照旧分账，先让地方机构运转。"
 v65story.101.b:0 "公开收费标准，接受乡村代表申诉。"
 v65story.1101.t:0 "后来的一封信：证件上的印章"
 v65story.1101.a:0 "账面收入超过了预期，地方警察也很快交来了新的名册。夜间运输队却发现，愿意带路的村民少了。秘书把两份报告放在一起，没有说哪一份更接近成功。"
 v65story.1101.b:0 "村长带来了几条过去不肯说的路。办证收入变少，军警联络员也开始抱怨；但第一支巡逻队沿着新向导指出的田埂平安返回。"
 v65story.1101.next:0 "把它收进这一年的档案。"
 v65story.102.t:0 "镜头之外的人"
 v65story.102.d:0 "记者请士兵重新站到缴获武器旁边。参谋递来的战报比军医的伤亡记录漂亮得多。\n\n“上面要能放在报纸上的胜利。”联络官说。\n\n朴世诚看见营房后面排着等候抚恤的家属。两本账必须有人签字。"
 v65story.102.a:0 "让报纸刊登那份胜利。"
 v65story.102.b:0 "把伤亡附在战报后面。"
 v65story.1102.t:0 "后来的一封信：镜头之外的人"
 v65story.1102.a:0 "晋升与追加军需一同到来。新的作战计划也据此高估了可用兵力。参谋在计划角落写下缺额，签发时又把那一页抽了出来。"
 v65story.1102.b:0 "报纸没有采用那张照片，上级的回信也很冷淡。军医第一次发现，下一批补充员名额与实际缺额对得上了。"
 v65story.1102.next:0 "把它收进这一年的档案。"
 v65story.103.t:0 "日海的第一份长约"
 v65story.103.d:0 "日海代表带来了一份长期运输合同。价格足以让部队不再月月等拨款，附件却要求采购优先经过同一批中间人。\n\n金钟泌翻到最后一页：“合同签下来，别人会欠你人情。你也会欠别人。”\n\n军需独立和私人依赖，写在同一张纸上。"
 v65story.103.a:0 "接受独家合同，建立自己的军需网络。"
 v65story.103.b:0 "拆分采购，保留核查与退出条款。"
 v65story.1103.t:0 "后来的一封信：日海的第一份长约"
 v65story.1103.a:0 "卡车准时抵达，临时拨款不再是每天的争吵。另一份需要签字的名单也到了：几位与合同有关的军官，希望下一轮任命不要把他们排除在外。"
 v65story.1103.b:0 "采购速度慢了一些，几家商号退出了报价。修械所却收到了更齐全的备件单。独立性没有带来新的朋友，只减少了一项无法推掉的承诺。"
 v65story.1103.next:0 "把它收进这一年的档案。"
 v65story.201.t:0 "撤军表上的空格"
 v65story.201.d:0 "撤军计划把原来的驻地涂成了空白。军区希望接收车辆，日海希望接收仓库，西贡希望所有移交都先经过总统府。\n\n“东西留下，人走了，谁来维护？”参谋问。\n\n每一种答案都会改变下一场战争里谁能向谁开口。"
 v65story.201.a:0 "用军需合同接管库存。"
 v65story.201.b:0 "把设备与维修队一同交给地方军区。"
 v65story.1201.t:0 "后来的一封信：撤军表上的空格"
 v65story.1201.a:0 "车队扩大了，维修账也扩大了。军官们开始把合同视作自己的财产，普通部队则越来越难从正式仓库领到零件。"
 v65story.1201.b:0 "地方军区送来了一份简短的收据。几个月后，他们终于不必每次等外援才能修好车辆；他们的司令也因此更不愿交出采购权。"
 v65story.1201.next:0 "把它收进这一年的档案。"
 v65story.202.t:0 "岛上的第二套公章"
 v65story.202.d:0 "富国岛的港务人员把船舶登记、军营名册和家属安置表送到西贡。三本账使用了三套印章。\n\n岛上联络人说：“把人送来容易，把他们的生活安顿下来，不能只靠一道军令。”\n\n总统府必须决定，这座岛是中央的仓库，还是拥有自己政治价格的后方。"
 v65story.202.a:0 "允许特别区自主管理港口与安置。"
 v65story.202.b:0 "保持中央任命，拨款改善港口。"
 v65story.1202.t:0 "后来的一封信：岛上的第二套公章"
 v65story.1202.a:0 "船期稳定下来，家属也有了住处。下一次请求调走岛上部队时，回电先问了一句：岛上的防务由谁保证？"
 v65story.1202.b:0 "新拨款终于让码头工程开工。地方官照旧向中央报账，等待审批的队伍也更长了。港口可以扩大，信任却没有随工程一起交付。"
 v65story.1202.next:0 "把它收进这一年的档案。"
 v65story.203.t:0 "第五支机动部队"
 v65story.203.d:0 "西贡要求抽调岛上骨干，组成一支能够跨区出动的机动军。名单上的军官分别接受不同人的保荐。\n\n“他们会服从一张作战图。”联络官说，“但升迁和军饷不在同一本账里。”\n\n这支部队会成为预备队，也可能成为下一场政治危机的筹码。"
 v65story.203.a:0 "由协调会直接掌握任命。"
 v65story.203.b:0 "分散骨干，训练各区自己的预备队。"
 v65story.1203.t:0 "后来的一封信：第五支机动部队"
 v65story.1203.a:0 "命令变快了。被绕过的军区司令开始要求书面确认：这支机动军进入他们防区时，究竟接受谁的命令？"
 v65story.1203.b:0 "几支地方预备队陆续完成整训。没有一支足够显眼，足以出现在首都的阅兵场上；也没有一张调令，能把所有骨干同时带走。"
 v65story.1203.next:0 "把它收进这一年的档案。"
 v65story.301.t:0 "广治以南的路"
 v65story.301.d:0 "北线传来的电话断了两次。参谋在广治与顺化之间反复画线，伤员后送表则压在地图下方。\n\n军区要求立即增援。另一位将军提醒总统府，南方乡村并没有因为北线告急而安静下来。\n\n守住一道线和保存一支军队，第一次显得不像同一件事。"
 v65story.301.a:0 "让精锐进入预备阵地。"
 v65story.301.b:0 "扩大纵深，准备有秩序地收缩。"
 v65story.1301.t:0 "后来的一封信：广治以南的路"
 v65story.1301.a:0 "增援提高了守军的信心，后方巡逻却变得稀疏。几名省长在同一天请求调回驻军，总参谋部没有足够的兵力同时答应他们。"
 v65story.1301.b:0 "仓库开始向后转移。报纸质问政府是否已经准备放弃前沿；军医和运输官却第一次拿到了一份能够执行的撤收顺序。"
 v65story.1301.next:0 "把它收进这一年的档案。"
 v65story.302.t:0 "每个司令自己的战争"
 v65story.302.d:0 "各军区的报告都写着“情况可控”，附件却各自要求更多军费。总统问，如果把地方治安交回军区，中央还能管什么。\n\n秘书回答：“管他们之间的事。军援、任命、停火，还有谁愿意在别人的防区里流血。”\n\n地图可以继续只用一种颜色，也可以承认它早已有几套命令。"
 v65story.302.a:0 "建立跨区参谋机构，维持中央指挥。"
 v65story.302.b:0 "承认军区自治，各自处理内部叛乱。"
 v65story.1302.t:0 "后来的一封信：每个司令自己的战争"
 v65story.1302.a:0 "联络人员增加了，争执并没有减少。中央仍然能签发调令，也必须为每一个被抽空巡逻力量的县承担责任。"
 v65story.1302.b:0 "新的军区旗帜出现在作战图上。地方官终于能直接找到负责的司令，首都却失去了几本税收账。下一场危机将考验联盟，而不只是总统的签字。"
 v65story.1302.next:0 "把它收进这一年的档案。"
 v65story.303.t:0 "公报与病床"
 v65story.303.d:0 "停火谈判让战果数字变得格外重要。参谋递来一份适合公布的总结，军医随后送来一份适合补员的名单。\n\n朴世诚问，有没有可能让它们成为同一份文件。办公室里没有人立刻回答。"
 v65story.303.a:0 "先发布胜利，争取更多援助。"
 v65story.303.b:0 "按真实缺额组织轮换。"
 v65story.1303.t:0 "后来的一封信：公报与病床"
 v65story.1303.a:0 "援助承诺比实际物资来得更快。下一轮计划仍按旧编制计算兵力，基层军官只好把休养中的士兵也填进出勤表。"
 v65story.1303.b:0 "漂亮的总结被压在抽屉里。几支营获得轮休，新兵也终于分到真实存在的岗位。没有人因此获得晋升，但下一份伤亡表短了一些。"
 v65story.1303.next:0 "把它收进这一年的档案。"
 v65story.401.t:0 "西原撤退预案"
 v65story.401.d:0 "西原的道路在地图上很清楚，在雨季报告里却没有那么可靠。军区司令要求保证他的部队先撤，地方行政要求保证家属先撤。\n\n参谋知道，所有人同时上路，最后可能谁也走不了。\n\n预案还没有启动，各派已经开始争夺撤退顺序。"
 v65story.401.a:0 "优先保全部队与军需。"
 v65story.401.b:0 "公开安置顺序，给平民留出运力。"
 v65story.1401.t:0 "后来的一封信：西原撤退预案"
 v65story.1401.a:0 "军需储备增加了，乡村却开始自行寻找出路。被排在撤退名单后面的家属把消息告诉了每一个愿意听的人。"
 v65story.1401.b:0 "车队的速度没有变快，争抢却少了一些。省长第一次愿意把真实人口与粮食缺口交给军方，而不是先替自己的亲信留下座位。"
 v65story.1401.next:0 "把它收进这一年的档案。"
 v65story.402.t:0 "总统府的两封回电"
 v65story.402.d:0 "同一个求援电话收到了两封回电：一封命令固守，一封要求保存主力。两封都盖着合法的印章。\n\n阮文绍把它们摊在桌上：“你们希望我做决定，还是希望我替你们签字？”\n\n朴世诚的联络人没有否认问题。军头能接受协调，未必能接受失去自己的部队。"
 v65story.402.a:0 "保留总统名义，由军政协调会决定调动。"
 v65story.402.b:0 "要求各军区公开自己的保存兵力计划。"
 v65story.1402.t:0 "后来的一封信：总统府的两封回电"
 v65story.1402.a:0 "调动顺序终于统一了。几位将军也送来了他们的保留条款。协调会可以让总统的命令变得有效，却不能假装这些承诺没有代价。"
 v65story.1402.b:0 "有的军区如实交表，有的只交来一个大概数字。中央得到了一张不那么好看的作战图，也第一次看清哪些承诺根本无法兑现。"
 v65story.1402.next:0 "把它收进这一年的档案。"
 v65story.403.t:0 "留给岛上的保证"
 v65story.403.d:0 "岛上联络人要求一份不写在公报里的保证：无论大陆如何变化，不能把所有难民、武器和未完成的战争都压到富国岛。\n\n“我们可以做后方。”他说，“不能永远替别人保存一个没有退路的将来。”"
 v65story.403.a:0 "继续援助大陆，但限制新的承诺。"
 v65story.403.b:0 "把岛作为下一次反攻的基地。"
 v65story.1403.t:0 "后来的一封信：留给岛上的保证"
 v65story.1403.a:0 "船上的货单被重新核定。援助仍在继续，空出来的舱位则装上了药品与家属的行李。停止许诺，并没有比继续作战容易。"
 v65story.1403.b:0 "军营里重新挂起了训练计划。地方官随后送来粮食与住房缺口：每一批准备反攻的人，也要在岛上生活。"
 v65story.1403.next:0 "把它收进这一年的档案。"
 v65story.501.t:0 "谁在替谁维持秩序"
 v65story.501.d:0 "一名地方司令拒绝把部队调离辖区。他的回电只有一句话：中央的战报里没有写进昨晚被袭击的粮站。\n\n联络官问，是处分他，还是先看看那份本地治安报告。\n\n共同的旗帜没有消除各自的战争。"
 v65story.501.a:0 "以援助换取联合作战承诺。"
 v65story.501.b:0 "承认本地优先，安排共同联络。"
 v65story.1501.t:0 "后来的一封信：谁在替谁维持秩序"
 v65story.1501.a:0 "部队终于调动了，军区也得到了新的军需清单。下一次请求将沿用同一套价格。合作可以购买，却无法仅靠购买维持。"
 v65story.1501.b:0 "军区留下了主力，派来几名熟悉乡村的联络官。中央少了一支可以直接使用的部队，多了一条终于愿意说实话的通信线。"
 v65story.1501.next:0 "把它收进这一年的档案。"
 v65story.502.t:0 "国境线上的旧仓库"
 v65story.502.d:0 "北方送来的联络人没有在仓库前停车。当地指挥员说，货物属于越南的战争，守仓的人却卷在柬埔寨自己的内战里。\n\n一份中立声明不能让两边的战线消失。政府与革命军都在问：这条通道最后会让谁失去选择？"
 v65story.502.a:0 "继续以通道换取军需和外交筹码。"
 v65story.502.b:0 "缩减秘密运输，先处理本国村庄。"
 v65story.1502.t:0 "后来的一封信：国境线上的旧仓库"
 v65story.1502.a:0 "军需抵达了，联络人员也更频繁地出入。地方官发现，关闭一座已经接纳许多利益的仓库，远比最初开放时困难。"
 v65story.1502.b:0 "几辆车空着返回边境。本地的粮食征购暂时缓了一口气，外部联络人则要求重新谈判原有的承诺。"
 v65story.1502.next:0 "把它收进这一年的档案。"
 v65story.503.t:0 "孩子记得的是哪一年"
 v65story.503.d:0 "军属学校的老师问孩子，战争从哪一年开始。有人答不出来，有人说，从自己出生以前。\n\n秘书把这段话写进安置报告，又划掉了。报告应该写粮食、学额和军饷，不该问一场战争已经占去了多少人的一生。"
 v65story.503.a:0 "继续优先保障军队与动员。"
 v65story.503.b:0 "把安置、学校与轮休写进正式预算。"
 v65story.1503.t:0 "后来的一封信：孩子记得的是哪一年"
 v65story.1503.a:0 "动员计划照常执行。学校没有关门，只是越来越多的学生在学期中途离开。军队仍然需要人，家里也仍然需要人。"
 v65story.1503.b:0 "预算争论持续了很久。老师收到新课本时，没有人把它称作胜利。至少这个学期，名单上的大多数孩子还留在教室里。"
 v65story.1503.next:0 "把它收进这一年的档案。"
 v65story.601.t:0 "粮袋与姓名"
 v65story.601.d:0 "运输队把粮袋堆到树下，村干部却先递来了阵亡人员的名字。\n\n“这一批能送到前线。”他说，“下一批还要有人愿意帮我们送。”\n\n动员表上没有写出每个家庭已经承担了多少。"
 v65story.601.a:0 "按前线需要扩大征集。"
 v65story.601.b:0 "给村庄留出粮食与轮换名额。"
 v65story.1601.t:0 "后来的一封信：粮袋与姓名"
 v65story.1601.a:0 "物资抵达了。村庄仍然完成任务，但向导不再主动补充那些没有被问到的消息。运输线更长，回答问题的人却更少。"
 v65story.1601.b:0 "第一批货物少了一些。下一次召集时，运输队终于多了几位认识山路、也愿意回来的向导。"
 v65story.1601.next:0 "把它收进这一年的档案。"
 v65story.602.t:0 "白天的合作对象"
 v65story.602.d:0 "一名地方商人愿意提供仓库，条件是他的亲属不被当作敌方线人。游击队长认为这是投机，联络员则说，这是目前唯一能避开检查站的货栈。\n\n乡村里的关系，从来没有战报上那样整齐。"
 v65story.602.a:0 "接受有条件的地方合作。"
 v65story.602.b:0 "拒绝私人交换，维持组织纪律。"
 v65story.1602.t:0 "后来的一封信：白天的合作对象"
 v65story.1602.a:0 "仓库用上了，新的保护关系也随之建立。联络员必须不断解释，为什么某些熟悉的面孔没有出现在同一张名单上。"
 v65story.1602.b:0 "队伍改走更远的山路。纪律没有破例，运输人员也记下了这次决定的代价。"
 v65story.1602.next:0 "把它收进这一年的档案。"
 v65story.603.t:0 "停火之后的另一份命令"
 v65story.603.d:0 "前线需要补充，地方干部希望恢复生产。两封电报都说自己的任务不能再等。\n\n军官把复员名单推到一边：“战争还没有结束。”\n\n书记问，如果每一次恢复生活都必须等待最后的胜利，谁来告诉人们最后还有多久？"
 v65story.603.a:0 "保持动员，为下一轮进攻储备。"
 v65story.603.b:0 "恢复基层生产与有限轮休。"
 v65story.1603.t:0 "后来的一封信：停火之后的另一份命令"
 v65story.1603.a:0 "储备增加了，轮休仍然推迟。地方生产报告开始使用越来越乐观的估计，军队也据此安排下一批征集。"
 v65story.1603.b:0 "一部分人回到了田间和修械所。军队少了一批立即可用的补充员，地方却重新有了能够支撑下一年的生产。"
 v65story.1603.next:0 "把它收进这一年的档案。"
 v65story.604.t:0 "夺取之后，怎样留下"
 v65story.604.d:0 "进入城镇的部队需要粮食与住宿，地方干部需要知道旧机构里哪些人还能留下。\n\n一位军官说，地图上的颜色已经变了。书记回答，地图不会替他们收拾明天的市场。"
 v65story.604.a:0 "先以军令统一地方。"
 v65story.604.b:0 "保留可用的行政与民生网络。"
 v65story.1604.t:0 "后来的一封信：夺取之后，怎样留下"
 v65story.1604.a:0 "命令很快传到各处。商铺重新开门的速度却不一样，夜间报告里的陌生名字也越来越多。"
 v65story.1604.b:0 "整编比计划中慢。市场、学校和供水逐渐恢复，地方终于开始讨论战争以外的问题。"
 v65story.1604.next:0 "把它收进这一年的档案。"
 v65story.605.t:0 "王宫与参谋部"
 v65story.605.d:0 "金边的会议分成两张桌子。王宫讨论外交，参谋部讨论边境和军费。两边都希望对方不要把本国的战争变成别人的通道。\n\n外面的内战不会等待这场争论结束。"
 v65story.605.a:0 "给参谋部更大的征调权。"
 v65story.605.b:0 "坚持地方预算与军费核查。"
 v65story.1605.t:0 "后来的一封信：王宫与参谋部"
 v65story.1605.a:0 "部队补充得更快，地方征粮也更加频繁。军方认为这是稳定，王宫的来访者却越来越常谈到不满。"
 v65story.1605.b:0 "一些军费申请被退回重填。地方官得到了喘息，参谋部则要求政府对延误承担责任。"
 v65story.1605.next:0 "把它收进这一年的档案。"
 v65story.606.t:0 "谁来代表柬埔寨"
 v65story.606.d:0 "政府军仍在与红色高棉交战，金边的政治人物却已经开始争论国家的下一套名义。\n\n朗诺希望建立共和国。王室支持者提醒他，换一块招牌不会自动让边境和乡村服从。\n\n这是政治路线的分岔，不是换一行地图文字。"
 v65story.606.a:0 "建立高棉共和国，由军方承担责任。"
 v65story.606.b:0 "保留王国名义，重新谈判军政权限。"
 v65story.1606.t:0 "后来的一封信：谁来代表柬埔寨"
 v65story.1606.a:0 "公文换了抬头，军方获得更多任命权。政府仍然要回答原来的问题：谁来提供粮食，谁来保护道路，谁承担内战的成本。"
 v65story.1606.b:0 "王室名义被保留下来，各方签署了一份新的权限清单。条款可以写得清楚，执行它们的人却仍在互相试探。"
 v65story.1606.next:0 "把它收进这一年的档案。"
 v65story.607.t:0 "根据地里的登记册"
 v65story.607.d:0 "基层组织要统一粮食、人员和武器的登记。地方干部说，村庄里的亲属、债务与迁移，不会因为一张新表格而消失。\n\n年轻的指挥员把账册合上。他必须决定，是先要求服从，还是先弄清自己准备管理什么。"
 v65story.607.a:0 "以军事纪律执行统一征集。"
 v65story.607.b:0 "允许基层说明差异，维持村庄生产。"
 v65story.1607.t:0 "后来的一封信：根据地里的登记册"
 v65story.1607.a:0 "登记册按时上交。下面的人却开始隐藏缺额，干部从报表里看到的村庄越来越整齐，实际能找到的粮食越来越少。"
 v65story.1607.b:0 "登记慢了下来，一些问题终于不再被改成好看的数字。指挥员仍能征集物资，也开始知道哪里已经承受不起下一次征集。"
 v65story.1607.next:0 "把它收进这一年的档案。"
 v65story.608.t:0 "越境来的联络人"
 v65story.608.d:0 "越南联络人带来了军需承诺，也带来了新的运输要求。根据地需要援助，基层干部则担心，自己的政治决定会越来越依赖一条外部通道。\n\n接过物资容易，规定这份关系的边界更难。"
 v65story.608.a:0 "扩大共同通道与军需合作。"
 v65story.608.b:0 "限制外部条件，优先根据地自身补给。"
 v65story.1608.t:0 "后来的一封信：越境来的联络人"
 v65story.1608.a:0 "仓库里多了武器，会议上也多了需要考虑的外部意见。地方指挥员发现，有些要求已经不能只用本国的账目解释。"
 v65story.1608.b:0 "部分援助没有抵达。基层生产与运输被迫承担更多任务，但政府的下一份命令至少仍能由自己的人决定。"
 v65story.1608.next:0 "把它收进这一年的档案。"
 v65story.801.t:0 "1968：军援离开之后"
 v65story.801.d:0 "撤军表使部队开始清点自己真正掌握的东西：仓库、军饷、村庄和能继续工作的维修队。对外援的依赖正在变成对军区和合同的依赖。\n\n案头的数字记录着此前的选择：民心、派系依赖、战争疲劳和军区关系都将带入这一幕。国策中的军事优先与社会契约互斥，新的阶段替换旧政策。"
 v65story.801.a:0 "继续写这一年的记录。"
 v65story.802.t:0 "1971：一张地图，几套命令"
 v65story.802.d:0 "机动军、岛上后方与地方军区都希望获得更多资源。共同的敌人仍在，但谁来签发任命、谁来支付军饷，已经决定了命令能够走多远。\n\n案头的数字记录着此前的选择：民心、派系依赖、战争疲劳和军区关系都将带入这一幕。国策中的军事优先与社会契约互斥，新的阶段替换旧政策。"
 v65story.802.a:0 "继续写这一年的记录。"
 v65story.803.t:0 "1974：保存什么，放弃什么"
 v65story.803.d:0 "西原与首都的危机让各派重新计算承诺。保存精锐、保护平民、保住政府与保护私人网络，越来越难同时做到。\n\n案头的数字记录着此前的选择：民心、派系依赖、战争疲劳和军区关系都将带入这一幕。国策中的军事优先与社会契约互斥，新的阶段替换旧政策。"
 v65story.803.a:0 "继续写这一年的记录。"
 v65story.804.t:0 "1977：战争进入地方社会"
 v65story.804.d:0 "正规战线没有消除夜间的枪声。地方行政、难民安置与军官利益构成了另一张地图。继续征集容易，重建合作则需要兑现过去的承诺。\n\n案头的数字记录着此前的选择：民心、派系依赖、战争疲劳和军区关系都将带入这一幕。国策中的军事优先与社会契约互斥，新的阶段替换旧政策。"
 v65story.804.a:0 "继续写这一年的记录。"
 v65story.805.t:0 "1979：十四年以后"
 v65story.805.d:0 "有些军官还在等待下一次攻势，有些家庭只希望知道明年的学校是否继续开门。十四年留下的机构、人情和伤口，必须由活下来的人接着管理。\n\n案头的数字记录着此前的选择：民心、派系依赖、战争疲劳和军区关系都将带入这一幕。国策中的军事优先与社会契约互斥，新的阶段替换旧政策。"
 v65story.805.a:0 "继续写这一年的记录。"
 v65_story_archive:0 "战时档案与人物关系"
 v65_story_archive_desc:0 "朴与西贡的互信：[SVN.v65_park_trust|0]　首都政治关系：[SVN.v65_thieu_trust|0]　离岛信任：[SVN.v65_island_trust|0]\n每年的关键场景按日期出现。选择会留下全局剧情标记，并在45天后的信件或报告中回响。正式合并会保留西贡作为后续剧情的锚点。"
 v65story.901.t:0 "十四年之后，留下来的是什么"
 v65story.901.d:0 "档案柜的最上层装着最早的证件与调令，下面几层是合同、撤退计划、安置名单和没有兑现的承诺。\n\n秘书问，最后一卷应该叫什么。没有人愿意把它简单地叫作胜利，或者失败。\n\n民心、派系网络与长期疲劳仍将影响今后的生活。这是十四年叙事的尾声；玩家可以保留现有秩序、在条件允许时推动停火，也可以继续战争。"
 v65story.901.park:0 "总统仍在台前。协调会的电话、任命名单与合同则经过另一张桌子。朴世诚没有需要公开宣布的头衔，却必须继续兑现对军区的保证。\n\n十四年把年轻军官变成了一个制度。人们记得他的方式，取决于制度给他们留下了什么。"
 v65story.901.island:0 "大陆的消息仍然乘船抵达。岛上已经有了新的学校、新的军营，也有了不认识大陆故乡的孩子。\n\n离岛政权可以继续准备返回，也可以先决定怎样让留在这里的人生活下去。"
 v65story.901.a:0 "承认我们维持下来的秩序，继续治理。"
 v65story.901.b:0 "以民意和疲劳为依据，结束目前的战争。"
 v65story.901.c:0 "战争还没有结束。"
 v65_memory_of_war:0 "十四年的共同记忆"
 v65_memory_of_war_desc:0 "共同经历提供了一点合作的基础，却不会抹去地方社会与军官网络之间的分歧。"
 v65_fragile_peace:0 "脆弱而真实的停火"
 v65_fragile_peace_desc:0 "停火使社会可以喘息。军队转向防御，未解决的争执仍需以制度与谈判处理。"
 v65_RKH_briefing:0 "丛林中的另一种国家"
 v65_RKH_briefing_desc:0 "革命根据地必须同时面对金边的军队、村庄的生活与越境援助的条件。军事扩张并不能替代治理。"
