 v65_SVN_act_1979:0 "十四年以后"
 v65_SVN_act_1979_desc:0 "有些军官还在等待下一次攻势，有些家庭只希望知道明年的学校是否继续开门。十四年留下的机构、人情和伤口，必须由活下来的人接着管理。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
