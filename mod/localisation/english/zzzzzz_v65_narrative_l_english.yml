 v65_NVN_act_1968_desc:0 "撤军表使部队开始清点自己真正掌握的东西：仓库、军饷、村庄和能继续工作的维修队。对外援的依赖正在变成对军区和合同的依赖。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
 v65_NVN_act_1968_security:0 "1968：把战区放在首位"
 v65_NVN_act_1968_security_desc:0 "军援离开之后之后，司令部要求优先补充军队。强化指挥、训练和战区政策，会提高部队表现，也扩大派系依赖并消耗民心。"
 v65_NVN_act_1968_civilian:0 "1968：与地方重新立约"
 v65_NVN_act_1968_civilian_desc:0 "军援离开之后之后，地方社会要求恢复生产与可兑现的保护。增加民用产能、后勤和情报能力，降低疲劳；较慢的动员也意味着放弃部分进攻效率。"
 v65_NVN_act_1971:0 "一张地图，几套命令"
 v65_NVN_act_1971_desc:0 "机动军、岛上后方与地方军区都希望获得更多资源。共同的敌人仍在，但谁来签发任命、谁来支付军饷，已经决定了命令能够走多远。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
 v65_NVN_act_1971_security:0 "1971：把战区放在首位"
 v65_NVN_act_1971_security_desc:0 "一张地图，几套命令之后，司令部要求优先补充军队。强化指挥、训练和战区政策，会提高部队表现，也扩大派系依赖并消耗民心。"
