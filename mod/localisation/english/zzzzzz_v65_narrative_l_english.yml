 v65_SVN_act_1971_civilian_desc:0 "一张地图，几套命令之后，地方社会要求恢复生产与可兑现的保护。增加民用产能、后勤和情报能力，降低疲劳；较慢的动员也意味着放弃部分进攻效率。"
 v65_SVN_act_1974:0 "保存什么，放弃什么"
 v65_SVN_act_1974_desc:0 "西原与首都的危机让各派重新计算承诺。保存精锐、保护平民、保住政府与保护私人网络，越来越难同时做到。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
