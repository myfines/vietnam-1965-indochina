 v65_DNM_act_1974_security_desc:0 "保存什么，放弃什么之后，司令部要求优先补充军队。强化指挥、训练和战区政策，会提高部队表现，也扩大派系依赖并消耗民心。"
 v65_DNM_act_1974_civilian:0 "1974：与地方重新立约"
 v65_DNM_act_1974_civilian_desc:0 "保存什么，放弃什么之后，地方社会要求恢复生产与可兑现的保护。增加民用产能、后勤和情报能力，降低疲劳；较慢的动员也意味着放弃部分进攻效率。"
 v65_DNM_act_1977:0 "战争进入地方社会"
 v65_DNM_act_1977_desc:0 "正规战线没有消除夜间的枪声。地方行政、难民安置与军官利益构成了另一张地图。继续征集容易，重建合作则需要兑现过去的承诺。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
 v65_DNM_act_1977_security:0 "1977：把战区放在首位"
 v65_DNM_act_1977_security_desc:0 "战争进入地方社会之后，司令部要求优先补充军队。强化指挥、训练和战区政策，会提高部队表现，也扩大派系依赖并消耗民心。"
 v65_DNM_act_1977_civilian:0 "1977：与地方重新立约"
 v65_DNM_act_1977_civilian_desc:0 "战争进入地方社会之后，地方社会要求恢复生产与可兑现的保护。增加民用产能、后勤和情报能力，降低疲劳；较慢的动员也意味着放弃部分进攻效率。"
 v65_DNM_act_1979:0 "十四年以后"
 v65_DNM_act_1979_desc:0 "有些军官还在等待下一次攻势，有些家庭只希望知道明年的学校是否继续开门。十四年留下的机构、人情和伤口，必须由活下来的人接着管理。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
