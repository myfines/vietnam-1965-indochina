 v65_SVN_act_1977:0 "战争进入地方社会"
 v65_SVN_act_1977_desc:0 "正规战线没有消除夜间的枪声。地方行政、难民安置与军官利益构成了另一张地图。继续征集容易，重建合作则需要兑现过去的承诺。\n\n本阶段先清点预算与组织，再选择军事优先或社会契约。方案互斥，完成任一方案后才能进入下一阶段。"
