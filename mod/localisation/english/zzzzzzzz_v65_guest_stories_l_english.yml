l_english:
 v65_guest_mediation:0 "南越军区停火斡旋"
 v65guest.cancel:0 "撤回斡旋提案。"
 v65_guest_mediation_desc:0 "需要西贡与至少一个地方军区实际交战，且富国岛特别区存在并控制本岛。发起方选择交战军区；军区、富国岛、西贡、军区依次答复。四方同意后，只结束该军区与西贡的战争；30天未完成则失效。"
 v65guest.1.t:0 "吴光长不准先开第一枪"
 v65guest.1.a:0 "向岘港军区递交斡旋提案。"
 v65guest.1.b:0 "向西原军区递交斡旋提案。"
 v65guest.1.c:0 "向湄公河军区递交斡旋提案。"
 v65guest.1.e:0 "向东南军区递交斡旋提案。"
 v65guest.2.t:0 "槟知政变急转直下"
 v65guest.2.a:0 "同意把条件交富国岛传递。"
 v65guest.2.b:0 "拒绝继续会谈。"
 v65guest.3.t:0 "西贡陷落后的斡旋请求"
 v65guest.3.a:0 "接受斡旋，要求西贡书面答复。"
 v65guest.3.b:0 "拒绝介入。"
 v65guest.4.t:0 "富国岛向西贡传话"
 v65guest.4.a:0 "接收条件，交由交战军区答复。"
 v65guest.4.b:0 "拒绝该项停火提议。"
 v65guest.5.t:0 "富国岛保留岛上主力"
 v65guest.5.a:0 "接受双方已同意的内部停火。"
 v65guest.5.b:0 "拒绝停火，维持战争。"
 v65guest.6.t:0 "归仁第二战术区收缩防线"
 v65guest.6.a:0 "要求前线核对撤退部署。"
 v65guest.6.b:0 "暂不调整防线。"
 v65guest.7.t:0 "阮总统昏倒后的转进命令"
 v65guest.7.a:0 "讨论以总统名义发布命令。"
 v65guest.7.b:0 "暂缓发布命令。"
 v65guest.8.t:0 "援助分配激化军区不满"
 v65guest.8.a:0 "召开军区协调会核对分配。"
 v65guest.8.b:0 "维持现有分配。"
 v65guest.1.d:0 "吴光长现在头皮头发麻了，他不想和杨文明的政变军打，可又不想让他们政变成功，而其寄希望于说合，因此，他绕过了南越国防部，直接给槟知城内的守军下达了全面警戒，但不准开第一枪的命令。"
 v65guest.2.d:0 "26日的政变行动，刚开始都还一切顺利，政变军顺利的占领了不少的政府机构，可等到吴光长通电表示，他要坚决站在阮文绍一方后，整个槟知的局面对于杨文明他们而言，那简直就是急转直下，特别是吴光长手中的第八装甲骑兵团进城后，大量政变军占领的据点都开始陆续丢失。"
 v65guest.3.d:0 "而危在旦夕的吴光长，在西贡陷落之后，便立即请李威炎从中说和。经过了长时间的沟通，当越共都已经开始尝试进攻吴光长的湄公河防线之后，双方总算是达成了一份协议。"
 v65guest.4.d:0 "最后个大佬自然就是李威炎咯，李威炎可是富国岛的军政长官，富国岛现在的坚若磐石的局面，可完全是李威炎缔造的，名望在整个富国岛上简直是无人能比，在加上他背后有美国人和韩国人撑腰，因此李威炎在现在的南越政局的话语权最重。如果不是李威炎的身体不好，而且其本人也无意当什么总统，不然的话，李威炎完全可以在美国和韩国的支持下，成为南越总统。"
 v65guest.5.d:0 "更重要的是，如果失败了，最好能通过这场所谓的大反攻，大量消耗掉，杨文明和吴光长手中的兵力，让他们两人都变成光杆司令。那这越南共和国的总统位置，他阮文绍坐的，他杨文明坐的，我李威炎就坐不得了？也正是因为这个原因，富国岛这次派出的反攻部队，不同于杨文明和吴光长把自己的精锐部队派了上去，富国岛派出的部队，绝大部分都是临时从难民营里，临时组建的炮灰部队，富国岛真正的主力，可都在富国岛上面纹风不动呢。"
 v65guest.6.d:0 "1975年3月16日，上午十时许，越南共和国，归仁市，第二战术区司令部，作战会议室内。第二战术区司令官阮文明上将，此刻正双手拄着自己的下巴，看着会议室内的各个长官。自从朴世诚司令官明确了将要逐步撤出第一、第二战术区后，情况最严重的第二战术区各部队便开始收缩防御，准备进行撤退了。"
 v65guest.7.d:0 "吴光长沉默了好一会，然后低声说道，“总长，现在阮总统晕倒的消息还没传出，就我个人认为，应该立即以阮总统的名义，发布转进命令，让部队迅速转进。”转进自然是应该的，可这用阮文绍的名义，就让高文园有些犯难了，以阮文绍的性格，要是知道了高文园这么干，后面不找高文园的麻烦那几乎是不可能的事。"
 v65guest.8.d:0 "阮文绍在拿到了美国的投资之后（美国看到南越政权有稳住的迹象了，又开始重新注资了，只不过并不算太多，这次南越仅拿到了一笔价值5000万美元的援助，实际到账估计也就2000万吧，毕竟还有想要进步的美国专员嘛，而且这笔援助也不都是现金，还有不少是武器装备呢），做主把大头的金钱和武器装备都分配给了阮文明和吴光长，其中阮文明占了差不多一半分配比例。他杨文明和高文园几乎只拿到了很少的一些，这就让杨文明相当的不爽了。"
