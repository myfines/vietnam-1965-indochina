l_english:
 v65_regional_government:0 "军区、中央与地方战争"
 v65_devolve:0 "将治安与军政权下放各战区"
 v65_devolve_desc:0 "提出军区自治方案。确认后将中央实际掌握的西原、东南、湄公河与富国岛地区交给拥有本地部队、以指挥协定联系的自治军区；各区动员驻军、处理本地叛乱并承担财政。中央失去直接控制，可援助并协商重新整合。"
 v65_decentralized_command:0 "军区自治体制"
 v65_decentralized_command_desc:0 "各区独立掌握土地和驻军，负责辖区治安。中央命令协调较慢，但不必亲自处置每一处乡村冲突。"
 v65_local_command:0 "本地军政司令部"
 v65_local_command_desc:0 "军区依靠自己的预算、警务和部队维持统治。中央援助提高忠诚，军警镇压与乡村协商各有长期代价。"
 v65_reintegrated_command:0 "重新签署的战区协定"
 v65regions.1.t:0 "一张地图，几本军饷账"
 v65regions.1.d:0 "联络官把西原、湄公河、东南与富国岛涂成了不同颜色。\n\n“每个司令都说自己能管好辖区。”总统府秘书停了一下，“条件是军饷和任命都由他们自己签。”\n\n下放权力可以让地方部队专心对付自己的游击网络，也会把中央的命令变成下一轮谈判。归仁和岘港现有的独立指挥体系将继续存在。"
 v65regions.1.a:0 "签署军区自治协议。"
 v65regions.1.b:0 "暂缓，仍由中央直接负责。"
 v65regions.2.t:0 "自治后的第一份治安报告"
 v65regions.2.d:0 "县长在白天报平安，巡逻队却在夜里失去了两名向导。司令部桌上放着征粮清单、村长的请愿书和中央迟来的电报。\n\n自治没有让战争消失，只让每一个决定都更靠近负责签字的人。选择清剿、协商或情报甄别，将影响当地民心与下一次武装爆发。"
 v65regions.2.a:0 "从本地的账开始。"
 v65_subsidize_HLC:0 "向西原军区拨付军需"
 v65_reintegrate_HLC:0 "协商整合西原军区"
 v65_play_HLC:0 "接手扮演西原军区"
 v65_subsidize_MKG:0 "向湄公河军区拨付军需"
 v65_reintegrate_MKG:0 "协商整合湄公河军区"
 v65_play_MKG:0 "接手扮演湄公河军区"
 v65_subsidize_BHD:0 "向东南军区拨付军需"
 v65_reintegrate_BHD:0 "协商整合东南军区"
 v65_play_BHD:0 "接手扮演东南军区"
 v65_subsidize_PHQ:0 "向富国岛特别区拨付军需"
 v65_reintegrate_PHQ:0 "协商整合富国岛特别区"
 v65_play_PHQ:0 "接手扮演富国岛特别区"
