 v65_lobby_23:0 "西宁：通道与边境驻军——争取驻军"
 v65_lobby_23_desc:0 "西宁：通道与边境驻军\n当前支持：[?23.v65_loyalty|0]/100。花费35政治点，支持增加20。60以上视为掌控；战区丢失后不计支持。"
 v65_lobby_24:0 "边和：空军基地与总参联系——争取驻军"
 v65_lobby_24_desc:0 "边和：空军基地与总参联系\n当前支持：[?24.v65_loyalty|0]/100。花费35政治点，支持增加20。60以上视为掌控；战区丢失后不计支持。"
 v65_lobby_26:0 "头顿：港口与海军——争取驻军"
 v65_lobby_26_desc:0 "头顿：港口与海军\n当前支持：[?26.v65_loyalty|0]/100。花费35政治点，支持增加20。60以上视为掌控；战区丢失后不计支持。"
 v65_lobby_27:0 "美萩：湄公河门户——争取驻军"
 v65_lobby_27_desc:0 "美萩：湄公河门户\n当前支持：[?27.v65_loyalty|0]/100。花费35政治点，支持增加20。60以上视为掌控；战区丢失后不计支持。"
 v65_martial:0 "颁布全国戒严令（非军事区除外）"
 v65_martial_desc:0 "颁布全国戒严令（非军事区除外）。各项数值变化显示在决议效果中。"
 v65_end_martial:0 "解除戒严"
 v65_end_martial_desc:0 "解除戒严。各项数值变化显示在决议效果中。"
 v65_coup:0 "发动首都政变"
 v65_coup_desc:0 "结算四个首都周边州的驻军支持。三个以上支持州：和平成功；一至两个：首都叛乱与内战；零个：失败并损失稳定度和政治点。支持至少60且仍归本国所有才计数。"
 v65_expand_trail:0 "扩建胡志明小道"
 v65_expand_trail_desc:0 "扩建胡志明小道。各项数值变化显示在决议效果中。"
 v65_infiltrate:0 "发动后方渗透"
 v65_infiltrate_desc:0 "运输能力：[?v65_trail_level|0]/5；渗透准备：[?v65_infiltration|0]/2。随机选择邦美蜀、大叻或西宁尚由南越控制的据点，生成一个低装备渗透营；夺取据点会预警南越。消耗一次准备与一级运输能力，冷却45天。"
 v65_interdict:0 "截断小道运输"
 v65_interdict_desc:0 "截断小道运输。各项数值变化显示在决议效果中。"
 v65politics.1.t:0 "驻军与首都的裂缝"
 v65politics.1.d:0 "军政派系要求重新分配职位与军费。政治点可用于争取西宁、边和、头顿与美萩的驻军。总统府、广播台与道路控制将决定危机结局。"
 v65politics.1.a:0 "收到。"
 v65politics.2.t:0 "朴正熙：来自越南的政治资本"
 v65politics.2.d:0 "驻越部队的宣传战果传回韩国。朴正熙希望以援越与增长巩固权力，朴世诚则经营自己的军政网络。韩国境外剧情与西贡政治危机互相牵动，但不是同一场政变。"
 v65politics.2.a:0 "收到。"
 v65politics.3.t:0 "广播台宣布新秩序"
 v65politics.3.d:0 "首都通道与多数驻军接受了新的命令。各军区暂时承认权力交接；这场胜利仍依赖军费和私人忠诚。"
 v65politics.3.a:0 "收到。"
 v65politics.4.t:0 "首都的枪声"
 v65politics.4.d:0 "总统府与地方驻军的命令发生冲突。部分部队宣布成立军政委员会，政治争夺升级为内战。"
 v65politics.4.a:0 "收到。"
 v65politics.5.t:0 "无人响应的命令"
 v65politics.5.d:0 "广播发出后，驻军仍留在营房。政变失去支持，政府追查参与者。"
 v65politics.5.a:0 "收到。"
 v65politics.6.t:0 "后方出现北越渗透部队"
 v65politics.6.d:0 "小道运输网让一支北越部队深入后方。一个交通据点已被夺取，应尽快封锁道路并调动守备队。"
 v65politics.6.a:0 "收到。"
 v65politics.7.t:0 "总统的密使"
 v65politics.7.d:0 "来自韩国的密使带来扩张总统权力的计划。朴正熙要求驻越军方支持直属警卫体系；朴世诚则希望保留自己的人事与军需网络。小说中的维新事件发生于1972年，本事件是可提前展开的架空筹划。"
 v65politics.7.a:0 "支持总统直属体制。"
 v65politics.7.b:0 "换取驻越部队的自主权。"
 v65_SVN_park_mission:0 "朴正熙的援越协议"
 v65_SVN_park_mission_desc:0 "朴正熙把驻越承诺作为援助与政治声望的来源。接待韩国代表团，取得驻越支持。"
 v65_SVN_quynhon:0 "朴世诚与归仁预备队"
 v65_SVN_quynhon_desc:0 "朴世诚的猛虎师部队驻扎归仁；这个战略预备队基地也是他经营独立政治资本的起点。"
 v65_SVN_war_reports:0 "战报与政治宣传"
 v65_SVN_war_reports_desc:0 "把战场战果变成国内声望能够换来晋升，却也让军政体系依赖越来越漂亮的战报。"
 v65_SVN_business:0 "日海军需网络"
 v65_SVN_business_desc:0 "日海的军需与企业网络将军官、地方势力和承包利益连在一起。增加生产能力，同时侵蚀行政公信力。"
 v65_SVN_guards:0 "特战司的权力网络"
 v65_SVN_guards_desc:0 "从驻越人脉到特战司网络，私人忠诚逐渐越过正式的军令关系。"
 v65_SVN_yushin:0 "境外：筹划维新体制"
 v65_SVN_yushin_desc:0 "朴正熙的直属体制与朴世诚的自主网络开始发生分歧。选择支持总统，或换取驻越部队自主权。此为可提前展开的架空筹划。"
 v65_SVN_crisis:0 "西贡派系摊牌"
 v65_SVN_crisis_desc:0 "西贡的军区首脑要求职位与军费。开启四个首都周边州的政治点争夺；多数驻军的忠诚决定政变结局。"
 v65_SVN_radio:0 "掌握广播与通讯"
 v65_SVN_radio_desc:0 "边和的航空与通信联系是控制首都信息流的关键。争取驻军支持，而不是仅向广播台下令。"
 v65_SVN_bargain:0 "军费换取忠诚"
 v65_SVN_bargain_desc:0 "通向西宁与湄公河的交通线必须由愿意服从的部队把守。用军费承诺换取支持。"
 v65_SVN_martial_focus:0 "戒严授权"
 v65_SVN_martial_focus_desc:0 "将行政命令与驻军指挥暂时合一。依照本模组设定，非军事区（广治州的抽象边境地带）不执行戒严。"
 v65_SVN_civilian:0 "文官监督路线"
 v65_SVN_civilian_desc:0 "以公开监督和军费协商缓和派系裂痕，争取港口驻军，而不扩大戒严。"
 v65_SVN_countertrail:0 "小道封锁行动"
 v65_SVN_countertrail_desc:0 "小道封锁行动：在长期战争中重建运输与行政网络。"
 v65_NVN_trail:0 "开辟胡志明小道"
 v65_NVN_trail_desc:0 "通过丛林运输与分散仓库，维持南方战场的人员和装备流动。"
 v65_NVN_depots:0 "丛林中转站"
 v65_NVN_depots_desc:0 "隐蔽中转站提供一次渗透准备；运输能力仍需持续投入政治资源。"
 v65_NVN_rear:0 "后方潜伏网络"
 v65_NVN_rear_desc:0 "把运输网连接到南方后方据点，迫使敌人从正面抽调守备兵力。"
 v65_NVN_offensive:0 "分散南方守备"
 v65_NVN_offensive_desc:0 "分散南方守备：在长期战争中重建运输与行政网络。"
 v65_KHM_neutral:0 "西哈努克的中立路线"
 v65_KHM_neutral_desc:0 "西哈努克的中立路线：在长期战争中重建运输与行政网络。"
 v65_KHM_borders:0 "边境与运输通道"
 v65_KHM_borders_desc:0 "边境与运输通道：在长期战争中重建运输与行政网络。"
 v65_KHM_ports:0 "西哈努克港建设"
 v65_KHM_ports_desc:0 "西哈努克港建设：在长期战争中重建运输与行政网络。"
