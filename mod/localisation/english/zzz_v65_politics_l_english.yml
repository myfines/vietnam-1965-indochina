l_english:
 v65_politics:0 "首都圈：忠诚与权力"
 v65_politics_desc:0 "西贡周边四州的驻军忠诚决定政变结果。每州达到60支持才算掌控；每周反对派削弱5点，戒严时减为2点。掌控三州可和平夺权；一至两州导致内战；没有支持则政变失败。\n西贡本州代表总统府与广播台，周边州代表驻军、机场和交通枢纽。"
 v65_trail:0 "胡志明小道"
 v65_trail_desc:0 "北越可用政治点建设运输网。每月有机会积累一次渗透准备，最多两次；发动后方袭击需要准备、运输能力和政治点。南越可截断补给、围剿潜伏部队。"
 v65_park:0 "朴正熙的崛起：驻越政治资本"
 v65_park_desc:0 "韩国不在本地图内。本线通过驻越代表团与境外事件呈现朴正熙、朴世诚的政治扩权；西贡政变是根据小说派系逻辑改编的独立支线。"
