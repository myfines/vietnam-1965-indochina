 v65_coup:0 "发动首都政变"
 v65_coup_desc:0 "结算四个首都周边州的驻军支持。三个以上支持州：和平成功；一至两个：首都叛乱与内战；零个：失败并损失稳定度和政治点。支持至少60且仍归本国所有才计数。"
 v65_expand_trail:0 "扩建胡志明小道"
 v65_expand_trail_desc:0 "扩建胡志明小道。各项数值变化显示在决议效果中。"
 v65_infiltrate:0 "发动后方渗透"
 v65_infiltrate_desc:0 "运输能力：[?v65_trail_level|0]/5；渗透准备：[?v65_infiltration|0]/2。随机选择邦美蜀、大叻或西宁尚由南越控制的据点，生成一个低装备渗透营；夺取据点会预警南越。消耗一次准备与一级运输能力，冷却45天。"
 v65_interdict:0 "截断小道运输"
 v65_interdict_desc:0 "截断小道运输。各项数值变化显示在决议效果中。"
 v65politics.1.t:0 "驻军与首都的裂缝"
 v65politics.1.d:0 "军政派系要求重新分配职位与军费。政治点可用于争取西宁、边和、头顿与美萩的驻军。总统府、广播台与道路控制将决定危机结局。"
 v65politics.1.a:0 "收到。"
 v65politics.2.t:0 "朴正熙：来自越南的政治资本"
 v65politics.2.d:0 "驻越部队的宣传战果传回韩国。朴正熙希望以援越与增长巩固权力，朴世诚则经营自己的军政网络。韩国境外剧情与西贡政治危机互相牵动，但不是同一场政变。"
 v65politics.2.a:0 "收到。"
 v65politics.3.t:0 "广播台宣布新秩序"
 v65politics.3.d:0 "首都通道与多数驻军接受了新的命令。各军区暂时承认权力交接；这场胜利仍依赖军费和私人忠诚。"
 v65politics.3.a:0 "收到。"
 v65politics.4.t:0 "首都的枪声"
 v65politics.4.d:0 "总统府与地方驻军的命令发生冲突。部分部队宣布成立军政委员会，政治争夺升级为内战。"
 v65politics.4.a:0 "收到。"
 v65politics.5.t:0 "无人响应的命令"
 v65politics.5.d:0 "广播发出后，驻军仍留在营房。政变失去支持，政府追查参与者。"
 v65politics.5.a:0 "收到。"
 v65politics.6.t:0 "后方出现北越渗透部队"
 v65politics.6.d:0 "小道运输网让一支北越部队深入后方。一个交通据点已被夺取，应尽快封锁道路并调动守备队。"
 v65politics.6.a:0 "收到。"
 v65politics.7.t:0 "总统的密使"
 v65politics.7.d:0 "来自韩国的密使带来扩张总统权力的计划。朴正熙要求驻越军方支持直属警卫体系；朴世诚则希望保留自己的人事与军需网络。小说中的维新事件发生于1972年，本事件是可提前展开的架空筹划。"
 v65politics.7.a:0 "支持总统直属体制。"
 v65politics.7.b:0 "换取驻越部队的自主权。"
