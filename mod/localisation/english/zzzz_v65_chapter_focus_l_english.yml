l_english:
 v65chapter_reports:0 "War Reports for Sale"
 v65chapter_reports_desc:0 "Victories, procurement and media can be traded for resources, leaving false claims beside real losses."
 v65chapter_relations:0 "Personal Ties Across Commands"
 v65chapter_relations_desc:0 "Park distributes posts, contracts and command authority among central officers, South Vietnamese proxies and island partners."
 v65chapter_island:0 "Private Life and the Island"
 v65chapter_island_desc:0 "Private comfort, Daihai profits and the Phu Quoc base compete for the same money and relationships."
 v65chapter.100.t:0 "How to Divide the City Hall Money"
 v65chapter.100.d:0 "A large sum seized in the city draws the quartermasters, local officers and Daihai's custodians. Park can keep a side ledger or pay the proxies before they find their own income."
 v65chapter.100.a:0 "Let Daihai hold the money and keep a side ledger"
 v65chapter.100.b:0 "Pay the local officers their share"
 v65chapter.101.t:0 "Who Gets the Unclaimed Victories"
 v65chapter.101.d:0 "Casualties, captured goods and publicity each have their own ledger. Promotion slots for central officers buy influence; allied shares keep local recruiting and supply channels open."
 v65chapter.101.a:0 "Reserve promotion slots for Cai's officers"
 v65chapter.101.b:0 "Give credit and supply shares to allies"
 v65chapter.102.t:0 "Cast Song Kang-mo as a Hero"
 v65chapter.102.d:0 "Daihai Pictures wants to turn an unverified report into a film series. Audiences may remember the hero, or the names in the casualty roll."
 v65chapter.102.a:0 "Produce the hero series"
 v65chapter.102.b:0 "Make a unit documentary"
 v65chapter.110.t:0 "Who Will Hold the Network Together?"
 v65chapter.110.d:0 "Airborne, intelligence and logistics officers all want independent authority. The choice decides whether Park relies on central officers or local agents."
 v65chapter.110.a:0 "Reserve posts for central staff"
 v65chapter.110.b:0 "Put local liaisons in command"
 v65chapter.111.t:0 "Who Gets the Intelligence Channel?"
 v65chapter.111.d:0 "The CIA offers protection and industrial investment for intelligence and credit. The island administrator wants more supplies. Resources are limited."
 v65chapter.111.a:0 "Prioritize the American channel"
 v65chapter.111.b:0 "Give authority to the island agents"
 v65chapter.112.t:0 "Accept the South Vietnamese Officers' Terms"
 v65chapter.112.d:0 "Local officers will provide manpower and titles, but ask for priority weapons and family protection. Their armed network will make demands of its own."
 v65chapter.112.a:0 "Allocate weapons to local officers"
 v65chapter.112.b:0 "Keep control of arms and appointments"
 v65chapter.113.t:0 "Who Chooses the Militia Leaders?"
 v65chapter.113.d:0 "Landowners will fund local forces if rank and command follow their wealth and contributions. The center can accept their order or insist on unified appointments."
 v65chapter.113.a:0 "Recognize landowner-appointed leaders"
 v65chapter.113.b:0 "Place militias under the regional command"
 v65chapter.120.t:0 "A Half-Hour Daily Briefing"
 v65chapter.120.d:0 "Park delegates routine work, spends only thirty minutes to an hour on summaries, smokes by the window and thinks command is almost too comfortable."
 v65chapter.120.a:0 "Keep delegating the routine"
 v65chapter.120.b:0 "Return briefing time to the duty roster"
 v65chapter.121.t:0 "The Parasol at Quy Nhon Pier"
 v65chapter.121.d:0 "Park fishes beneath a parasol at the Quy Nhon pier, with Vietnamese maids and guards nearby, treating an inflated victory ledger as the warrant for a commander's outing."
 v65chapter.121.a:0 "Keep the guards at the fishing spot"
 v65chapter.121.b:0 "Inspect port duty during the outing"
 v65chapter.122.t:0 "A Civilian-Dress Victory Party"
 v65chapter.122.d:0 "After the weak response to the Yeonpyeong shelling, Park and Kim Yongbae change into civilian clothes for a victory party. Keep it private, or let Daihai turn it into propaganda."
 v65chapter.122.a:0 "Celebrate and omit the results"
 v65chapter.122.b:0 "Let Daihai film the victory"
 v65chapter.123.t:0 "Where Should Phu Quoc's Money Go?"
 v65chapter.123.d:0 "The base, quay and residence are all expanding. Spending on private comfort or on rotations and port capacity will shape the island's purpose."
 v65chapter.123.a:0 "Build a comfortable island residence"
 v65chapter.123.b:0 "Expand warehouses and the training quay"
 v65chapter_pks_root:0 "Park's Personal Network"
 v65chapter_svn_root:0 "Take Over the Park Network"
 v65chapter_pks_root_desc:0 "Choose a route through war reports, officer ties or the Phu Quoc enterprise."
 v65chapter_svn_root_desc:0 "Continue the existing route after unification; claimed story rewards cannot be claimed again."
 v65chapter_pks_reports_first_report:0 "The First Quy Nhon Report"
 v65chapter_pks_reports_first_report_desc:0 "Turn the battle at Nguyen village into a result headquarters can see; every number may bring another assignment."
