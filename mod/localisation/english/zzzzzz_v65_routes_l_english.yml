l_english:
 v65_union:0 "归仁与西贡：联合政府谈判"
 v65_cambodian_rear:0 "柬埔寨：中立幕布后的战争"
 v65_park_shadow_ruler:0 "朴世诚：幕后太上皇"
 v65_park_shadow_ruler_desc:0 "总统与内阁仍在台前，朴世诚的军官任命、军需合同与顾问网络则控制着关键决定。统一指挥与采购提高组织度、生产效率和政治点收益；派系对幕后权力的不满降低稳定度。此联合政府结局为模组架空路线。"
 v65_neutral_sanctuary:0 "中立旗帜下的秘密后方"
 v65_neutral_sanctuary_desc:0 "只要柬埔寨不参战且控制桔井与腊塔纳基里，每月为北方通道与南方动员各补充一级，并提供300支步枪。参战或边境失守立即关闭基地；外交压力可能迫使金边封锁通道。"
 v65_faction_compromise:0 "军头的保留条款"
 v65_faction_compromise_desc:0 "军区保留了部分任命权，换取对联合政府的支持。未来180天内政治整合放缓。"
 v65_request_union:0 "提出联合政府议定书"
 v65_request_union_desc:0 "影响力至少5点，归仁与西贡首都均未失守，双方仍属同一联盟且没有交战，才可以谈判。西贡可拒绝并冻结谈判90天。接受后部队、领土和人物归入南越；朴世诚玩家自动接手南越，继续战争。两方均由玩家控制时不开放谈判。"
 v65_open_border_bases:0 "默许北方边境基地"
 v65_seal_border_bases:0 "关闭秘密转运基地"
 v65_border_dossier:0 "向金边提交越境补给证据"
 v65_border_dossier_desc:0 "向金边施压，使其在保留基地、承受政治损失与关闭通道之间选择。不会自动向柬埔寨宣战。"
 v65_cambodian_rear_desc:0 "金边维持公开中立。秘密后方运转时，每月增加北方通道、南方组织能力及步枪储备；解放阵线再通过胡志明小道决议在南方腹地建立武装。边境紧张度：[KHM.v65_border_tension|0]/3。"
 v65routes.1.t:0 "总统府收到联合政府议定书"
 v65routes.1.d:0 "归仁代表提出合并军饷、指挥和行政体系。总统保留职位，朴世诚则掌握军官任命、军需采购与顾问联络。接受可以结束联盟内部的重复机构，也意味着总统府必须容忍一个不在内阁名单上的权力中心。"
 v65routes.1.a:0 "签署议定书，统一南方指挥。"
 v65routes.1.b:0 "总统府不接受这种监护。"
 v65routes.2.t:0 "总统留在台前"
 v65routes.2.d:0 "归仁部队与军需机关已归入南越编制，阮文绍继续主持总统府。朴世诚没有接任国家元首，却在新的军政协调会中握有任命与合同的决定权。各军区暂时签字，没人保证他们会永远服从。"
 v65routes.2.a:0 "真正的权力不必写在名片上。"
 v65routes.4.t:0 "军区拒绝新的任命名单"
 v65routes.4.d:0 "联合政府成立后，第一批军官调任触动了地方派系。军区要求保留自己的晋升渠道。协调会必须拿出补偿，或允许一段时期的人事妥协，否则每一道命令都会变成新的交易。"
 v65routes.4.a:0 "支付整编经费，维持统一任命。"
 v65routes.4.b:0 "用半年的保留条款换取合作。"
 v65routes.5.t:0 "货单背后的丛林基地"
 v65routes.5.d:0 "被截获的运输单据指向桔井与腊塔纳基里。金边没有正式参战，但粮食、武器与人员正从它的边境抵达南方地下组织。我们可以继续截断运输，也可以提交证据，迫使金边回应。"
 v65routes.5.a:0 "整理证据，准备外交交涉。"
 v65routes.6.t:0 "中立声明遭到质疑"
 v65routes.6.d:0 "南方代表提交了一份边境基地清单，要求金边关闭秘密通道。维持默契会消耗政府威信；封锁基地则将失去北方的信任与筹码。边境紧张度越高，继续掩护的代价就越难承担。"
 v65routes.6.a:0 "否认指控，默许基地继续运作。"
 v65routes.6.b:0 "暂时封锁转运通道。"
