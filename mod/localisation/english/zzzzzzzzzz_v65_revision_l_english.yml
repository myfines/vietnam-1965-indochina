l_english:
 v65_private_war:0 "朴系：驻地、账面与派系"
 v65_private_war_desc:0 "驻地随当前首都变化。移动司令部会接收一州和当地指挥权，不会搬走原驻地的所有部队。\n纸面战功 [?v65_paper_victories|0]　实际战功 [?v65_real_victories|0]\n日海 [?v65_clique_daihai|0]　参谋本部 [?v65_clique_staff|0]　南方代理 [?v65_clique_proxy|0]\n派系要求：[v65_faction_request]。各派争的是合同、任命和报功署名。"
 v65_no_request:0 "暂无到期要求"
 v65_daihai_request:0 "日海要求运输合同"
 v65_staff_request:0 "参谋本部要求报功名额"
 v65_proxy_request:0 "南方军官要求军饷份额"
 v65_paper_claim:0 "把友军战果写进本部捷报"
 v65_paper_claim_desc:0 "35政治点。纸面战功+2，日海势力+5，南方代理势力-5。调用现有军需申报机制；核查失败会冻结申报。每60天一次。"
 v65_settle_clique:0 "签下本期派系分账"
 v65_settle_clique_desc:0 "60政治点。满足当前派系要求并支付其具体报酬，清除本期要求。每季度会有新的争夺；忽略到期要求会使相应渠道停止工作。"
 v65_raid_budgets:0 "把南方友军编进本部供应表"
 v65_raid_budgets_desc:0 "50政治点，代理派系+10，南越中央威望-5，获得400支步枪与3000人力。每120天一次。"
 v65_park_coercion:0 "执行封锁与连坐清剿计划"
 v65_park_coercion_desc:0 "80政治点。已控制州网络降低两级，本地叛乱压力-4；民心-12，控制地区的征用与封锁损失合计5000可用人力。形成90天强制治安状态。这是冷酷的军事选择，不增加主角的心理负担数值。"
 v65_park_coercion_spirit:0 "封锁与连坐清剿"
 v65_park_coercion_spirit_desc:0 "通过驻军、征用与集体惩罚压低活动空间；政治点收入下降，守备效率提高。民心损失不会因清剿期结束而返还。"
 v65_democratic_general:0 "“民主神将”"
 v65_democratic_general_desc:0 "报纸、上级和军需合同共同承认的常胜名号。获得至少8点战功，其中至少2点来自实际控制敌方州或压低地方网络；其余可以来自战报。每日政治点+0.15、军需信用上限仍为10。"
 v65_democratic_title:0 "让报纸采用“民主神将”的称呼"
 v65_democratic_title_desc:0 "需要战功总计8、实际战功至少2。消耗50政治点，获得持续声望精神。"
 v65_clique_contract_block:0 "日海扣住合同"
 v65_clique_contract_block_desc:0 "运输合同分配未满足日海的要求。采购效率与政治点收入下降，结清本期分账后解除。"
 v65_clique_staff_block:0 "参谋本部压住任命"
 v65_clique_staff_block_desc:0 "报功署名和晋升名额没有谈妥。每日指挥点和计划速度下降。"
 v65_clique_proxy_block:0 "南方军官扣饷扣人"
 v65_clique_proxy_block_desc:0 "代理军官拒绝继续交出人力和军需。组织度与政治点收入下降。"
 v65rev.1.t:0 "给朴世诚的表彰令"
 v65rev.1.d:0 "西贡发来表彰，首尔准备转载。战报已经盖章，军需处也收到了副本。朴让参谋再印一份，送去谈下一批补给。"
 v65rev.1.a:0 "勋章上墙，战报进账。"
 v65rev.2.t:0 "纱良也有一份战功"
 v65rev.2.d:0 "纱良交来的战报与友军那份用了同一张缴获照片。参谋问署谁的名字；朴看的是追加补给那一栏。"
 v65rev.2.a:0 "先算本部的，给他一个署名。"
 v65rev.2.b:0 "这次让他拿，欠账记下。"
 v65_dissolve_HLC:0 "强制撤销西原军区"
 v65_dissolve_HLC_desc:0 "100政治点。收回全部所有权、库存与部队，接收军区人物。无需忠诚门槛；中央威望-10，其余听令军区忠诚-10。已公开叛乱或与中央交战的军区须通过战争收回。"
 v65_recall_HLC_11:0 "从西原军区收回$V65_STATE_11$"
 v65_recall_HLC_11_desc:0 "25政治点。收回完整控制的非首府州；军区忠诚-8。首府须通过撤销整个军区收回，避免留下没有驻地的军区。"
