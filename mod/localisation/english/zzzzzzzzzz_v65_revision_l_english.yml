 v65_PKS_command:0 "参谋本部的自己人"
 v65_PKS_command_desc:0 "上级要战功与名额，本部要调兵和军需。先把能签字的人列出来。"
 v65_PKS_quynhon:0 "驻地跟着合同走"
 v65_PKS_quynhon_desc:0 "归仁是一个起点，不是永久根据地。联络官把可移驻地点和物资清单交给本部。"
 v65_PKS_reputation:0 "胜利先走公文"
 v65_PKS_reputation_desc:0 "真假战果都要经过参谋、报社和军需处。同一场胜利可以有几套名字。"
 v65_PKS_war_reports:0 "缴获照片再用一次"
 v65_PKS_war_reports_desc:0 "照片换个题注，战果就能再报一遍。签字人也要分到名额。"
 v65_PKS_patron:0 "给参谋本部留名额"
 v65_PKS_patron_desc:0 "上级拿走一个署名，本部多拿一批物资。"
 v65_PKS_palace:0 "按继承人的规格送材料"
 v65_PKS_palace_desc:0 "更高层需要一位能不断交出捷报的年轻军官，朴需要他们继续相信。"
 v65_PKS_villages:0 "南方伪军的账也归本部"
 v65_PKS_villages_desc:0 "给番号、给公文，把人力和征收渠道接进本部供应表。"
 v65_PKS_inspection:0 "让核查的人也有收益"
 v65_PKS_inspection_desc:0 "把分账做稳，比找一个清白的账房更有用。"
 v65_PKS_business:0 "日海财团的驻越账本"
 v65_PKS_business_desc:0 "运输合同把越南军需与韩国国内的人情账接起来。"
 v65_PKS_company:0 "国内分红，前线报功"
 v65_PKS_company_desc:0 "日海收款，上级收材料，本部收补给。"
 v65_PKS_power:0 "把友军变成本部的关系户"
 v65_PKS_power_desc:0 "南方将领需要军饷和保住番号；朴需要他们的人和地。"
 v65_PKS_remain:0 "留下的是人脉和合同"
 v65_PKS_remain_desc:0 "谁当名义首长可以再谈，签军饷和军需的权限不能丢。"
 v65_PKS_island_plan:0 "富国岛计划"
 v65_PKS_island_plan_desc:0 "先留一处独立港口，合同和人员才有第二个去处。"
 v65_PKS_island_lease:0 "租下岛上驻地"
 v65_PKS_island_lease_desc:0 "把特别区与本部的港口安排写进移驻清单。"
 v65_PKS_island_warehouse:0 "把余粮与零件运上岛"
 v65_PKS_island_warehouse_desc:0 "库存先上岛，大陆的作战与分账继续。"
 v65_PKS_island_contracts:0 "给日海留港口份额"
 v65_PKS_island_contracts_desc:0 "岛上基地也要进入韩国国内的账本。"
 v65_PKS_island_cadres:0 "代理团轮驻离岛"
 v65_PKS_island_cadres_desc:0 "南方军官交出人员，本部负责番号和补给。"
 v65_PKS_island_staff:0 "离岛也能签发军令"
 v65_PKS_island_staff_desc:0 "参谋与通信系统必须能随本部转移。"
 v65_PKS_island_base:0 "给任何结局留一个基地"
 v65_PKS_island_base_desc:0 "不是退出生意，只是换一个更难被端走的办公室。"
 v65story.101.b:0 "限定每层抽成，免得下面把人赶跑。"
 v65story.102.t:0 "同一张缴获照片"
 v65story.102.d:0 "缴获照片已经报过一次，换一个题注还能再用。上级要数字，军需处要签名；实际补员另有一张表。"
 v65story.102.a:0 "战果往上写，先把追加军需领了。"
 v65story.102.b:0 "给参谋留实底，免得下次多派任务。"
