 v65_move_park_11:0 "移驻$V65_STATE_11$"
 v65_move_park_11_desc:0 "50政治点，每90天一次。目标须由本部或未叛乱的南方盟军完整控制；若属于盟军，该州移交本部。原有领土保留，直属部队须自行调动。岛上驻地需先完成富国岛计划或取得该岛。"
