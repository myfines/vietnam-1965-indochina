l_english:
 V65_NVN_DESC:0 "北方需要守住阵地，南方需要能够生存的据点。把两者联系起来，才能让战争摆脱单一的正面推进。"
 V65_SVN_DESC:0 "北部的阵地与南方的乡村同时需要兵力。中央还要面对军区、远征军和首都驻军各自的利益。"
 V65_KHM_DESC:0 "柬埔寨希望维持中立，但邻国战争正通过边境与港口进入国内。金边必须同时处理建设和安全。"
 V65_PKS_DESC:0 "这是一条小说人物的架空路线。朴世诚从归仁出发，在战功、企业与私人部队之间积累力量。"
 V65_FNL_DESC:0 "在金瓯、山地和首都外围之间，联络人员维持着松散的地下网络。让这些据点有能力独立行动。"
 V65_DNM_DESC:0 "岘港拥有自己的驻军与港口。军区既是北部防线的后方，也在等待首都权力斗争的结果。"
