l_english:
 v65_us_mission:0 "美军干涉与撤军安排"
 v65_us_firepower:0 "美军干涉：空中与火力支援"
 v65_island_redoubt:0 "富国岛海上基地"
 v65_island_redoubt_desc:0 "岛屿没有陆地通道。港口、岸防与留守部队构成离岛基地；西贡失守时提前启用独立指挥，避免随大陆投降直接移交。仍可遭受实际海上登陆。"
 v65_delay_us_withdrawal:0 "用新一轮捷报争取延后撤军"
 v65_delay_us_withdrawal_desc:0 "120政治点，撤军压力-15，每180天一次。只能在1968—1972年办理；不能无限延后1973年的最终撤军。"
 v65_accept_us_withdrawal:0 "接受提前撤军与装备交接"
 v65us.1.t:0 "干涉部队的作战边界"
 v65us.1.a:0 "把这条界线画清楚。"
 v65us.2.t:0 "撤军，交表"
 v65us.2.a:0 "先把库存领走。"
 v65_us_mission_desc:0 "美军撤军进度：[?SVN.v65_us_withdraw_pressure|0]/100。1968年起每月增加3，达到100或进入1973年撤走。十七度线正面开放，南方火力按进度四档递减。"
 v65_us_firepower_desc:0 "撤军0—24：防御+300%、组织度+60%、进攻+35%、补给消耗-40%。没有非军事区或中立阻隔。"
 v65_accept_us_withdrawal_desc:0 "1968年后可提前结束支援。撤走美军专属部队，移除美军加成，获得1200支步枪和150辆卡车。韩军与台湾国军另行安排。"
 v65us.1.d:0 "十七度线没有中立屏障。美方提供火力与驻军，南方在撤军前拥有明显优势；撤走多少人，就少一档保障。"
 v65us.2.d:0 "美方撤去火力保障，留下移交清单。韩军和国军顾问团各有自己的合同，另行安排。仓库里有什么，接收人签字。"
 V65_STATE_10:0 "广治—十七度线"
 v65_us_firepower_75:0 "美军火力保障：剩余75%"
 v65_us_firepower_75_desc:0 "美军撤军进度25—49：防御+225%、组织度+45%、进攻+25%、补给消耗-30%。下一档会替换本精神。"
 v65_us_firepower_50:0 "美军火力保障：剩余50%"
 v65_us_firepower_50_desc:0 "美军撤军进度50—74：防御+150%、组织度+30%、进攻+15%、补给消耗-20%。下一档会替换本精神。"
 v65_us_firepower_25:0 "美军火力保障：剩余25%"
 v65_us_firepower_25_desc:0 "美军撤军进度75—99：防御+75%、组织度+15%、进攻+5%、补给消耗-10%。下一档会替换本精神。"
