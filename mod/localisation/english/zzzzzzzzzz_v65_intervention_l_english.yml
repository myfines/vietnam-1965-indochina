l_english:
 v65_us_mission:0 "美军干涉与撤军安排"
 v65_us_mission_desc:0 "美军撤军压力：[?SVN.v65_us_withdraw_pressure|0]/100。1968年起每月增加3，达到100或进入1973年撤走。\n广治划为中立监督区：南北双方都不能通过中立区开战推进。撤军时归还南越，正面战线重新开放。"
 v65_us_firepower:0 "美军干涉：空中与火力支援"
 v65_us_firepower_desc:0 "美军驻越战斗群以盟军单位编制表示，驻防顺化、西贡与富国岛。配套火力提高盟军防御、组织与补给能力。广治由中立监督机构隔开南北，不允许部队直接北上。此效果随撤军结束。"
 v65_island_redoubt:0 "富国岛海上基地"
 v65_island_redoubt_desc:0 "岛屿没有陆地通道。港口、岸防与留守部队构成离岛基地；西贡失守时提前启用独立指挥，避免随大陆投降直接移交。仍可遭受实际海上登陆。"
 v65_delay_us_withdrawal:0 "用新一轮捷报争取延后撤军"
 v65_delay_us_withdrawal_desc:0 "120政治点，撤军压力-15，每180天一次。只能在1968—1972年办理；不能无限延后1973年的最终撤军。"
 v65_accept_us_withdrawal:0 "接受提前撤军与装备交接"
 v65_accept_us_withdrawal_desc:0 "1968年后可选择提前结束支援。广治恢复南越所有权，正面重新开放，获得1200支步枪和150辆卡车。"
 v65us.1.t:0 "干涉部队的作战边界"
 v65us.1.d:0 "美方接下了火力与驻防任务，但不批准部队越过监督区。北边暂时不会一路压到西贡，南边的游击队仍要另找办法。"
 v65us.1.a:0 "把这条界线画清楚。"
 v65us.2.t:0 "撤军，交表"
 v65us.2.d:0 "美方撤去额外火力保障，留下移交清单。广治监督区解除，南北正面重新接上。仓库里有什么，接收人签字。"
 v65us.2.a:0 "先把库存领走。"
 V65_STATE_10:0 "十七度线监督区"
