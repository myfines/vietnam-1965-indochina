l_english:
 v65_prepared_defence_desc:0 "工兵、交通壕与预设火力为守军争取准备时间。防御收益需要有部队守住道路与补给节点，不能替代实际驻防。"
 v65_intelligence_network_desc:0 "地方联络员、无线电与核实战报的人员组成通信网络。相关国策进一步建设剧情情报能力，截报决议用于降低地方叛乱压力。"
 v65_guerrilla_network_desc:0 "解放阵线依靠村庄、隐蔽仓库与联络线维持分散作战。胡志明小道决议能够在南方政府或自治军区后方建立真实的武装据点。"
 v65_regional_network_desc:0 "各地司令通过军饷、人事与军需互相联系。地方关系能够支持作战，也使中央命令必须经过更多协商。"
 v65_dmz_standoff_desc:0 "十七度线附近的阵地、工事和补给布局有利于长期防御。正面进攻代价较高，双方仍能通过集中兵力取得突破。"
 v65_defeat_shock_desc:0 "前线失利动摇政府威信与军官信心。首都周边驻军开始重新计算支持对象，政治决议可以争取他们，败局也可能引出政变。"
 v65_martial_law_desc:0 "政府宣布全国戒严，非军事区除外。军警加强控制以维持政治支持，但强制命令无法代替地方合作或改变前线败局。"
 v65_guard_network_desc:0 "首都警卫与驻军联络构成政治支点。它有助于维持命令链，政变结果仍取决于西宁、边和、头顿与美萩驻军的支持。"
 v65_trail_network_desc:0 "隐蔽道路、仓库与转运站连接北方物资和南方游击组织。通道等级与组织准备决定敌后行动能力，南方可使用截断通道决议削弱它。"
 v65_civil_admin_desc:0 "地方行政负责采购、请愿、征募和战争中的日常秩序。持续兑现保护与补偿承诺，可以减轻军警和村庄之间的矛盾。"
 v65_story_governance:0 "案头的战争：人物、情报与地方社会"
 v65_story_governance_desc:0 "民心：[?v65_public_trust|0]　派系依赖：[?v65_patronage|0]　战争疲劳：[?v65_war_fatigue|0]\n本地叛乱压力：[?v65_local_unrest|0]/10　剧情情报能力：[?v65_intelligence|0]/5\n军区对中央忠诚：[?v65_regional_loyalty|0]。人物关系（西贡）：朴世诚[?SVN.v65_park_trust|0]、阮文绍[?SVN.v65_thieu_trust|0]、岛上议会[?SVN.v65_island_trust|0]。机构等级最高五级；民心和疲劳会形成国家精神。情报由剧情决议处理，无需原版特工系统。"
 v65_decentralized_command:0 "军区自治体制"
 v65_local_command:0 "本地军政司令部"
 v65_reintegrated_command:0 "重新签署的战区协定"
 v65_jungle_revolution:0 "丛林革命根据地"
 v65_social_mandate:0 "愿意合作的地方社会"
 v65_social_mandate_desc:0 "民心高于64、派系依赖低于61时，地方协助让征税、征募和行政更有效。"
 v65_civilian_resentment:0 "白天服从，夜里沉默"
 v65_civilian_resentment_desc:0 "民心低于35。村庄不再提供可靠情报，行政与军队的命令也难以得到合作。"
 v65_weariness:0 "疲惫的军营"
 v65_exhaustion:0 "没有结束日期的战争"
 v65_rotation:0 "轮休与补充训练"
 v65_rotation_desc:0 "暂时放缓进攻，为部队轮休和基层训练留出空间。"
 v65_decentralized_command_desc:0 "中央把地方军政交给自治战区。跨区计划速度下降10%，每日政治点减少0.15；地方部队自行维持治安，援助和重新整合需要另行谈判。"
 v65_local_command_desc:0 "本地军政司令部熟悉辖区道路与村庄。防御提高8%，补给消耗降低5%；军区仍须用自己的政治点控制叛乱压力，不能依赖首都自动消灭游击队。"
 v65_reintegrated_command_desc:0 "忠诚军区与中央重新签订指挥协定。计划速度提高8%，每日政治点增加0.10；部队和司令随整合保留，中央重新承担地方战争。"
 v65_jungle_revolution_desc:0 "红色高棉依托东北丛林建立革命根据地。防御提高15%，补给消耗降低15%；与金边的内战、村庄合作和对外依赖决定这一后方能维持多久。"
 v65_weariness_desc:0 "战争疲劳超过54。进攻降低5%，每日政治点减少0.10。轮休、请愿和社会治理路线能够缓解长期消耗；疲劳超过79将进一步恶化。"
 v65_exhaustion_desc:0 "战争疲劳超过79。进攻降低12%，稳定度下降6%，每日政治点减少0.20。轮休与兑现地方承诺能缓解疲劳，继续动员则必须承担这些代价。"
 v65_local_patrol:0 "命令驻军扩大夜间清剿"
 v65_local_patrol_desc:0 "降低3点本地压力，但民心下降4、派系依赖与疲劳上升。军警可以迅速恢复道路控制，也会留下新的怨恨。"
 v65_village_compact:0 "与村长重新签订保护协议"
 v65_village_compact_desc:0 "降低2点本地压力，民心上升6。需要兑现采购与保护承诺，政治成本较高。"
 v65_expand_network:0 "建立新的线人与联络站"
 v65_expand_network_desc:0 "剧情情报能力提升一级，最多五级。情报用于核对战报、保护行动与甄别村庄消息。"
 v65_read_intercepts:0 "核对截获电报与线人报告"
 v65_read_intercepts_desc:0 "消耗一次情报储备，降低2点本地压力，并在90天内保护当地联络。情报行动不使用原版特工槽位。"
 v65_rest_veterans:0 "安排老兵轮休与营级整训"
 v65_rest_veterans_desc:0 "战争疲劳降低8，战争支持度下降3%，30天内部队侧重恢复而非进攻。"
 v65_petitions:0 "听取地方请愿与军属申诉"
 v65_petitions_desc:0 "提高5点民心，降低3点派系依赖和1点本地压力。每半年可举行一次。"
 v65government.3.t:0 "县城以外的地图又变了颜色"
 v65government.3.d:0 "夜间巡逻队送回的报告比白天的行政公报晚了六个小时。地图上的一处联络站已经升起了另一面旗。\n\n“他们不是从北线过来的。”参谋指着粮食征购路线，“人和枪一直在这里。”\n\n这次武装爆发由本军区处置。单靠首都的命令不能让村庄重新提供情报。"
 v65government.3.a:0 "本地部队负责恢复道路。"
 v65_staff_1:0 "参谋与命令链 · 1级"
 v65_staff_1_desc:0 "参谋与命令链的第1级机构。相关国策将机构逐级提升，旧等级会被替换，最高五级。它的长期收益也需要地方社会和持续资源支持。"
