 v65_policy_security_1:0 "战区优先的政治安排 · 第1阶段"
 v65_policy_security_1_desc:0 "这一阶段的长期政策替换先前阶段的安排。军事动员与地方社会各有收益和代价，不能同时采用两种互斥方案。"
